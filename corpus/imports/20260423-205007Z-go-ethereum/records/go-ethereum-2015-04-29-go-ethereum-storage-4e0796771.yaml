missing_property: "consensus-validation"
violated_invariant: "A node's canonical chain numbering should represent one contiguous parent-linked branch selected by total difficulty: for each canonical block at height N, its parent hash should match the canonical block at height N-1. The patch enforces this consistency check more directly during reorg handling, but the provided evidence does not establish a concrete security vulnerability or exploit path."
trust_boundary: "Untrusted transaction data crossing into local execution and admission checks."
entrypoint_type: "transaction validation path"
sensitive_sink: "canonical-chain selection or persistent chain-state update"

