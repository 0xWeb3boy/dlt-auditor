  - "Supply crafted external inputs that reach the affected validation or execution path."
exploit_preconditions:
  - "The crafted input must reach the affected processing path before stronger downstream checks stop it."
  - "The intended validation, policy, or accounting gate is missing, too weak, or applied too late."
  - "Exploitability depends on deployment reachability and surrounding controls because the source evidence is framed as hardening."
blast_radius: "Nodes following the affected path can diverge on validation, canonical-chain choice, or state outcomes."

impact_types: ["consensus-integrity", "canonical-chain-integrity"]
severity_guess: "medium"
severity_rationale: "The evidence supports consensus-integrity, canonical-chain-integrity hardening, but it does not prove a complete exploit path or broad real-world impact."

code_shape_summary: "Fork detection was based on relative block height instead of direct parent-link consistency with the current canonical chain. In a split where the higher-total-difficulty fork was ahead of the current head, the old condition could fail to detect that the incoming block belonged to another branch."
search_motifs:
  - "transaction validation path missing exact checks for canonical chain reorg invariant"
  - "security-sensitive path reaches canonical-chain selection or persistent chain-state update before rejecting malformed or unauthorized input"
  - "Replace indirect height-based fork detection with direct structural validation of the canonical parent-link relationship before reorg handling proceeds"
negative_signals:
  - "Classify as security-hardening rather than confirmed security-fix."
  - "Limit the claim to canonical chain/reorg invariant enforcement."
  - "No proof that invalid blocks bypassed validation."
patch_pattern: "Replace indirect height-based fork detection with direct structural validation of the canonical parent-link relationship before reorg handling proceeds."

