code_shape_summary: "A consensus commitment check in the block-processing path had been disabled by being left inside a block comment. As a result, this function lacked an active rejection path for a mismatch between the transactions carried by the block and the header's `TxSha` commitment. The empty-trie-root normalization is related commitment hygiene, but the provided evidence does not prove it was the primary vulnerability."
