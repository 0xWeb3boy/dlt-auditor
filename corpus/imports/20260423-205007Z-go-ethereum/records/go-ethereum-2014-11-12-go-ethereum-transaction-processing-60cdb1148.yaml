  - "transaction validation path missing exact checks for missing consensus commitment validation"
  - "security-sensitive path reaches canonical-chain selection or persistent chain-state update before rejecting malformed or unauthorized input"
  - "Restore explicit consensus commitment validation in the block-processing path and normalize trie root encoding used by commitment calculations"
negative_signals:
  - "Supported claim: this patch tightens block transaction-root validation in a consensus-sensitive path."
  - "Supported claim: trie root canonicalization is commitment-calculation hygiene."
  - "No commit body or advisory describes a vulnerability or exploit scenario."
patch_pattern: "Restore explicit consensus commitment validation in the block-processing path and normalize trie root encoding used by commitment calculations."

