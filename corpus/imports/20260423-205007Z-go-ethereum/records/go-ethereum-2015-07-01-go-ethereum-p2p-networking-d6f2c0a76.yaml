impact_types: []
severity_guess: "medium"
severity_rationale: "The evidence directly ties the patch to  risk on a reachable security boundary, but the supplied material still limits the claim to what the patch demonstrates."

code_shape_summary: "The hash-fetch loop's continuation decision was not tied to pending hash queue depth. After accepting a valid batch, the downloader continued requesting additional batches without the newly added cap check in this path."
