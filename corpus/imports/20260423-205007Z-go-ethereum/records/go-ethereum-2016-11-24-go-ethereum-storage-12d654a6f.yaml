missing_property: "consensus-validation"
violated_invariant: "Ethereum state transition execution must produce the same post-state across clients for EIP158 empty-account clearing, including when execution uses Snapshot/Revert. If an empty account is touched by a zero-value balance operation, that touch state must be recorded and reverted consistently."
trust_boundary: "Peer-supplied synchronization or protocol data crossing into local validation and scheduling logic."
