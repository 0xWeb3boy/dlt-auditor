  - "The attacker must be able to reach the affected peer-facing protocol path or sync interaction."
  - "The intended validation, policy, or accounting gate is missing, too weak, or applied too late."
  - "Exploitability depends on deployment reachability and surrounding controls because the source evidence is framed as hardening."
blast_radius: "Nodes following the affected path can diverge on validation, canonical-chain choice, or state outcomes."

impact_types: ["consensus-integrity", "state-integrity"]
severity_guess: "medium"
severity_rationale: "The evidence is security-relevant and maps to consensus-integrity, state-integrity, but the finding is framed conservatively because exploitability is not fully demonstrated."

code_shape_summary: "Touching an account was consensus-relevant under the shown EIP158 empty-account clearing path, but the pre-fix behavior did not represent that touch as an independently journaled and revertible state transition. Snapshot/Revert could therefore leave account existence or dirty-state inconsistent with the intended state transition behavior."
search_motifs:
  - "p2p message missing exact checks for consensus state revert bug"
  - "security-sensitive path reaches consensus-visible state transition or journal replay before rejecting malformed or unauthorized input"
  - "Model implicit consensus-relevant state as an explicit journal entry, mutate it through one helper, and implement undo logic so snapshot rollback restores account tracking consistently"
negative_signals:
  - "Valid claim: consensus-relevant state handling for touched empty accounts was corrected or made client-compatible."
  - "Valid claim: Snapshot/Revert behavior for touch state became explicitly journaled and reversible."
  - "No supplied evidence shows attacker-controlled exploitation."
patch_pattern: "Model implicit consensus-relevant state as an explicit journal entry, mutate it through one helper, and implement undo logic so snapshot rollback restores account tracking consistently."

