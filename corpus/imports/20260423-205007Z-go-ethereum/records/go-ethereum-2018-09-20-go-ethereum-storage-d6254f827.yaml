missing_property: "deterministic-fork-choice"
violated_invariant: "When an imported block has total difficulty equal to the current canonical chain, fork choice should not randomly replace a locally authored canonical block with an external same-height competitor. The patch makes local-author preservation an explicit tie-break input, with Clique exempted due to a documented deadlock concern."
