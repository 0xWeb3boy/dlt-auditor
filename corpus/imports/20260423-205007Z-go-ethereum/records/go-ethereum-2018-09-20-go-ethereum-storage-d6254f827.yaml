blast_radius: "Nodes following the affected path can diverge on validation, canonical-chain choice, or state outcomes."

impact_types: ["canonical-chain-integrity", "reorg-resistance"]
severity_guess: "medium"
severity_rationale: "The evidence supports canonical-chain-integrity, reorg-resistance hardening, but it does not prove a complete exploit path or broad real-world impact."

code_shape_summary: "The root cause was a random equal-total-difficulty, same-height fork-choice tie-break that did not account for whether the current canonical block was locally mined. This could cause a self-mined canonical block to be replaced by an external competitor solely due to randomness. The evidence does not support classifying this as persisted state corruption or a block validation flaw."
search_motifs:
  - "rpc method missing exact checks for fork choice tie break hardening"
  - "security-sensitive path reaches expensive RPC-side computation, allocation, or response construction before rejecting malformed or unauthorized input"
  - "Replace random consensus-adjacent tie-break behavior with explicit policy-aware fork-choice logic that can consult local node state, while preserving stronger-chain total-difficulty selection"
