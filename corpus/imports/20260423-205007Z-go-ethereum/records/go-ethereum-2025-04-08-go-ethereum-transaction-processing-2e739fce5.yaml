code_shape_summary: "The issue was missing EIP-7702-aware txpool admission and reservation policy across blobpool and legacy-pool paths. That gap allowed the spam, eviction, and later cancellation pattern described in the commit message when delegated accounts or pending authorities interacted with blob transactions and SetCode transactions."
