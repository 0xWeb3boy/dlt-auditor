code_shape_summary: "The fetcher accepted peer-supplied announcement metadata far enough to schedule fetches without first checking whether the announced transaction type was supported by the local txpool. The commit text says later body validation still rejected mismatched or unsupported responses, so the root cause is early metadata validation missing in the P2P fetch path."
search_motifs:
  - "transaction admission path missing exact checks for p2p metadata validation"
  - "security-sensitive path reaches shared txpool reservation, scheduling, or eviction state before rejecting malformed or unauthorized input"
  - "Validate untrusted P2P announcement metadata at the scheduling boundary using the same local capability model that downstream txpool acceptance relies on"
negative_signals:
  - "Keep only as low-impact P2P resource-hardening, not as a state-integrity fix."
  - "Do not claim transaction bodies were accepted incorrectly; later validation still applies according to the commit body."
  - "No evidence that unsupported announcements could bypass final transaction validation."
patch_pattern: "Validate untrusted P2P announcement metadata at the scheduling boundary using the same local capability model that downstream txpool acceptance relies on."

