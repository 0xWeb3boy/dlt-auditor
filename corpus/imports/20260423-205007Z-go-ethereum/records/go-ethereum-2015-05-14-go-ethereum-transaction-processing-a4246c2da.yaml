blast_radius: "The affected node crosses a security boundary with weaker validation than intended."

impact_types: ["sync-disruption"]
severity_guess: "low"
severity_rationale: "The evidence supports sync-disruption hardening, but it does not prove a complete exploit path or broad real-world impact."

code_shape_summary: "The old downloader API conflated two different synchronization states: no queued head was ready, and a queued head could not connect to a known parent. That made an invalid or suspicious queued-head condition look like ordinary lack of work."
search_motifs:
  - "rpc method missing exact checks for unknown parent sync hardening"
  - "security-sensitive path reaches expensive RPC-side computation, allocation, or response construction before rejecting malformed or unauthorized input"
  - "Split benign readiness checks from invariant failures"
negative_signals:
  - "Classify as block downloader synchronization hardening, not transaction processing."
  - "Do not claim confirmed remote DoS from the supplied patch alone."
  - "The supplied snippet does not show the exact new unknown-parent error branch."
patch_pattern: "Split benign readiness checks from invariant failures. Return an explicit error for invalid synchronization state and require the caller to abort instead of silently treating it as no work."

