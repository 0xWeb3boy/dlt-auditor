missing_property: "input-validation"
violated_invariant: "During block synchronization, the downloader should distinguish benign absence of ready blocks from an invalid queued head whose parent is not locally known, and callers should abort on the invalid state instead of treating it as normal no-work."
trust_boundary: "Untrusted RPC or debug request parameters reaching privileged node logic."
