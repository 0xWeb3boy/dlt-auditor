code_shape_summary: "The supported root cause is incomplete enforcement of the content-addressed chunk invariant in Swarm chunk handling. Peer-supplied chunk bytes were not shown to be validated against their advertised key before use in the affected handler, and corrupt persisted records were not cleaned up consistently."
search_motifs:
  - "p2p message missing exact checks for missing content integrity check"
  - "security-sensitive path reaches consensus-visible state transition or journal replay before rejecting malformed or unauthorized input"
  - "Validate content-addressed data at ingestion and cleanup boundaries, rejecting mismatched payloads and deleting corrupt records through the store's normal deletion abstraction"
negative_signals:
  - "Validated only as Swarm chunk integrity hardening, not as a proven high-impact vulnerability fix."
  - "Do not claim transaction validation, consensus safety, or Ethereum core protocol impact."
  - "No proof of a concrete exploit path beyond peer-supplied malformed chunk data."
patch_pattern: "Validate content-addressed data at ingestion and cleanup boundaries, rejecting mismatched payloads and deleting corrupt records through the store's normal deletion abstraction."

