missing_property: "consensus-validation"
violated_invariant: "During the Merge transition, a mixed PoW/PoS header batch must treat only the final pre-PoS PoW header as the valid terminal PoW block; earlier pre-headers must not already have crossed the configured terminal total difficulty."
trust_boundary: "Peer-supplied synchronization or protocol data crossing into local validation and scheduling logic."
entrypoint_type: "p2p message"
sensitive_sink: "canonical-chain selection or persistent chain-state update"

attacker_capabilities:
  - "Send crafted peer protocol messages, metadata, blocks, or headers during synchronization or discovery."
exploit_preconditions:
  - "The attacker must be able to reach the affected peer-facing protocol path or sync interaction."
  - "The intended validation, policy, or accounting gate is missing, too weak, or applied too late."
blast_radius: "Nodes following the affected path can diverge on validation, canonical-chain choice, or state outcomes."

impact_types: ["consensus-validation"]
severity_guess: "high"
severity_rationale: "The evidence directly ties the patch to consensus-validation risk on a reachable security boundary, but the supplied material still limits the claim to what the patch demonstrates."

code_shape_summary: "The transition verifier delegated the PoW side and PoS side to separate verification paths but lacked an explicit check that the PoW prefix did not cross terminal total difficulty before its final header. The result-merging logic also needed to avoid overwriting terminal-block validation errors with ordinary old-engine results."
search_motifs:
  - "p2p message missing exact checks for consensus terminal block validation hardening"
  - "security-sensitive path reaches canonical-chain selection or persistent chain-state update before rejecting malformed or unauthorized input"
  - "Add an explicit consensus-boundary invariant check before merging asynchronous verifier results, mark all affected headers with a domain-specific error, and prevent later generic verifier output from overwriting that failure"
negative_signals:
  - "Classify as consensus validation hardening, not a proven exploitable vulnerability."
  - "Do not claim cryptographic primitive failure or signature-validation weakness."
  - "No provided evidence shows a practical remote exploit path."
patch_pattern: "Add an explicit consensus-boundary invariant check before merging asynchronous verifier results, mark all affected headers with a domain-specific error, and prevent later generic verifier output from overwriting that failure."

