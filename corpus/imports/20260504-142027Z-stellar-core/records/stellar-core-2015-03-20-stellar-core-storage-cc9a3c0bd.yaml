severity_guess: "medium"
severity_rationale: "A broken trustline limit invariant can corrupt asset accounting semantics, but the evidence does not show a concrete theft path or consensus split."

code_shape_summary: "The operation apply branch loaded an existing trustline and assigned a new limit without first comparing it to zero and current balance."
search_motifs:
  - "trustline limit assigned directly from operation input"
  - "limit below balance not rejected"
  - "negative asset limit accepted"
  - "new INVALID_LIMIT result code"
negative_signals:
  - "Creating a new empty trustline with a zero limit may be valid in some protocols."
  - "A separate pre-validation function may already enforce the same limit and balance relation."
  - "Native currency balances may have different limit semantics than issued-asset trustlines."
patch_pattern: "Add a transaction-level guard for nonnegative and balance-compatible trustline limits before mutating ledger state, with a specific invalid-limit result."

