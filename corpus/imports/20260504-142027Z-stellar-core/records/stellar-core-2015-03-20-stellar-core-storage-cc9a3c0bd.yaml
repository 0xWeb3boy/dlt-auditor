attacker_capabilities:
  - "Submit ChangeTrust-like operations for an existing trustline."
  - "Choose a requested limit value inconsistent with current trustline balance."
exploit_preconditions:
  - "The existing-trustline branch directly assigns the requested limit."
  - "No earlier validation rejects negative limits or limits below balance."
blast_radius: "asset-ledger accounting for affected trustlines"

impact_types:
