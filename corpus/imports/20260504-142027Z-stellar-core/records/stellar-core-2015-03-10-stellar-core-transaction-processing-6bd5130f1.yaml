missing_property: "cheap-signer-candidate-binding"
violated_invariant: "Attacker-supplied signatures must be cheaply bound to plausible signer keys before expensive cryptographic verification is attempted."
trust_boundary: "untrusted-transaction-envelope -> cryptographic-signature-verifier"
entrypoint_type: "transaction-authentication"
sensitive_sink: "public-key signature verification loop and transaction commit gate"

attacker_capabilities:
  - "Submit transactions with many decorated signatures."
  - "Choose signatures whose hints do not correspond to signer candidates."
exploit_preconditions:
  - "Verification loops over supplied signatures and signer keys without a cheap hint prefilter."
  - "Unused or unmatched signatures are tolerated after otherwise successful validation."
blast_radius: "node-local CPU exhaustion with network-wide amplification potential under load"

impact_types:
  - "denial-of-service"
  - "resource-exhaustion"
  - "transaction-authentication-hardening"
severity_guess: "high"
severity_rationale: "The commit explicitly fixes an amplification attack in transaction authentication, a remote and attacker-controlled path, while not proving forgery or threshold bypass."

code_shape_summary: "A nested signer/signature loop invoked expensive verification before checking decorated-signature hints, and extra signatures could remain unused on successful paths."
search_motifs:
  - "verifySig inside nested loop over signatures and signers"
  - "decorated signature hint ignored before verification"
  - "unused signatures accepted after threshold reached"
  - "signature usage vector added to transaction frame"
negative_signals:
  - "Do not claim signature forgery when the patch only reduces verification work."
  - "Batch verification or cached verification can change the amplification model."
  - "Hint mismatches are not a bug if they are rejected before expensive verification."
patch_pattern: "Filter signer candidates using cheap hint metadata, mark consumed signatures, and reject envelopes containing unused authentication material."

