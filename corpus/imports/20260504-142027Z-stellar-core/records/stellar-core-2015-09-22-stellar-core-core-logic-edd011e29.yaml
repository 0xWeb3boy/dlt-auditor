missing_property: "preauthentication-resource-timeout"
violated_invariant: "Unauthenticated peer connections must have tighter resource timeouts than authenticated peers and timeout policy should be enforced at the shared peer lifecycle layer."
trust_boundary: "unauthenticated-network-peer -> node-overlay-connection-resources"
entrypoint_type: "p2p-connection-handshake"
