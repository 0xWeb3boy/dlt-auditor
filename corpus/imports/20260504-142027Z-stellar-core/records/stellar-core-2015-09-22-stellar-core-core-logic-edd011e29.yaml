attacker_capabilities:
  - "Open peer connections and delay or avoid completing authentication."
  - "Keep pre-handshake IO state alive long enough to consume connection resources."
exploit_preconditions:
  - "Pre-authentication and authenticated peers share the same long idle timeout."
  - "Timeout enforcement is fragmented in transport-specific code."
blast_radius: "node-local availability"

impact_types:
  - "denial-of-service"
  - "resource-exhaustion"
  - "availability-hardening"
severity_guess: "medium"
severity_rationale: "Pre-auth connection stalls can consume node resources, but the evidence supports hardening rather than a demonstrated DoS exploit."

code_shape_summary: "Timeout handling lived in the TCP peer layer and did not clearly distinguish unauthenticated from authenticated peer states until moved into shared peer policy."
search_motifs:
  - "same idle timeout before and after peer authentication"
  - "pre handshake timeout tightened"
  - "getIOTimeoutSeconds depends on authenticated state"
  - "idle timer implemented only in TCP peer"
negative_signals:
  - "A low global connection cap may mitigate the issue."
  - "Long authenticated-peer timeouts are expected after identity and protocol negotiation."
  - "Timeout refactors without pre-auth policy changes are usually reliability work."
patch_pattern: "Centralize IO timeout selection in the peer abstraction and choose a short timeout for unauthenticated connections while preserving longer authenticated-peer behavior."

