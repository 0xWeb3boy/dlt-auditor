code_shape_summary: "This is a confirmed availability/liveness security fix in the checkpoint-consensus path. The commit describes a malicious client delivery pattern where a validator can receive and retain a certificate but never submit it because only a randomized subset of validators was responsible for submission."
search_motifs:
  - "resource-accounting enforced after parsing but before consensus state mutation"
