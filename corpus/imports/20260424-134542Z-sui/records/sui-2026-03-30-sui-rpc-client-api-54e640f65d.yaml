  - "The changed path handles only local test fixtures, telemetry, or unreachable migration code."
patch_pattern: "Add explicit traffic-control accounting state for the request, update it when a gasless transaction is observed, and propagate the computed value through all relevant return paths instead of returning a constant zero."

