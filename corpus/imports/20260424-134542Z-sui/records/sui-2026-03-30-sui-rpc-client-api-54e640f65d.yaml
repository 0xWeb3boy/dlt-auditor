code_shape_summary: "The validator submit path previously returned zero traffic-control spam weight even when handling gasless transactions. The patch adds request-level spam-weight tracking, sets it to `Weight::one()` for transactions identified by `is_gasless_transaction()`, and returns the computed weight through the observed submit-response."
