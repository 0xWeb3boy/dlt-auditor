code_shape_summary: "The patch allows online retry of interrupted transactions, but moves retry accounting into the WAL begin path and rejects retries above `MAX_TX_RECOVERY_RETRY`. The evidence supports security-relevant resource-control hardening against poison-pill or crash-loop style retries, but not a confirmed exploitable vulnerability."
search_motifs:
  - "resource-accounting enforced after parsing but before storage state mutation"
  - "storage handler accepts externally supplied protocol data"
  - "unbounded loop/cache/retry path driven by remote input"
  - "missing per-client or per-digest resource attribution"
negative_signals:
  - "Equivalent validation, charging, or authorization is already enforced on every path before the shown sink."
  - "The changed path handles only local test fixtures, telemetry, or unreachable migration code."
  - "A separate hard cap, authenticated quota, or upstream rate limit makes repeated work impossible."
patch_pattern: "Centralize retry accounting in the guarded transaction-begin path and enforce a maximum retry limit before transaction execution continues."

