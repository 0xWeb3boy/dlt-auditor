code_shape_summary: "The patch fixes a concrete race between certificate execution and authority reconfiguration by adding an execution-epoch RwLock, requiring certificate execution to hold a read guard for the matching epoch, and requiring reconfiguration to hold a write guard while reverting uncommitted epoch transactions and advancing epoch."
