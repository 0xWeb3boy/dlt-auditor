  - "The alternative encoding cannot be produced by an untrusted party or is normalized before verification."
patch_pattern: "Verify recoverable signatures by recovering the public key from the exact recoverable signature and message, then comparing that recovered key to the expected public key. Do not reduce the signature to a standard ECDSA form when recovery metadata is part of the accepted signature representation."

