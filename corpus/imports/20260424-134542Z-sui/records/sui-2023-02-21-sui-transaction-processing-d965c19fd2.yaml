code_shape_summary: "The patch fixes unchecked aggregation of pay transaction recipient amounts. Previously, check_total_coins() summed u64 amounts with amounts.iter().sum() before comparing the result to available coin value. The patch uses checked_add and returns TotalAmountOverflow if the aggregate exceeds u64."
