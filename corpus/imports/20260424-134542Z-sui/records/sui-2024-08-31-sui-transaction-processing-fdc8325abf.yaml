severity_rationale: "The primary risk is availability or resource amplification; severity depends on reachable volume, default exposure, and whether throttling exists elsewhere."

code_shape_summary: "The patch is best characterized as GraphQL RPC availability hardening for oversized transaction-bearing requests. The commit text states that mutation and dry-run transaction payloads can be much larger than ordinary query payloads and adds a max_tx_payload_size derived from protocol max_tx_bytes with Base64 overhead."
search_motifs:
  - "resource-accounting enforced after parsing but before transaction-processing state mutation"
  - "transaction-processing handler accepts externally supplied protocol data"
  - "unbounded loop/cache/retry path driven by remote input"
  - "missing per-client or per-digest resource attribution"
negative_signals:
  - "Equivalent validation, charging, or authorization is already enforced on every path before the shown sink."
  - "The changed path handles only local test fixtures, telemetry, or unreachable migration code."
  - "A separate hard cap, authenticated quota, or upstream rate limit makes repeated work impossible."
patch_pattern: "Introduce a specialized resource budget for transaction-bearing GraphQL payloads, derive it from the protocol transaction byte limit plus encoding overhead, enforce it during GraphQL limit checking, and fail closed when the budget is exceeded."

