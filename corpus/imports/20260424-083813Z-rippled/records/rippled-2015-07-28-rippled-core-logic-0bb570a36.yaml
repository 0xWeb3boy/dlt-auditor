code_shape_summary: "The patch adds ledger compatibility checks around consensus ledger handling. The strongest visible evidence is in NetworkOPs::checkLastClosedLedger, where the node now retrieves or acquires the proposed consensus ledger and refuses to switch to it if LedgerMaster::isCompatible... Reusable shape: check for consensus-safety-invariant was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
