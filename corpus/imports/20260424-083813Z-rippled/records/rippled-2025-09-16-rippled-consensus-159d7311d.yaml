code_shape_summary: "The patch changes CanonicalTXSet::accountKey from a padded AccountID XORed with salt_ to an amendment-gated BLAKE3(account || salt) derivation, and wires the flag from validated consensus rules in RCLConsensus::Adaptor::doAccept. Reusable shape: check for consensus-safety-invariant was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
