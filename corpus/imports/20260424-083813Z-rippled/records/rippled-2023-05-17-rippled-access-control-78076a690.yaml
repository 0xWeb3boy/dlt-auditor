code_shape_summary: "The change hardens rippled RPC account parsing by removing legacy RPC::accountFromString handling from multiple account-query handlers and requiring parseBase58<AccountID> instead. Reusable shape: check for input-and-state-invariant-validation was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
