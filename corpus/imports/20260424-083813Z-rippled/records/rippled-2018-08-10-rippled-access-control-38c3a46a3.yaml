code_shape_summary: "The patch is a confirmed security fix for rippled RPC transaction signing. It adds a default access-control gate to sign, sign_for, and the submit path used for sign-and-submit behavior, rejecting non-admin callers unless signing support is explicitly enabled in configuration. Reusable shape: check for authorization was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
