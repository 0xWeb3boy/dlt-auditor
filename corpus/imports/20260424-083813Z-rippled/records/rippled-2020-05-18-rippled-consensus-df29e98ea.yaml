code_shape_summary: "The provided evidence supports a consensus-amendment threshold rounding fix. The commit message explicitly says amendment ballot counting could allow majority with slightly less than 80% support due to integer arithmetic and rounding semantics. Reusable shape: check for accounting-integrity was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
