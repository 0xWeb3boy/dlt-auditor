  - "security-sensitive path reaches node configuration, downloaded trust material, or externally visible service behavior before rejecting malformed, stale, or unauthorized input"
  - "Model validator-site fetch targets as validated Resource objects and keep redirect/retry state explicit and bounded in the scheduler."
negative_signals:
  - "No evidence shows an exploitable redirect vulnerability before the patch."
  - "No evidence shows attacker control over validator-site redirects in normal deployments."
  - "A superficially similar change is lower risk if an earlier mandatory gate already enforces the same property for every reachable path."
  - "Treat pure refactors, comment-only changes, or tests without a reachable untrusted entrypoint and sensitive sink as non-security."
patch_pattern: "Model validator-site fetch targets as validated Resource objects and keep redirect/retry state explicit and bounded in the scheduler."

