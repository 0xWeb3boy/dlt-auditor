code_shape_summary: "The patch changes rippled's ValidatorSite fetch path to represent fetch targets as Resource objects, centralize URL parsing and http/https validation, honor redirect-oriented resource state, use per-site refresh intervals, reset redirect counts per cycle, and add explicit... Reusable shape: check for trust-root-and-freshness-validation was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
search_motifs:
