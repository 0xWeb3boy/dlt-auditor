code_shape_summary: "The patch changes transaction authorization and SetRegularKey validation so that, under the fixMasterKeyAsRegularKey amendment, an account cannot set sfRegularKey to the same account ID as sfAccount and master-key disable handling is separated from regular-key authorization. Reusable shape: check for authorization was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
