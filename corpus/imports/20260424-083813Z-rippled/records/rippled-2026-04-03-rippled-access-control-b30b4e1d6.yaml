  - "Treat pure refactors, comment-only changes, or tests without a reachable untrusted entrypoint and sensitive sink as non-security."
patch_pattern: "Add an amendment-gated invariant check that constrains recorded protocol accounting to the actual backing pseudo-account balance, with an explicit lifecycle exception for deletion."

