code_shape_summary: "The grounded finding is lending protocol accounting hardening, not access control. The strongest supported change is in LoanBrokerInvariant.cpp, where the invariant now computes the pseudo-account balance once and, under fixSecurity3_1_3, rejects non-delete LoanBroker states... Reusable shape: check for accounting-integrity was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
search_motifs:
