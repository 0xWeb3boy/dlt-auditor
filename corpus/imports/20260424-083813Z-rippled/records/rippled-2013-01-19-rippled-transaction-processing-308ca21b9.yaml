code_shape_summary: "The grounded substantive fix is in WalletAdd: it changes an account-creation XRP send from a simple balance-versus-amount check to a reserve-aware funding check. Reusable shape: check for reserve-enforcement was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
search_motifs:
  - "transaction-handler missing exact reserve-enforcement check before ledger state, balance/reserve accounting, or transaction authorization outcome"
  - "security-sensitive path reaches ledger state, balance/reserve accounting, or transaction authorization outcome before rejecting malformed, stale, or unauthorized input"
  - "Replace a local amount-only funding check with a reserve-aware transaction validity check, and return path-specific unfunded errors for clearer failure attribution."
negative_signals:
  - "No exploit scenario or attacker-controlled sequence is shown."
  - "No evidence shows theft, double spend, value creation, or consensus divergence."
  - "A superficially similar change is lower risk if an earlier mandatory gate already enforces the same property for every reachable path."
  - "Treat pure refactors, comment-only changes, or tests without a reachable untrusted entrypoint and sensitive sink as non-security."
patch_pattern: "Replace a local amount-only funding check with a reserve-aware transaction validity check, and return path-specific unfunded errors for clearer failure attribution."

