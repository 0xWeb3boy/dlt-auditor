code_shape_summary: "The patch is security-relevant and likely hardens RPC admin access, but the supplied evidence does not fully prove an exploitable authorization bypass. Reusable shape: check for authorization was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
search_motifs:
  - "authorization-check-path missing exact authorization check before privileged account action, delegated permission, or role-scoped state change"
  - "security-sensitive path reaches privileged account action, delegated permission, or role-scoped state change before rejecting malformed, stale, or unauthorized input"
  - "Move RPC role assignment from connection/interface assumptions to request-time authorization checks, and reject forbidden requests before invoking the RPC command handler."
negative_signals:
  - "No iAdminGet implementation is supplied to confirm exact credential or policy behavior."
  - "No evidence shows whether the affected RPC listeners were reachable by untrusted attackers."
  - "A superficially similar change is lower risk if an earlier mandatory gate already enforces the same property for every reachable path."
  - "Treat pure refactors, comment-only changes, or tests without a reachable untrusted entrypoint and sensitive sink as non-security."
patch_pattern: "Move RPC role assignment from connection/interface assumptions to request-time authorization checks, and reject forbidden requests before invoking the RPC command handler."

