code_shape_summary: "The draft correctly rejects the unsupported replay/signature-validation theory. The grounded change is that validator-site redirects now reject schemes other than http and https while the commit adds explicit configured file:// validator-list support. Reusable shape: check for trust-root-and-freshness-validation was incomplete, late, or split across paths; the fix makes the gate explicit before the sensitive state change."
