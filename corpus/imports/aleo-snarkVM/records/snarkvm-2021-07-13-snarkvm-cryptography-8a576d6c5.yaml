  - "Choose or relay the message bytes supplied to an in-circuit signature verification path."
  - "Influence proof witnesses or public inputs that are converted into field elements before hashing."
exploit_preconditions:
  - "The verifier encodes variable-length byte messages into field elements without an independent length or delimiter."
  - "The circuit verifier is relied on as an authorization or validity check for downstream protocol logic."
blast_radius: "proof-local to protocol-wide depending on where the gadget verifier gates state transitions"

impact_types:
  - "cryptographic-integrity"
  - "signature-binding-hardening"
