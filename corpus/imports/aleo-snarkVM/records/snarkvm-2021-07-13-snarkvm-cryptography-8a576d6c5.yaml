severity_rationale: "The patch is in a cryptographic verifier and fixes transcript binding, but no concrete forgery or transaction-level exploit is proven."

code_shape_summary: "A signature gadget built a Poseidon challenge from commitment field elements plus message field elements, but omitted an explicit byte length before absorbing the variable-length message."
search_motifs:
  - "hash_input.extend(message.to_constraint_field(...)) without a nearby length or domain element"
  - "signature gadget and native verifier construct challenge transcripts differently"
