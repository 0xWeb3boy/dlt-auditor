notes:
  - "Enriched from the validated finding and kept conservative where exploitability was not proven."
  - "Raw summary: The patch fixes fail-open handling in the output-record scanner's unspent classification path. Before the change, `OutputRecordsFilter::AllUnspent` treated any result other than `Ok(true)` from `contains_serial_number` as absence, so `Err(_)` caused the scanne"
