severity_guess: "high"
severity_rationale: "The flaw can let an authorized user for one key disrupt another association; exact downstream consensus impact is not fully quantified."

code_shape_summary: "A mapping update treated source ownership as sufficient authorization for a destination key. The fix rejects occupied destination keys before removing or inserting association state."
search_motifs:
  - "source owner check but no destination contains_key check"
  - "association rename into caller-selected existing key"
  - "AlreadyAssociated added to update path tests"
negative_signals:
  - "Destination collisions are harmless if aliases are intentionally allowed"
  - "A lower-layer reservation map may enforce uniqueness already"
  - "Admin-only migration code has different threat model"
patch_pattern: "Fail closed on occupied destination ids and preserve existing associations by checking uniqueness before mutation."

