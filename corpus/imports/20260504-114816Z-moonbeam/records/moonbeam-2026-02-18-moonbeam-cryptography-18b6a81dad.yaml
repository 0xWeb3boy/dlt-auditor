code_shape_summary: "The permit guard divided the current millisecond timestamp by 1000, creating a floor-rounding window. The fix multiplies the deadline to milliseconds with checked_mul and compares directly."
search_motifs:
  - "timestamp / 1000 compared to deadline"
  - "permit deadline checked after unit conversion with flooring"
  - "checked_mul(1000) added to authorization expiry guard"
