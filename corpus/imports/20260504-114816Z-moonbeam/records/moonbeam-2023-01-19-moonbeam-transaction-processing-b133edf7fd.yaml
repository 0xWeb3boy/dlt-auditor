code_shape_summary: "The precompile compared caller gas to request limits without adding subcall overhead and lacked a conservative remaining-gas check for fulfillment. The fix uses checked_add and upfront max-cost checks."
search_motifs:
  - "gas_limit checked without adding subcall_overhead"
  - "checked_add added around gas accounting"
  - "fulfillment starts before max prepare/finish cost check"
