violated_invariant: "A prover login flow should consume a single-use challenge that is bound to the presented bearer token and must not accept replayed challenge material."
trust_boundary: "prover->coordinator-auth-session"
entrypoint_type: "session-setup"
sensitive_sink: "issuance of an authenticated coordinator login session for a prover"

attacker_capabilities:
  - "capture or reuse previously issued login material such as a bearer token, signed challenge, or replay-cache key"
  - "submit login requests to the coordinator authentication endpoint"
exploit_preconditions:
  - "the coordinator uses a stale or mismatched replay key instead of the canonical challenge value"
  - "the replayed login material remains syntactically valid and reaches the login logic before stronger revocation or expiry checks stop it"
blast_radius: "node-local"

impact_types:
  - "unauthorized-action"
  - "stale-trust-state"
severity_guess: "medium"
severity_rationale: "Authentication replay in the prover login path can grant unauthorized coordinator sessions, but the evidence supports a focused nonce-binding fix rather than a demonstrated chain-wide exploit."

code_shape_summary: "The patch is best supported as an authentication replay fix in the coordinator login path. The visible code adds an explicit equality check between the Authorization bearer token and login.Message.Challenge, and changes replay tracking from storing login.Signature to storing login.Message.Challenge. That is grounded evidence of fixing nonce/challenge binding and replay consumption in login."
search_motifs:
  - "replay cache keyed by signature instead of canonical nonce or challenge"
  - "bearer token accepted without equality check against the signed challenge field"
  - "challenge-response login path consumes the wrong identifier when marking requests as used"
negative_signals:
  - "If the challenge is already single-use, bound to the session token, and consumed on the canonical nonce value, a similar login flow is usually safe."
  - "Signature-format refactors near the login path are not enough by themselves; the key issue is whether replay tracking and token binding use the same challenge."
  - "The evidence supports replay hardening, not a proven forged-signature or privilege-escalation exploit beyond session reuse."
patch_pattern: "Bind the presented token to the signed challenge and store or invalidate the canonical challenge value rather than a derived signature field when consuming login requests."

