code_shape_summary: "The patch re-enables a fork-compatibility check in three prover-task assignment paths. The evidence shows the coordinator previously had this guard commented out and now rejects assignment when the prover does not advertise support for the task's required hard fork. That establishes a real correctness and safety check was restored, but the provided material does not prove a concrete security vulnerability or downstream acceptance of invalid proofs."
search_motifs:
