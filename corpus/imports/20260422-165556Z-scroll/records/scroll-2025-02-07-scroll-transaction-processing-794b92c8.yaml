  - "hard fork name available in task context but not enforced against prover capabilities"
  - "multiple assignment paths duplicate capability gating and one or more silently skip it"
negative_signals:
  - "If downstream verifiers or provers reject mismatched tasks before any stateful effect, similar bugs may be operational rather than security-relevant."
