code_shape_summary: "The evidence supports a targeted compatibility fix in coordinator authentication: the legacy Curie public-key recovery path was changed to hash a dedicated legacy identity payload instead of the current Message object. That shows a signer-recovery mismatch, but the provided diff does not establish that this caused acceptance of forged logins, replay, or an authorization bypass."
search_motifs:
  - "signature recovery hashes a different struct than the one used for signing"
  - "legacy compatibility branch rebuilds an identity payload separately from the canonical message type"
  - "authentication code mixes current and legacy hash functions for the same public-key recovery decision"
negative_signals:
  - "If the legacy and current payloads serialize identically or the compatibility path is disabled, the practical risk drops sharply."
  - "Message-shape cleanup alone is not enough; the important question is whether signer recovery and the prover signer bind to the same bytes."
  - "The evidence supports a compatibility hardening fix, not a demonstrated forged-login exploit."
patch_pattern: "Reconstruct the legacy identity payload explicitly in the compatibility branch and recover the signer from that canonical legacy preimage instead of the current message object."

