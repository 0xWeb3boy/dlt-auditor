code_shape_summary: "The visible patch fixes verifier-tool behavior around verification-key handling and bundle verifier asset export. It corrects an inverted equality check for chunk and batch proofs, forces the bundle path to use the locally selected verifier key, and copies `verifier.bin` during asset export. That is clearly a correctness or hardening change in proof-verification tooling, but the provided evidence does not establish an exploitable vulnerability, a production attack boundary, or any on-chain security impact."
