  - "verification tool copies or selects verifier assets from the wrong source bundle"
  - "proof verification path uses one artifact set while export path omits the required verifier binary"
negative_signals:
  - "If the tooling is purely local and not used as a policy gate, a similar mismatch may remain a correctness issue rather than security hardening."
  - "Changing file-copy behavior alone is not enough; the security-relevant part is binding the correct verification key and verifier binary to the proof path."
  - "The evidence supports tool hardening, not a demonstrated production verifier bypass."
patch_pattern: "Bind verification runs to the selected verification key, fix inverted artifact-consistency checks, and export the verifier binary required by the chosen proof path."

