  - "assert_eq or panic-style length check inside unsafe extern or FFI entrypoint"
  - "unsafe proof-decoding boundary converts malformed input into process abort instead of explicit error"
negative_signals:
  - "If the logged key material is guaranteed synthetic test data and never present in production, a similar log line may be less significant."
  - "Defensive bounds checks elsewhere do not fully cure the issue when the unsafe entrypoint still panics on malformed lengths."
  - "The evidence supports strong hardening around secrets and FFI robustness, not a proven catastrophic exploit chain."
patch_pattern: "Remove plaintext key-material logging and replace panic-based length assertions at the unsafe boundary with explicit validation and error returns."

