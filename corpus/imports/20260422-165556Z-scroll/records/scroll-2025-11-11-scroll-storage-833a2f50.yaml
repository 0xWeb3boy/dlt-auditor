code_shape_summary: "The provided evidence supports a likely security-hardening change in the validium proof path. The patch removes logging of `chunkProof.MetaData.ChunkInfo.EncryptionKey` and replaces an `assert_eq!` on `decryption_key_len` in an `unsafe extern \"C\"` entrypoint with explicit validation and a failure return. The `codec_validium.go` schema change is adjacent protocol work, but the supplied evidence does not establish it as a proven vulnerability fix."
search_motifs:
