code_shape_summary: "The provided evidence supports a validium-task correctness fix, not a proven vulnerability fix. The coordinator now explicitly constructs a validium batch header for batch tasks, and the prover now sanity-checks that the header's recomputed hash matches the stored hash. That is an internal integrity/correctness improvement in the proving pipeline, but the snippets do not establish external attacker control or a concrete security impact."
search_motifs:
  - "task builder uses stored batch hash without reconstructing or validating canonical header bytes"
  - "validium-specific proving path diverges from canonical batch-header construction"
  - "prover adds recomputed-hash sanity check after task detail grows a new header field"
negative_signals:
  - "If downstream verification always recomputes and binds the same header hash, a similar task-building bug may remain a correctness-only issue."
  - "Header-serialization refactors are not enough; the real signal is whether the stored hash and canonical header can diverge before proving."
  - "The evidence supports integrity hardening, not a demonstrated forged-batch exploit."
patch_pattern: "Construct the validium batch header explicitly in the coordinator and reject tasks in the prover when the recomputed header hash differs from the stored batch identity."

