severity_rationale: "Cryptographic binding failures in DA challenge construction can undermine integrity-sensitive proof context, but the supplied evidence supports hardening more strongly than a confirmed exploit path."

code_shape_summary: "The patch changes blob construction so it computes an EIP-4844 blob versioned hash, appends that hash to the challenge preimage, and returns it to callers. That is a real cryptographic-binding change in the DA encoding path. However, the supplied evidence does not show the downstream `piHash` use, verifier behavior, or any concrete acceptance flaw, so the material supports a security-relevant hardening/fix thesis only weakly and does not establish an actual vulnerability end to end."
search_motifs:
  - "constructor returns blob or commitment data but caller drops the canonical versioned hash"
  - "challenge preimage assembled from chunks without the final canonical blob identifier"
  - "EIP-4844 blob path computes a versioned hash late and fails to thread it into the proof-binding surface"
negative_signals:
  - "If the downstream verifier always recomputes and enforces the same canonical hash before accepting the proof, a similar omission may be non-exploitable."
  - "Auxiliary refactors that only change return signatures are not enough; the real issue is whether the canonical hash reaches the challenge preimage."
  - "The evidence supports cryptographic hardening, not a proven end-to-end acceptance flaw."
patch_pattern: "Return the canonical versioned blob hash from DA blob construction and include it explicitly in the challenge-binding data that downstream components consume."

