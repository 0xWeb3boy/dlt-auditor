missing_property: "domain-separation"
violated_invariant: "Typed transactions that rely on chain ID for replay protection must be accepted only after the enabling fork and only when their embedded chain ID matches the network domain used by runtime execution."
trust_boundary: "transaction-submitter->mempool-and-consensus-validation"
entrypoint_type: "transaction-admission-and-block-validation"
sensitive_sink: "acceptance of EIP-1559 typed transactions and runtime CHAINID domain exposure"

attacker_capabilities:
  - "Submit EIP-1559 typed transactions with arbitrary embedded chain IDs."
  - "Produce or relay blocks containing typed transactions around a fork boundary."
exploit_preconditions:
  - "The network supports or is approaching the fork that enables the typed transaction format."
  - "Legacy chain-tag checks do not cover the Ethereum typed transaction path."
blast_radius: "chain-wide"

impact_types:
  - "replay-risk-reduction"
  - "consensus-integrity"
  - "signature-domain-integrity"
severity_guess: "medium"
severity_rationale: "Chain ID is signature domain-separation material in consensus transaction processing. The patch is likely hardening, but the validation notes do not prove a practical replay exploit."

code_shape_summary: "The Ethereum typed transaction path had to be bound to the fork activation point and configured Ethereum chain ID across txpool, consensus, and runtime CHAINID; the fix rejects pre-fork or mismatched-domain transactions."
search_motifs:
  - "typed transaction skips legacy chain-tag validation"
  - "EthChainID compared only after new fork activation"
  - "mempool and consensus validators implement different chain-id rules"
  - "runtime CHAINID differs from transaction signature domain"
negative_signals:
  - "No issue if typed transactions are impossible before the fork."
  - "No issue if signature recovery independently rejects mismatched chain IDs everywhere."
  - "Fork configuration changes without admission checks are not enough to establish a security case."
patch_pattern: "Add fork-aware validation in both mempool and consensus, compare embedded typed-transaction chain ID with configured network domain, and align runtime CHAINID after the fork."

