code_shape_summary: "A transfer log filter handler validated options and nil criteria but lacked a visible maximum criteria-count check before log database querying; the fix rejects excessive criteria and routes query execution through cached prepared statements."
search_motifs:
  - "filter.CriteriaSet length used to build DB query"
  - "API validates range but not number of filter clauses"
  - "caller-controlled list of query predicates has no max count"
  - "log query prepares statements for unbounded dynamic criteria"
negative_signals:
  - "No issue if a lower layer caps criteria count or query cost."
  - "No issue if the endpoint is private and rate-limited for trusted callers."
  - "Prepared-statement caching alone is not proof of injection or DoS."
patch_pattern: "Add an API-level maxCriteriaCount guard before database work and use a statement cache for repeated event/transfer query execution."

