impact_types:
  - "replay-domain-weakening"
  - "consensus-integrity"
  - "signature-domain-integrity"
severity_guess: "medium"
severity_rationale: "The accepted hardening closes a replay-domain consistency gap across transaction admission and execution. It is medium because transaction domain errors can be chain-wide, but exploitability is not established."

code_shape_summary: "EIP-1559 typed transactions bypassed legacy chain-tag checks but lacked shown validation that their embedded Ethereum chain ID matched the active configured network domain; the fix adds fork gating and chain-ID comparisons in txpool and consensus and aligns runtime CHAINID."
search_motifs:
  - "new typed transaction path bypasses legacy replay check"
  - "EthChainID not compared with configured network ID"
  - "mempool accepts transaction type before consensus fork gate"
  - "runtime chain ID and signed transaction domain can diverge"
negative_signals:
  - "No issue if mismatched chain IDs fail during signature recovery before acceptance."
  - "No issue if the transaction type is unreachable until the fork activates."
  - "Do not flag duplicate fork plumbing without an acceptance path for signed transactions."
patch_pattern: "Apply the same fork-aware chain-ID validation at mempool and consensus boundaries and make runtime expose the post-fork configured Ethereum chain ID."

