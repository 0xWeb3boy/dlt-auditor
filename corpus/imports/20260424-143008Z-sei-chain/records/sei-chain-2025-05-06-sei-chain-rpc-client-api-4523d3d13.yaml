code_shape_summary: "The patch hardens oracle transaction spam prevention by replacing a split read-then-write counter check in the ante decorator with a keeper-level `CheckAndSetSpamPreventionCounter` method that locks per validator address, checks the current block height, and updates the counter while holding the lock."
