code_shape_summary: "The patch adds optional CheckTx-error blacklisting in the mempool: failed CheckTx results are still counted per SenderNodeID, and when the new config flag is enabled and the count exceeds the configured threshold, the peer manager is notified with an error that tests treat as eviction."
search_motifs:
  - "failed CheckTx count recorded but not enforced"
  - "SenderNodeID available but peer manager not notified"
  - "config flag controls mempool blacklist threshold"
negative_signals:
  - "Invalid submissions are already rate-limited or disconnected at the transport layer."
  - "Failures are ordinary user transaction errors that should not punish relaying peers."
patch_pattern: "Connect per-peer failed-validation counters to configured eviction or throttling thresholds."

