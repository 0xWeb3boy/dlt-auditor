code_shape_summary: "The supported finding is Ed25519 secret-key lifecycle hardening, not a proven exploitable vulnerability. The evidence shows changes to SecretKey representation, runtime cleanup registration, and SignWithTag keepalive behavior. The tmhash removal is not tied to a concrete security invariant in the supplied evidence and should be treated as cleanup/API removal unless more context is provided."
search_motifs:
  - "runtime.SetFinalizer or cleanup captures the object being cleaned"
  - "signing method lacks runtime.KeepAlive"
  - "raw secret pointer exposed outside key type"
negative_signals:
  - "Secret keys are immutable byte slices with no cleanup finalizers or unsafe pointers."
  - "The path handles only public keys or test keys."
patch_pattern: "Make key reachability explicit, hide raw secret access, avoid self-retaining cleanup callbacks, and keep key objects alive through signing."

