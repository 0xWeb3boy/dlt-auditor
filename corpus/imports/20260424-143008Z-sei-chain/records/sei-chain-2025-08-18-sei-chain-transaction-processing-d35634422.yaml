code_shape_summary: "The patch changes EVM transaction preprocessing so unprotected legacy Ethereum transactions are rejected during normal operation. Previously, when `ethTx.Protected()` was false, `Preprocess` still computed the transaction hash with `ethtypes.FrontierSigner{}.Hash(ethTx)` and continued to sender derivation. After the patch, that fallback is allowed only when `isBlockTest` is enabled;"
search_motifs:
  - "ethTx.Protected false branch continues in production"
  - "FrontierSigner hash used as fallback"
  - "isBlockTest or test mode exception missing"
negative_signals:
  - "The network intentionally supports unprotected legacy transactions and scopes them safely."
  - "A later ante stage rejects the transaction before execution."
patch_pattern: "Fail closed on unsafe legacy transaction formats in normal operation and isolate compatibility behavior behind test flags."

