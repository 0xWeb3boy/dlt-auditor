severity_rationale: "Using unverified or stale certificate metadata can corrupt local consensus state; broader safety impact is not proven."

code_shape_summary: "The patch fixes a security-relevant state-integrity issue in the Autobahn consensus data path. Before the fix, PushQC could use a stale or unneeded incoming QC's range and headers during later mutation and block matching even though QC verification was only performed when needQC was true. The fix ties QC insertion and update signaling to needQC, and matches blocks against stored verified QC headers."
search_motifs:
  - "needQC controls verification but not insertion"
  - "incoming QC range used after verification skipped"
  - "block matched against unstored incoming header"
negative_signals:
  - "All incoming QCs are verified before this function regardless of needQC."
  - "Later state mutation reads only canonical stored QC data."
patch_pattern: "Apply the same needed-and-verified predicate to verification, insertion, update signaling, and dependent block matching."

