code_shape_summary: "The patch adds explicit chain ID checks in `x/evm/ante/sig.go` within `EVMSigVerifyDecorator.AnteHandle`. It reads the configured EVM chain ID from the keeper, reads `ethTx.ChainId()`, switches on the Ethereum transaction type, and for legacy transactions allows either chain ID zero or the configured chain ID while rejecting other nonzero chain IDs with `sdkerrors.ErrInvalidChainID`."
