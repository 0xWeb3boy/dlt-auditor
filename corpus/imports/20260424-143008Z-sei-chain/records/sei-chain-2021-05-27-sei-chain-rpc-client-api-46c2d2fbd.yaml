severity_guess: "medium"
severity_rationale: "Client recovery affects trusted cross-chain consensus state; the evidence supports hardening of state selection rather than a demonstrated forged-client takeover."

code_shape_summary: "The patch simplifies the IBC ClientUpdateProposal recovery path by removing the proposal-supplied InitialHeight flow, adding keeper-level checks that the substitute is active and ahead of the subject, and copying the substitute client's latest consensus state rather than iterating over a caller-influenced historical range."
search_motifs:
  - "proposal supplies initial height for client recovery"
  - "range copy loop tolerates missing consensus states"
  - "substitute client latest state is not checked before copy"
negative_signals:
  - "The proposal fields are already constrained by governance validation and cannot affect copied state."
  - "The copied state is independently verified against the substitute client before storage."
patch_pattern: "Remove caller-controlled range selection, enforce substitute-client suitability, and copy the canonical latest consensus state."

