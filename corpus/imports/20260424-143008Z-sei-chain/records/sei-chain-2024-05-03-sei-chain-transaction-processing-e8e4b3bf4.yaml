code_shape_summary: "The patch is best characterized as likely denial-of-service hardening for the EVM RPC websocket subscription path. It adds a configuration-backed limit for eth_newHeads subscriptions, passes that limit into SubscriptionAPI, and rejects new subscriptions once the tracked listener count reaches the configured maximum."
search_motifs:
  - "newHeads listeners map grows without limit"
  - "config has subscription limit but server does not pass it"
  - "count-and-insert not protected by same mutex"
negative_signals:
  - "The endpoint is admin-only or already fronted by strict rate limits."
  - "A reverse proxy enforces a smaller authenticated subscription cap."
patch_pattern: "Thread a configuration-backed limit to the allocation point and reject registrations under the same lock used for listener state."

