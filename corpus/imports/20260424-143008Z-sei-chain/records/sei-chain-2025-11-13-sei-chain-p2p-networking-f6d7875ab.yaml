code_shape_summary: "The supported finding is security hardening in p2p reactor error handling. The visible patch replaces several passive error-reporting paths with peer eviction in blocksync, consensus state, consensus vote-set-bits, and statesync invalid light-block handling."
search_motifs:
  - "peer error logged but no peerManager.Evict"
  - "invalid light block handled without disconnect"
  - "handler has m.From or resp.peer available but only reports error"
negative_signals:
  - "The error can be caused by honest network races and eviction would be unsafe."
  - "Another scoring layer immediately penalizes the same peer."
patch_pattern: "Replace passive reporting with peer eviction or scoring on selected invalid-input paths where peer attribution is reliable."

