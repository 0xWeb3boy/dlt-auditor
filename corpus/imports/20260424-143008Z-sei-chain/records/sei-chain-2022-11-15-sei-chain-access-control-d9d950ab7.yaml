missing_property: "ownership-authorization"
violated_invariant: "State-changing registration or configuration must be authorized against canonical ownership metadata, not only request-declared identity."
trust_boundary: "externally submitted module message -> privileged contract registration state"
entrypoint_type: "message-server-handler"
sensitive_sink: "registering a contract or changing module-scoped permissions"

attacker_capabilities:
  - "Submit registration messages naming a contract address."
exploit_preconditions:
  - "The contract exists and has canonical creator/owner metadata."
  - "The handler previously accepted a requester without comparing it to that metadata."
blast_radius: "protocol-state-integrity"

impact_types:
  - "privilege-misuse"
severity_guess: "medium"
severity_rationale: "Unauthorized registration can confer control over module behavior for another contract, but the retained evidence does not prove direct fund loss."

code_shape_summary: "The patch adds a direct authorization gate to RegisterContract. The code now fetches wasm contract metadata for msg.Contract.ContractAddr and rejects the request with sdkerrors.ErrUnauthorized when contractInfo.Creator does not match msg.Creator. This supports a grounded missing-authorization finding for the DEX contract registration path."
search_motifs:
  - "Msg creator compared only to request fields"
  - "contract registration lacks wasm creator lookup"
  - "state mutation uses contract address before owner check"
negative_signals:
  - "A prior ante or router layer already proves the sender is the contract creator."
  - "The registration has no privileged effect or is purely informational."
patch_pattern: "Fetch canonical ownership metadata from the owning subsystem and reject mismatched callers before registration state changes."

