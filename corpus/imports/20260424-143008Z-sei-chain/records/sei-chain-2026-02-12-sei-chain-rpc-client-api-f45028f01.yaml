missing_property: "certified-proposal-state-binding"
violated_invariant: "Commit-step block reconstruction must be bound to the block ID and part-set header certified by the commit evidence."
trust_boundary: "peer proposal/block parts -> local commit-step consensus state"
entrypoint_type: "consensus-commit-handler"
sensitive_sink: "reconstructing or accepting ProposalBlock for commit processing"

attacker_capabilities:
  - "Influence proposal or block-part delivery timing around commit handling."
exploit_preconditions:
  - "Local proposal state can refer to a block different from the commit certificate."
  - "Reconstruction can proceed over stale or mismatched ProposalBlock data."
blast_radius: "availability-or-resource-control"

impact_types:
  - "consensus-liveness"
  - "node-halt"
severity_guess: "medium"
severity_rationale: "Certified block mismatch can halt or desynchronize nodes; the finding is liveness/state-alignment rather than proven safety compromise."

code_shape_summary: "The patch is a Tendermint consensus liveness/state-alignment fix for a halt described as caused by reconstructing a block from a bad proposal. It adds a commit-certificate-aware proposal mismatch check, centralizes proposal block reconstruction around current round state, avoids reconstructing over an existing ProposalBlock, and makes commit handling wait for block parts matching the certified PartSetHeader."
search_motifs:
  - "commit BlockID differs from ProposalBlock BlockID"
  - "reconstruct block without checking PartSetHeader from commit"
  - "proposal mismatch not rejected during commit step"
negative_signals:
  - "The consensus state machine already clears conflicting proposal data before commit."
  - "Block parts are cryptographically bound and cannot be mixed across headers."
patch_pattern: "Treat the commit certificate as authoritative, ignore conflicting proposals, and fetch/reconstruct only parts matching the certified header."

