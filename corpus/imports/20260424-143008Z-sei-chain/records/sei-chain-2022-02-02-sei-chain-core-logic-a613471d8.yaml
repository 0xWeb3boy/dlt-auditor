code_shape_summary: "Likely security fix for consensus determinism in IBC transfer error acknowledgements. The patch changes the transfer receive failure path from committing `err.Error()` directly into an acknowledgement to using a transfer-specific acknowledgement helper, and adds documentation warning that acknowledgement error strings are written into state and can cause app hash divergence across mixed patch versions."
