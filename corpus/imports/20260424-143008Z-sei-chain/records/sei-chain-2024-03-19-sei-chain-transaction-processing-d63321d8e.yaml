code_shape_summary: "Likely security fix in the EVM account association path. The patch changes AssociateTx preprocessing from recovering addresses against common.Hash{} to recovering against Keccak256Hash([]byte(atx.CustomMessage)). It also adds CustomMessage to the AssociateTx model, protobuf serialization/deserialization, and tests."
search_motifs:
  - "signature recovery uses constant placeholder hash"
  - "transaction model lacks signed message field"
  - "preprocess derives signer before binding message bytes"
negative_signals:
  - "A later authorization check binds the same signature to the intended message."
  - "The association operation is disabled or only accepts locally generated txs."
patch_pattern: "Serialize the intended message and use its domain-separated hash for signer recovery."

