code_shape_summary: "The supported finding is mempool peer-abuse hardening, not a confirmed vulnerability fix. The patch enables CheckTx error blacklisting by default, narrows the blacklist trigger away from all non-OK ABCI CheckTx results, and adds guarded peer eviction accounting."
search_motifs:
  - "blacklist trigger counts all non-OK CheckTx results"
  - "oversized tx error class separated from ordinary invalid tx"
  - "default peer blacklist flag disabled or too broad"
negative_signals:
  - "The failure code reflects user-level invalid transactions rather than peer abuse."
  - "Eviction would let attackers disconnect honest peers by relaying bad user txs."
patch_pattern: "Narrow peer-penalty triggers to bounded abuse cases, centralize guards, and enable the safer control by default."

