code_shape_summary: "The supported security-relevant change is in x/dex/keeper/utils/wasm.go. The patch replaces an infinite temporary gas meter used for Wasm sudo execution with a gas meter derived from the parent context limit, and wraps the sudo call to recover sdk.ErrorOutOfGas panics while re-panicking other panics. This supports a likely liveness/resource-exhaustion hardening classification."
