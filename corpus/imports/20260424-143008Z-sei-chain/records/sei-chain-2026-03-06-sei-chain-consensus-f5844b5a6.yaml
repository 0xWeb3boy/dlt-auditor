code_shape_summary: "Likely security fix in the Autobahn consensus timeout path. The production change in `State.voteTimeout` stops constructing TimeoutVotes solely from the current `i.PrepareQC`; when that value is absent, it inherits `i.TimeoutQC.LatestPrepareQC()`."
search_motifs:
  - "TimeoutVote built only from current PrepareQC"
  - "view-change clears lock while TimeoutQC still carries it"
  - "LatestPrepareQC not inherited across consecutive timeouts"
negative_signals:
  - "The protocol forbids entering the new view without separately restoring the lock."
  - "Proposal verification independently rejects conflicts without relying on TimeoutVote PrepareQC."
patch_pattern: "When current-view lock state is absent, inherit the lock from the justifying certificate before constructing timeout votes."

