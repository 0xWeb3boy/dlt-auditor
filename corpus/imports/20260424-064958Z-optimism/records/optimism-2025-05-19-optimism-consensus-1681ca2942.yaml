confidence_tier: tier_b_likely
security_verdict: likely
validated_as: security-hardening
recommended_uses:
- retrieval_exemplar
- taxonomy_refinement
missing_property: path-confinement
violated_invariant: During EL sync startup, the node must not mark the current unsafe L2 head as safe or finalized
  just because sync progressed or a recovery path was taken; startup forkchoice should be derived from an older
  eligible L2 block based on L1-origin context, or from genuinely finalized state.
trust_boundary: artifact/archive input -> host filesystem
entrypoint_type: archive-extraction or file-materialization path
sensitive_sink: filesystem write outside the intended extraction or artifact directory
attacker_capabilities:
- influence forkchoice, sync, finality, or consensus input observed by the node
- trigger edge-case state transitions during startup, rewind, or promotion
- provide an archive or file path containing traversal, symlink, or absolute-path entries
exploit_preconditions:
- the affected validation path is reachable before an equivalent fail-closed check runs
- the malformed or ambiguous input is accepted far enough to influence a security-sensitive decision
- no upstream component has already canonicalized, authenticated, or bounded the relevant field
- for hardening-only records, practical exploitability still depends on deployment exposure and attacker control
  of the input source
blast_radius: host-local
impact_types:
- incorrect-forkchoice-state
- consensus-integrity
- state-integrity
- host-filesystem-integrity
severity_guess: medium
severity_rationale: Evidence supports security hardening, but the raw finding does not prove a complete attacker-triggered
  exploit. Severity is medium because the affected path can influence host-filesystem-integrity, while deployment
  exposure, compensating checks, and concrete impact remain the main limiters.
code_shape_summary: The buggy shape was a archive-extraction or file-materialization path that allowed data or state
  to approach filesystem write outside the intended extraction or artifact directory before fully enforcing path-confinement.
  Startup forkchoice classification was driven by sync-stage shortcuts and a recovery shortcut that promoted the
  current unsafe/new payload to safe and finalized, instead of deriving those heads from stronger protocol context.
search_motifs:
- archive extraction joins paths without containment check
- tar entry names, links, or absolute paths reach filesystem writes
- cleanup/overwrite logic trusts paths from the artifact
- state promotion, rewind, or finalization proceeds without parent/canonicality/freshness check
- derivation updates persisted state before all protocol attributes are validated
- fork-specific validation is missing on one post-upgrade branch
negative_signals:
- an earlier boundary already rejects the same malformed field under all reachable modes
- the changed code is test-only, generated-only, logging-only, or pure refactor with no runtime decision change
- the input is not attacker-influenced and cannot be affected by a faulty peer, operator, backend, or sequencer
- downstream consensus/proof verification recomputes the property fail-closed before any state or privilege is committed
- the patch only improves diagnostics or compatibility and does not alter acceptance, rejection, binding, bounds,
  or state-transition behavior
patch_pattern: Remove implicit head promotion at a sensitive state transition and recompute startup forkchoice from
  protocol-derived context before enabling downstream processing.
