- taxonomy_refinement
missing_property: protocol-state-invariant
violated_invariant: After the L2 safe head, a span batch should not yield or validate a singular batch whose L1
  origin number is older than the safe head's L1 origin; if extraction fails, the derivation path should discard
  that span-batch state rather than continue with ambiguous state.
trust_boundary: sequencer/batch/transaction input -> derivation or execution engine
entrypoint_type: transaction-handler or batch-derivation path
sensitive_sink: block payload acceptance, execution attributes, or derived state transition
attacker_capabilities:
- influence forkchoice, sync, finality, or consensus input observed by the node
- trigger edge-case state transitions during startup, rewind, or promotion
exploit_preconditions:
- the affected validation path is reachable before an equivalent fail-closed check runs
- the malformed or ambiguous input is accepted far enough to influence a security-sensitive decision
- no upstream component has already canonicalized, authenticated, or bounded the relevant field
- for hardening-only records, practical exploitability still depends on deployment exposure and attacker control
  of the input source
blast_radius: chain-or-network-wide if the invalid state is accepted; otherwise node-local
impact_types:
- consensus-integrity-risk
- consensus-integrity
- state-integrity
severity_guess: medium
severity_rationale: Evidence supports security hardening, but the raw finding does not prove a complete attacker-triggered
  exploit. Severity is medium because the affected path can influence consensus-or-state-integrity, while deployment
  exposure, compensating checks, and concrete impact remain the main limiters.
code_shape_summary: The buggy shape was a transaction-handler or batch-derivation path that allowed data or state
  to approach block payload acceptance, execution attributes, or derived state transition before fully enforcing
  protocol-state-invariant. The changed code indicates missing invariant enforcement for post-safe-head span-batch
  overlap cases, plus weaker local recovery when singular-batch extraction failed.
search_motifs:
- state promotion, rewind, or finalization proceeds without parent/canonicality/freshness check
- derivation updates persisted state before all protocol attributes are validated
- fork-specific validation is missing on one post-upgrade branch
- transaction-handler or batch-derivation path reaches block payload acceptance, execution attributes, or derived
  state transition with partial validation
- protocol-state-invariant is enforced in one path but missing in an alternate path
negative_signals:
- an earlier boundary already rejects the same malformed field under all reachable modes
- the changed code is test-only, generated-only, logging-only, or pure refactor with no runtime decision change
- the input is not attacker-influenced and cannot be affected by a faulty peer, operator, backend, or sequencer
- downstream consensus/proof verification recomputes the property fail-closed before any state or privilege is committed
- the patch only improves diagnostics or compatibility and does not alter acceptance, rejection, binding, bounds,
  or state-transition behavior
patch_pattern: Add explicit invariant checks in both validation and extraction paths, and convert extraction failures
  into a safe reset/retry path.
