- taxonomy_refinement
missing_property: integrity-binding
violated_invariant: 'Header validation must enforce the OP-stack fork-specific blob-gas rules: after Ecotone, both
  blob_gas_used and excess_blob_gas must be present; excess_blob_gas must be 0; before Jovian, blob_gas_used must
  also be 0; after Jovian, blob_gas_used is allowed to represent the current DA footprint instead of following generic
  EIP-4844 parent-derived coupling.'
trust_boundary: external proof/data provider -> verifier/derivation code
entrypoint_type: proof-or-data-verification path
sensitive_sink: acceptance of cryptographic, blob, preimage, or proof data into derivation/state
attacker_capabilities:
- influence sequencer, batch, transaction, or L1-derived input consumed by derivation/execution
- provide malformed payload fields that reach protocol validation
exploit_preconditions:
- the affected validation path is reachable before an equivalent fail-closed check runs
- the malformed or ambiguous input is accepted far enough to influence a security-sensitive decision
- no upstream component has already canonicalized, authenticated, or bounded the relevant field
- for hardening-only records, practical exploitability still depends on deployment exposure and attacker control
  of the input source
blast_radius: chain-or-network-wide if the invalid state is accepted; otherwise node-local
impact_types:
- consensus-divergence-risk
- consensus-integrity
- state-integrity
severity_guess: medium
severity_rationale: Evidence supports security hardening, but the raw finding does not prove a complete attacker-triggered
  exploit. Severity is medium because the affected path can influence consensus-or-state-integrity, while deployment
  exposure, compensating checks, and concrete impact remain the main limiters.
code_shape_summary: The buggy shape was a proof-or-data-verification path that allowed data or state to approach
  acceptance of cryptographic, blob, preimage, or proof data into derivation/state before fully enforcing integrity-binding.
  A generic Ethereum EIP-4844 parent-based blob-gas validation rule was reused in an Optimism consensus path even
  though the OP-stack semantics diverge after Ecotone and Jovian.
search_motifs:
- state promotion, rewind, or finalization proceeds without parent/canonicality/freshness check
- derivation updates persisted state before all protocol attributes are validated
- fork-specific validation is missing on one post-upgrade branch
- object is internally valid but not checked against requested hash/index/context
- proof or witness hash is computed from the wrong representation or lifecycle point
- external data provider result is consumed before identity binding is verified
negative_signals:
- an earlier boundary already rejects the same malformed field under all reachable modes
- the changed code is test-only, generated-only, logging-only, or pure refactor with no runtime decision change
- the input is not attacker-influenced and cannot be affected by a faulty peer, operator, backend, or sequencer
- downstream consensus/proof verification recomputes the property fail-closed before any state or privilege is committed
- the patch only improves diagnostics or compatibility and does not alter acceptance, rejection, binding, bounds,
  or state-transition behavior
patch_pattern: Replace a reused upstream validation rule with subsystem-specific, fork-gated consensus checks at
  the header admission boundary when local protocol semantics diverge.
