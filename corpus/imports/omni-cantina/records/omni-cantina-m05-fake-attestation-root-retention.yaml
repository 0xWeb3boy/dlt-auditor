severity_guess: "medium"
severity_rationale: "Medium because one malicious validator can create large retained state over time, though bounded by vote limits and trim lag."
code_shape_summary: "Valid-looking fake attestation roots from a validator are admitted and retained long enough that EndBlock approval and cleanup paths must iterate growing pending state."
