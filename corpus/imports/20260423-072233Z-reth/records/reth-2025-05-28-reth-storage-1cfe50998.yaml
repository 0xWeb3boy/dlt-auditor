severity_rationale: "Canonical persistence is critical, but the available evidence supports hardening around missing data rather than a demonstrated corruption bug."

code_shape_summary: "The persistence path assumed trie updates were present when forked ancestry became canonical. The patch adds ancestor missing-data detection, makes persistence batching fallible, and guards trie-update extraction during canonical removal."
