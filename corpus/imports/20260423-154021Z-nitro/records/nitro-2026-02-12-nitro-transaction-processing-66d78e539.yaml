missing_property: "atomic-derived-transaction-processing"
violated_invariant: "A user transaction and its derived retryable auto-redeems should be processed atomically for consensus so that a filter failure in a derived redeem reverts the entire group."
trust_boundary: "transaction execution->derived retryable redeem processing"
entrypoint_type: "block-production-or-transaction-group-processing"
