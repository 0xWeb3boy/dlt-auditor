severity_guess: "medium"
severity_rationale: "A panic in transaction ingress can affect validator availability, but the evidence did not prove process-wide termination or network-wide denial of service."

code_shape_summary: "A packet buffering loop deletes invalid entries from an id-indexed transaction container, then falls through to later code that treats the deleted id as present."
search_motifs:
  - "remove_by_id followed by expect transaction must exist"
  - "invalid transaction removed without continue"
  - "expired blockhash branch deletes current item then dereferences it"
  - "container deletion and same-loop infallible lookup"
negative_signals:
  - "The lookup after removal is optional and handled without panic."
  - "The code always continues or returns immediately after deleting the current item."
  - "The removed item is not attacker-influenced or the path is test-only."
patch_pattern: "Add immediate continue/return after removing invalid items so later processing cannot dereference removed container entries."

