entrypoint_type: "packet-verification-queue"
sensitive_sink: "sigverify verifier capacity and forwarding pipeline"

attacker_capabilities:
  - "Flood transaction packets toward the verifier pipeline."
  - "Exploit accounting gaps where work is accepted without consuming or releasing in-flight capacity correctly."
exploit_preconditions:
  - "The verifier accepts packets while in-flight count is at or above capacity."
  - "In-flight accounting can leak or fail to decrement around async send/verify completion."
