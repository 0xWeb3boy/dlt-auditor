severity_guess: "medium"
severity_rationale: "Sigverify is remotely fed and resource-sensitive, but the evidence did not show an actual validator crash, exhaustion reproduction, or consensus impact."

code_shape_summary: "A packet verification service accepts asynchronous work without a single shared in-flight counter that is checked before enqueueing and updated across verify/send completion."
search_motifs:
  - "sigverify in_flight_count leak"
  - "drop packets when verifier capacity reached"
  - "async verifier capacity not checked before receive"
  - "in-flight counter not decremented on send path"
negative_signals:
  - "The queue is bounded and enforces backpressure before allocation or verification work."
  - "In-flight accounting is purely metrics and not an admission decision."
  - "The input source is trusted or rate-limited elsewhere."
patch_pattern: "Introduce shared in-flight accounting, check capacity before accepting new packets, drop over-capacity packets, and count those drops for observability."

