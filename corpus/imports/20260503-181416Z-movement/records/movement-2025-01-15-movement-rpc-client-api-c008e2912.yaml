recommended_uses: ["retrieval_exemplar", "eval_positive", "taxonomy_refinement"]

missing_property: "known-signer-verification-before-response"
violated_invariant: "Data returned across a trusted light-node or RPC read boundary must be verified against the configured signer set before it is serialized as trusted output."
trust_boundary: "DA stream data crossing from an external availability source into light-node RPC responses consumed by clients."
entrypoint_type: "streaming read API / pass-through RPC response generation"
sensitive_sink: "serialization of DA blob contents as verified pass-through output"

attacker_capabilities:
  - "supply or relay DA blobs on the read stream"
  - "present blobs that are structurally valid but not signed by known signers"
exploit_preconditions:
  - "The read path converts DA blobs directly into responses."
  - "Configured verifier operations are not invoked before response serialization."
blast_radius: "Clients can consume unverified DA payloads as if they came from the trusted signer set; downstream impact depends on what clients do with pass-through output."

impact_types:
  - "data-integrity"
  - "missing-signature-verification"
  - "trusted-output-contamination"
severity_guess: "high"
severity_rationale: "This is confirmed by Phase 4 and sits at a trust boundary where unverified external DA data was returned to clients; severity can be high when clients rely on the response for protocol state."

code_shape_summary: "A DA light-node pass-through read stream serialized each DA blob directly into an RPC response. The fix wires a VerifierOperations implementation into the light-node type and calls verifier.verify(blob, height) before serializing only the verified inner blob."
search_motifs:
  - "stream_read_from_height maps external blob directly into RPC response"
  - "verifier object exists but is absent from read path"
  - "patch adds generic VerifierOperations to service type"
  - "response serializes Verified<T>::into_inner instead of raw blob"
negative_signals:
  - "Do not flag if the upstream stream already enforces the same known-signer verifier and passes only verified types."
  - "Do not claim transaction signature bypass unless the returned blob is used as transaction authorization."
  - "A public mirror endpoint may intentionally return unverified raw data if it is clearly typed and documented as untrusted."
patch_pattern: "Thread a verifier dependency into the stream service, verify each blob at its DA height before response construction, and change response serialization to consume verified inner data only."

