code_shape_summary: "The supplied evidence supports a likely denial-of-service fix in the downloader hash-queueing path. Before the change, fetchHashes kept signaling continuation after inserting each batch. The patch adds maxQueuedHashes and makes continuation depend on d.queue.Pending() < maxQueuedHashes, stopping further fetches when the queue is full. Root cause: The hash fetch loop lacked an explicit bound on pending queued hashes and continued requesting more peer-supplied hashes without checking whether the backlog was already too large."
