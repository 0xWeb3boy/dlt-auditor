code_shape_summary: "The patch adds txpool admission checks for EIP-7702-style delegated or pending-authorization accounts. Based on the supplied commit message and code snippets, it is a security-relevant hardening change aimed at reducing a mempool abuse pattern involving blob transaction spam, eviction pressure, and later cancellation. Root cause: The txpool did not fully enforce cross-subpool exclusivity for delegated senders and SetCode authority addresses. From the supplied evidence, that left room for blob and authorization-related transactions to interact in a way that could be used to create txpool eviction and cancellation pressure."
