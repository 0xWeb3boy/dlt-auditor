code_shape_summary: "The patch changes GetRootHash(start,end) so it anchors cache checks and reorg detection to the canonical block at end instead of the current chain tip. The evidence supports a correctness bug during reorgs that could otherwise yield a root computed from inconsistent chain state, but the provided material does not establish a concrete security vulnerability. Root cause: GetRootHash was checking stability against the wrong chain reference. The pre-patch logic used the current tip hash even though the returned root is for a specific [start,end] range, so a reorg affecting that range could slip past a tip-based check."
search_motifs:
  - "block/header/transaction validation has a special case that bypasses a consensus rule"
  - "fork-choice or state-transition code derives canonical state before checking all protocol invariants"
  - "reward, validator-set, timestamp, gas, or root validation differs across execution paths or fork eras"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Consensus findings need evidence that different valid-looking inputs or node versions can reach divergent acceptance, state, or fork-choice behavior."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that an attacker could deliberately trigger and exploit this race beyond ordinary chain reorg behavior."
patch_pattern: "Anchor range-derived results to a range-specific canonical block, and validate that anchor both before using cached data and after concurrent collection work."

