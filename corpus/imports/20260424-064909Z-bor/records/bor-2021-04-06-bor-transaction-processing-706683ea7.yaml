code_shape_summary: "The evidence supports an API-correctness fix for eth_chainId, not a confirmed vulnerability fix. Before the patch, two different implementations existed with different behavior: one returned the configured chain ID unconditionally as *hexutil.Big, while another gated on IsEIP155(...) but returned hexutil.Uint64. The patch removes the duplicate path and makes internal/ethapi the canonical implementation with EIP-155 gating and bigint return semantics. Root cause: Duplicated eth_chainId implementations had diverged in behavior. One path enforced the EIP-155 activation check but narrowed the value type; the other preserved bigint width but skipped the activation check entirely."
search_motifs:
  - "signed hash omits chain id, domain tag, nonce, signer scope, or payload type"
  - "RPC signer accepts ambiguous raw bytes or transaction fields without explicit user-visible context"
  - "verification recovers an address from a partially bound message and treats it as authorized"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Signature findings need evidence that the omitted field is security-relevant and not bound by another mandatory envelope or transport context."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that unconditional pre-fork chainId exposure was exploitable in practice."
patch_pattern: "Remove inconsistent duplicate API implementations and consolidate behavior in one canonical path that enforces the same state gate and value representation."

