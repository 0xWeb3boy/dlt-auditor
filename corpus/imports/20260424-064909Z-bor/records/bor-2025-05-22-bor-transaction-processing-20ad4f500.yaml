code_shape_summary: "The patch adds an explicit per-transaction blob-count limit to txpool validation and sets a blobpool-specific cap of 7 blobs. That is evidence of resource-control hardening in blobpool admission, but the supplied material does not establish that the prior behavior was a concrete security bug rather than a robustness or policy gap. Root cause: A per-transaction blob-count limit was not explicitly enforced in the shared txpool validation inputs and admission path used by blobpool."
