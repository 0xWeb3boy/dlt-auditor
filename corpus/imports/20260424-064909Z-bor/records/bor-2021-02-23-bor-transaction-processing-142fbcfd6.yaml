severity_guess: "high"
severity_rationale: "High severity guess because the finding is a confirmed security hardening affecting transaction-replay; tune downward when deployment controls or missing exploit evidence limit reachability."

code_shape_summary: "The patch hardens the RPC transaction submission path by rejecting non-EIP-155-signed transactions unless the operator explicitly enables an override. The evidence supports a missing replay-protection check on this RPC boundary before the change, but it does not prove a broader protocol or consensus flaw. Root cause: The RPC submission boundary did not enforce replay protection by default. In the provided pre-patch snippet, unprotected transactions could pass the visible fee-cap checks and reach SendTx without a shown EIP-155 protection check."
search_motifs:
  - "signed hash omits chain id, domain tag, nonce, signer scope, or payload type"
  - "RPC signer accepts ambiguous raw bytes or transaction fields without explicit user-visible context"
  - "verification recovers an address from a partially bound message and treats it as authorized"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Signature findings need evidence that the omitted field is security-relevant and not bound by another mandatory envelope or transport context."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof of a concrete exploit, incident, or attacker-controlled exposure in default deployments."
patch_pattern: "Add an explicit security check at the external submission boundary, then plumb a narrowly scoped configuration override for deployments that intentionally need legacy behavior."

