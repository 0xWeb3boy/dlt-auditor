code_shape_summary: "The patch fixes a consensus-validation flaw in Bor state-sync handling. Before the change, the finalization path shown in the evidence relied on the last transaction's type and did not explicitly reject receipt/transaction count divergence after state-sync handling. The patch adds canonical state-sync transaction reconstruction plus hash comparison, and the state processors now fail when finalization leaves receipts out of sync with the block body. Root cause: State-sync finalization under-enforced the block validity invariant: the code path shown did not prove that the block body's trailing state-sync transaction matched the locally derived state-sync payload, and downstream processing did not immediately fail on the resulting receipt/transaction mismatch."
