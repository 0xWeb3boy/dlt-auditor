code_shape_summary: "The patch separates signing setup from the node stack account manager and adds an authorized guard around Clique authorization during mining startup. That is consistent with hardening around wallet-endpoint disabling, but the provided evidence does not establish a concrete pre-patch vulnerability or a proven unauthorized signing path. Root cause: The shown code mixed server-local signing setup with the node-wide account manager and did not explicitly track the case where consensus authorization had already been completed before StartMining. The evidence supports a design-tightening change, not a demonstrated exploit."
search_motifs:
  - "RPC method continues after backend error or returns success with partial/unchecked data"
  - "public query accepts unbounded range, path, or selector before authorization and limit checks"
  - "administrative or debug endpoint exposes privileged behavior without explicit gating"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "RPC findings are lower risk when the method is disabled by default, authenticated, strictly local-only, or returns only non-sensitive metadata."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No patch evidence shows the exact pre-patch RPC exposure or default network reachability of personal endpoints."
patch_pattern: "Separate privileged signing setup from the shared node account manager and add explicit state to avoid repeating authorization during miner startup."

