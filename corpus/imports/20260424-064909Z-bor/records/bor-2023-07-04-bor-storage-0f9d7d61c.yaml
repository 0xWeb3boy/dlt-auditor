code_shape_summary: "The evidence supports a txpool correctness and robustness fix, not a demonstrated vulnerability fix. The patch adds revalidation of conditional transactions during txpool maintenance and makes KnownAccounts validation return an error when the referenced storage trie is absent. Root cause: Pending conditional transactions were not being revalidated against current state during txpool maintenance, and ValidateKnownAccounts assumed the storage trie existed in one validation branch instead of treating absence as an ordinary validation failure."
search_motifs:
  - "state or trie data is loaded from disk or peer response without recomputing the expected root/hash"
  - "path or key material from an external source reaches storage lookup/write before normalization"
  - "missing mismatch handling lets corrupt or stale state be treated as canonical"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Consensus findings need evidence that different valid-looking inputs or node versions can reach divergent acceptance, state, or fork-choice behavior."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that an external peer could reliably trigger the missing-trie case before this patch."
patch_pattern: "Add explicit state revalidation in txpool maintenance and replace unchecked state assumptions with error-returning validation."

