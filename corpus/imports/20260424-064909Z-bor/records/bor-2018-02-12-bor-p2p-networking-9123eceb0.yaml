  - "Treat as hardening when the patch only improves error reporting, refactoring, or defensive checks without attacker reachability."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No bug report, advisory, or test demonstrates attacker-controlled exploitation of unrelated pong acceptance."
patch_pattern: "Bind asynchronous network replies to the initiating request, while tightening surrounding bootstrap and table-management checks."

