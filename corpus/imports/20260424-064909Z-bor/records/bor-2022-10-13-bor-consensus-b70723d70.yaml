code_shape_summary: "The diff supports a correctness or hardening change in Bor's whitelist milestone lock state, but it does not establish a concrete vulnerability. The implementation now tightens lock progression rules and stores the locked sprint hash, and the tests were updated to exercise that behavior. Root cause: The evidence points to incomplete milestone lock-state handling: the prior code did not fully enforce monotonic lock transitions and did not retain the associated end-block hash in the lock state."
