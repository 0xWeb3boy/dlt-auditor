code_shape_summary: "The patch shows previously missing or incomplete range-limit enforcement in RPC log-filter paths, plus normalization of symbolic block numbers for that check. That is resource-control relevant, but the provided evidence does not establish an actual exploitable vulnerability rather than a correctness or hardening fix. Root cause: Range-limit enforcement was not consistently applied in the RPC filter code paths handling block-range log queries, and symbolic block selectors needed explicit normalization for that validation logic."
