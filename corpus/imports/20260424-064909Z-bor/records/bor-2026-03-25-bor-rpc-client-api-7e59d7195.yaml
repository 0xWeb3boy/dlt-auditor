code_shape_summary: "The provided evidence supports a consensus-relevant determinism fix in Bor's state-sync import path. The patch adds a deterministic-state-sync gate and a Heimdall height lookup by cutoff time to avoid different validators deriving different state-sync sets from different Heimdall views. The evidence does not prove exploitation or a historical chain split. Root cause: The consensus path selected imported state-sync data using a time-based Heimdall query without first pinning the read to a canonical Heimdall snapshot boundary. Different validators querying different Heimdall views could therefore derive different state-sync sets for the same Bor block."
