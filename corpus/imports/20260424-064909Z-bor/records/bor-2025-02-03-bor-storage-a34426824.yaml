code_shape_summary: "The visible patch reintroduces an explicit ForkChoice.ReorgNeeded check in the header import path and updates tests to model fork-choice decisions for past, future, and overlapping inserts. That supports a regression in canonical-branch selection logic, but the provided evidence does not establish an actual exploitable security vulnerability. Root cause: The evidence supports that an explicit fork-choice decision point in header import was removed or no longer enforced in the reverted change, and this patch restores that gate before treating imported headers as canonical progression."
