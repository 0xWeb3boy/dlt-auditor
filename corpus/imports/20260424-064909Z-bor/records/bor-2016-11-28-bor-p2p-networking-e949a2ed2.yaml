code_shape_summary: "The supported evidence shows a correctness fix in Swarm network ID handling across configuration, protocol startup, and handshake validation. It does not by itself establish a concrete security vulnerability or exploit path. Root cause: The configured swarm network ID was not carried consistently into connection-specific protocol state, and the handshake check used a global default value instead of the local instance value."
