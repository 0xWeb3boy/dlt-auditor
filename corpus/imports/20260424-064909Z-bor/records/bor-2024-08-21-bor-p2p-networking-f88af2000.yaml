code_shape_summary: "The grounded change is a downloader hardening fix in eth/downloader/bor_downloader.go. On header-processing termination in non-beacon mode, the code now consults a gotHeaders flag, compares the peer-advertised total difficulty to the local head total difficulty, and returns errStallingPeer when the peer claimed a stronger chain but no headers were delivered. Root cause: The termination path lacked an explicit final validation that a peer claiming a stronger chain had actually produced header progress before sync termination was accepted."
