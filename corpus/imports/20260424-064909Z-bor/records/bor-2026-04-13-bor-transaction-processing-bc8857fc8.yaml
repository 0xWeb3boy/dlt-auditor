code_shape_summary: "The patch hardens Bor block finalization by turning silent failure cases into explicit errors and by making both state processors stop when finalization or state-sync receipt accounting is inconsistent. The provided evidence supports a consensus-correctness and invariant-enforcement fix, but it does not establish a concrete security vulnerability or show that invalid blocks were previously accepted. Root cause: The finalization interface did not provide an explicit error channel for invalid Bor finalization outcomes, so unsupported block-body fields and some state-sync receipt inconsistencies were represented indirectly through the returned receipts instead of being authoritative failures at the finalization boundary."
