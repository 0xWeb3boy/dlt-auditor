code_shape_summary: "The evidence supports a regression fix in how configured required-block mappings are wired from configuration into the ETH peer handler. It does not, from the provided hunks alone, establish a concrete vulnerability or prove an exploitable security bypass. Root cause: A regression left required-block handling wired to an older PeerRequiredBlocks path instead of the current RequiredBlocks path, causing inconsistent propagation of configured required-block data into peer startup logic."
