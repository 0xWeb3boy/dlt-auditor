code_shape_summary: "The evidence supports a resource-control and correctness change in the RPC log-filter subsystem: range-based log queries now check a configured block-range limit before building filters, and symbolic block numbers are normalized for that check. The supplied hunks do not establish a concrete vulnerability or demonstrated exploit path, so this should be treated as unclear rather than confirmed security work. Root cause: The visible issue is inconsistent or missing enforcement of a configured block-range limit in several RPC log-filter entry points. The commit subject also mentions config pass-through, but the provided evidence does not show that wiring bug directly."
