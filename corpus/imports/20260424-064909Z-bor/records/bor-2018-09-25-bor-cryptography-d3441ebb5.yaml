code_shape_summary: "The supplied evidence supports a security-hardening change in the Clef signer API, not a demonstrated exploit fix. The grounded changes are fail-closed handling of transaction-validation warnings, removal of the externally exposed EcRecover helper, and stricter password handling in new-account creation. Root cause: The signer API was too permissive at the trust boundary: validator warnings were not enforced as blocking conditions by default, the remote API exposed an extra helper operation, and account-creation password input handling was weaker than the patched version."
search_motifs:
  - "signed hash omits chain id, domain tag, nonce, signer scope, or payload type"
  - "RPC signer accepts ambiguous raw bytes or transaction fields without explicit user-visible context"
  - "verification recovers an address from a partially bound message and treats it as authorized"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Signature findings need evidence that the omitted field is security-relevant and not bound by another mandatory envelope or transport context."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No diff is provided for the claimed AES-GCM key/value swap fix, so that cryptographic claim is not validated here."
patch_pattern: "Harden a signer trust boundary by failing closed on validator warnings, reducing exposed remote API surface, and tightening validation around sensitive account-creation inputs."

