code_shape_summary: "The only runtime change shown is in core/vm/eips.go, where opAuthCall stops popping one extra stack item while decoding AUTHCALL operands. That supports a real opcode-decoding bug in an authorization-related path, but the provided evidence does not establish an exploitable security vulnerability. Root cause: opAuthCall consumed one more stack item than the subsequent logic used, so later operands could be shifted relative to the intended AUTHCALL layout."
