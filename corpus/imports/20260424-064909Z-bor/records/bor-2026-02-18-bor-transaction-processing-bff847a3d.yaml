code_shape_summary: "The provided evidence supports a bounded-work hardening/fix in Bor's background pending-header verification path, motivated by possible OOM from large header reads. It does not establish a confirmed security vulnerability, because the visible hunks do not show a proven attacker-controlled trigger or fully show the claimed cap logic. Root cause: The background verifier built its work from the distance between a milestone boundary and the current head and materialized headers into memory before batch verification. The supplied evidence suggests that this path lacked a sufficiently explicit bounded-work control and relied on weaker configuration/startup assumptions than the patched version."
