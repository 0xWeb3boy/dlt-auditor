code_shape_summary: "The patch adds an explicit terminal-total-difficulty check to the beacon mixed pre/post-merge header-validation path and preserves that failure during async result collection. The supplied evidence supports a consensus-validity bug around terminal PoW block selection, but not a stronger claim about real-world exploitation. Root cause: The transition-validation path did not visibly enforce the terminal-total-difficulty invariant on the pre-merge PoW segment before asynchronous result aggregation, and the collector could overwrite an earlier TTD-based rejection. That left the terminal-block validity rule under-enforced in the mixed merge-transition path."
