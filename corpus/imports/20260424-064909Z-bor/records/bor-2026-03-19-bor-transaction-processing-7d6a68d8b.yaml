code_shape_summary: "The supplied evidence shows added range-limit enforcement and block-number normalization in eth/filters RPC paths, which is consistent with resource-control hardening. But the provided hunks do not establish that a concrete vulnerability previously existed, how severe it was, or whether earlier code lacked other effective protections. This is better treated as security-relevant but unproven from the evidence here. Root cause: The visible issue is inconsistent or previously missing range-budget enforcement on some RPC log/filter entry points, plus the need to normalize symbolic block numbers for the guard logic. The commit message suggests config pass-through was also involved, but that part is not directly shown in the provided hunks."
