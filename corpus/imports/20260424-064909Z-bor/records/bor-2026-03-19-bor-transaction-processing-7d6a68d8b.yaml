  - "No provided hunk shows the implementation or prior absence of checkBlockRangeLimit deeper in the stack."
patch_pattern: "Add explicit resource-budget validation at each RPC entry point before expensive filter construction, and normalize symbolic user inputs when the guard logic requires concrete numeric ranges."

