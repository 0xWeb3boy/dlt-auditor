code_shape_summary: "The evidence supports a chain-selection hardening change, not a state-corruption fix. In core/blockchain.go, equal-total-difficulty same-height forks were previously broken partly at random; the patch changes that path to prefer the locally mined block as canonical, with an explicit Clique exception due to deadlock risk. Added isLocalFn plumbing in BlockChain/NewBlockChain supports that policy, but the provided excerpts do not prove more than local reorg-policy hardening. Root cause: The supported root cause is a weak equal-difficulty tie-break rule in canonical-head selection: same-height ties could trigger a random reorg instead of preserving the local node's freshly mined head. The patch also adds local-miner-awareness plumbing, which suggests the prior code lacked the context needed to express that preference cleanly."
search_motifs:
  - "block/header/transaction validation has a special case that bypasses a consensus rule"
  - "fork-choice or state-transition code derives canonical state before checking all protocol invariants"
  - "reward, validator-set, timestamp, gas, or root validation differs across execution paths or fork eras"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Consensus findings need evidence that different valid-looking inputs or node versions can reach divergent acceptance, state, or fork-choice behavior."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "The excerpt does not show the full same-height branch or the exact use of isLocalFn in decision-making."
patch_pattern: "Replace probabilistic tie-breaking in a security-relevant reorg path with an explicit local-policy rule, and add the minimal identity/context plumbing needed to apply that rule while preserving engine-specific exceptions."

