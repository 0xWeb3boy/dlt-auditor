code_shape_summary: "The evidence shows a consensus-sensitive correctness hardening: Bor.Finalize now returns explicit errors for unsupported body fields, and both block processors now propagate those errors and fail on state-sync receipt-accounting mismatches. The supplied excerpts do not establish a concrete pre-patch vulnerability beyond silent or delayed handling of invalid conditions. Root cause: The shown issue is an enforcement gap at the Bor finalization boundary: invalid or unsupported conditions were not surfaced as explicit errors from Finalize, and callers had no direct failure channel. The excerpts support missing validation and error propagation; they do not fully prove a deeper corruption or exploit path."
