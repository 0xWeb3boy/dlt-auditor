code_shape_summary: "The patch changes the downloader so an unknown-parent head is reported as an error instead of being silently treated as \"no blocks available.\" That is clear validation hardening in the sync pipeline, but the provided evidence does not establish a concrete exploit or security impact beyond handling an invalid state more explicitly. Root cause: The downloader boundary conflated two different states: an empty queue and a queued block batch whose head did not connect to known local chain state. That hid invalid input/state from the caller instead of surfacing it explicitly."
