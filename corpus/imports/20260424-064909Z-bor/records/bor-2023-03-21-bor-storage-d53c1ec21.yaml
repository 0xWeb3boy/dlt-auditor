code_shape_summary: "The patch changes Bor header verification so validator retrieval no longer walks backward across ancestor hashes on lookup failure and instead uses a single explicit block-number-or-hash query path. That supports a consensus-correctness fix around validator-set sourcing, but the provided evidence does not establish that the pre-fix behavior was an exploitable vulnerability or even whether it accepted invalid headers, rejected valid ones, or both. Root cause: The verifier's validator lookup logic mixed consensus checking with fallback retry behavior that could change the state source from the immediate parent context to older ancestors after errors, instead of using one explicit lookup path."
search_motifs:
  - "block/header/transaction validation has a special case that bypasses a consensus rule"
  - "fork-choice or state-transition code derives canonical state before checking all protocol invariants"
  - "reward, validator-set, timestamp, gas, or root validation differs across execution paths or fork eras"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Consensus findings need evidence that different valid-looking inputs or node versions can reach divergent acceptance, state, or fork-choice behavior."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No advisory, bug report, or commit message states an exploitable vulnerability."
patch_pattern: "Replace error-driven fallback across multiple historical state snapshots with a single explicit state-selection API and fail on retrieval errors."

