code_shape_summary: "The patch adds a missing upper bound on Rio-era block timestamps in verifyHeader. The shown evidence supports a consensus-liveness issue where a validator-supplied far-future header could pass the relaxed Rio checks before this change; after the patch, headers more than 30 seconds ahead of local time are rejected with ErrFutureBlock. Root cause: After Rio relaxed timestamp validation to allow flexible block times, verifyHeader no longer enforced an upper bound on validator-controlled header.Time relative to the local clock."
