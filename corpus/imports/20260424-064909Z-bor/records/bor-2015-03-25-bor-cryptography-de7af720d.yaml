code_shape_summary: "This patch addresses a discovery-protocol UDP reflection/amplification issue. Before the change, a findnode request could reach the neighbors reply path without a prior bond check. After the change, unbonded senders are rejected with errUnknownNode, preventing that reply path. Root cause: The discovery handler trusted an unbonded sender enough to process findnode and emit a larger UDP response, enabling spoofed-source reflection/amplification."
search_motifs:
  - "UDP or unauthenticated request handler sends a larger reply before bond/session validation"
  - "discovery find/lookup request reaches neighbors or peer-list response without source proof"
  - "reply generation and peer-table mutation occur before reachability or request-correlation checks"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Availability claims need an externally triggerable path and enough cost asymmetry, crashability, or missing throttling to matter."
  - "Patch does not prove complete protection against replay within the expiration window."
  - "Patch does not show stricter source-address validation beyond the bonding requirement."
patch_pattern: "Require prior protocol state before honoring a request that can trigger a larger response."

