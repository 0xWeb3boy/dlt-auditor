code_shape_summary: "The supported security-relevant change is stricter consensus/header validation for Difficulty. Before the patch, seal verification compared header.Difficulty.Uint64() to the expected signer difficulty while header sanity checks still allowed Difficulty values above 64 bits. After the patch, non-uint64 Difficulty values are rejected in verifySeal and header sanity checking is tightened to a 64-bit limit, closing a truncation-based acceptance gap for malformed headers. Root cause: Canonical width validation for the Difficulty field was inconsistent. verifySeal narrowed big.Int to uint64 before validating representability, while Header.SanityCheck permitted wider values, allowing malformed non-canonical encodings to reach consensus comparison."
search_motifs:
  - "gas, fee, size, or work accounting uses unchecked add/mul/cast on attacker-influenced values"
  - "large protocol parameter crosses uint/int or narrow/wide type boundary before validation"
  - "resource charge is computed after state mutation or uses a value that can wrap or truncate"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Treat as hardening when the patch only improves error reporting, refactoring, or defensive checks without attacker reachability."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that the pre-patch behavior was exploitable in practice on a live network."
patch_pattern: "Reject oversized or non-canonical numeric encodings before narrowing or comparing protocol fields in consensus logic."

