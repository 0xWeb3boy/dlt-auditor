  - "No full diff shows the exact accept/reject behavior before and after the validator comparison."
patch_pattern: "Retarget a consensus check to the correct state-transition boundary, make it derive comparison data from the local authoritative source using a usable ancestor state, and replace panic-based failure handling with explicit error returns."

