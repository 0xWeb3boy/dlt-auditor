code_shape_summary: "The supported finding is a security-hardening change in the beacon consensus batch-header validation path. The evidence shows Beacon.VerifyHeaders was changed to split merge-boundary batches locally, return per-header errors when the split is invalid, and derive the PoW seal slice from preHeaders instead of relying on caller-prepared state. That supports an insufficient-validation thesis, but not stronger claims about demonstrated invalid-chain acceptance or consensus splits. Root cause: Beacon.VerifyHeaders relied too much on caller-side sanitization and caller-prepared auxiliary state when validating mixed pre-/post-merge header batches."
search_motifs:
  - "block/header/transaction validation has a special case that bypasses a consensus rule"
  - "fork-choice or state-transition code derives canonical state before checking all protocol invariants"
  - "reward, validator-set, timestamp, gas, or root validation differs across execution paths or fork eras"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Consensus findings need evidence that different valid-looking inputs or node versions can reach divergent acceptance, state, or fork-choice behavior."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that malformed headers were previously accepted onto chain rather than only mishandled during validation."
patch_pattern: "Internalize validation at the consensus boundary: compute the pre/post split locally, reject invalid splits immediately, and derive downstream verifier inputs from the validated split instead of trusting caller-supplied subsets."

