code_shape_summary: "The grounded security-relevant change is in Bor consensus difficulty validation. Before the patch, generic header sanity allowed Difficulty values above 64 bits, and seal verification compared header.Difficulty.Uint64() to the expected signer-turn value without first proving the value was representable as uint64. After the patch, both layers enforce a 64-bit bound and reject malformed difficulty values. Root cause: Validation of a consensus-significant field was inconsistent across layers: header sanity permitted wider Difficulty values than the consensus path actually intended to support, and seal verification narrowed the value to uint64 without first enforcing representability."
search_motifs:
  - "input decoder feeds state-changing logic before semantic validation"
  - "error path logs or ignores invalid data instead of failing closed"
  - "security-relevant state changes occur before all invariants are checked"
negative_signals:
  - "Do not flag if the value is produced only by trusted local code and cannot be influenced across a protocol, RPC, or persistence boundary."
  - "Do not treat as exploitable if an earlier mandatory validation step rejects the malformed input before the sensitive sink."
  - "Treat as hardening when the patch only improves error reporting, refactoring, or defensive checks without attacker reachability."
  - "The source finding was validated as hardening, so avoid overstating exploitability without additional proof."
  - "No proof that oversized difficulty could be used to bypass authorization or forge signatures."
patch_pattern: "Align generic object validation with protocol-width requirements and reject non-representable numeric values before narrowing them in security- or consensus-critical logic."

