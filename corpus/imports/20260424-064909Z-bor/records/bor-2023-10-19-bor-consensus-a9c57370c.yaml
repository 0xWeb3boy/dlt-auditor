code_shape_summary: "The patch removes a random tie-breaker from Bor's fork-choice logic and replaces it with a deterministic block-hash ordering. The evidence supports a consensus-safety hardening claim: the old code used local randomness in a consensus-critical decision path, and the new code makes that path deterministic and adds regression tests. The provided material does not prove a real-world exploit, chain split, or cross-client incompatibility. Root cause: The fork-choice implementation allowed an equal-TD, equal-height tie to be resolved by local randomness instead of a deterministic rule derived from the competing headers."
