code_shape_summary: "The provided evidence supports a correctness fix in chain-configuration compatibility checking: params/config.go adds a previously missing MetropolisBlock incompatibility check and an IsMetropolis helper. That is consensus-relevant code, but the supplied material does not establish a concrete vulnerability, exploit path, or real security impact, so this should be treated as unclear rather than a confirmed security fix. Root cause: ChainConfig.checkCompatible enforced historical compatibility for several fork parameters but omitted MetropolisBlock, leaving that fork point out of the existing compatibility gate."
