missing_property: "denomination unit conversion"
violated_invariant: "Fee amounts stored as native bank coins must be converted from wei into the native denomination before validation, display, or AuthInfo construction."
trust_boundary: "EVM transaction fee data->Cosmos SDK fee validation and tx builder"
entrypoint_type: "ante handler fee validation and BuildTx"
sensitive_sink: "AuthInfo.Fee and ValidateBasic fee denomination checks"

attacker_capabilities:
  - "Submit EVM transactions whose fee fields are interpreted across both wei and unibi units."
exploit_preconditions:
  - "txData.Fee returns wei."
  - "Code inserts that value directly into an EVMBankDenom coin without WeiToNative conversion."
blast_radius: "chain-wide"

impact_types:
  - "fee-accounting-corruption"
  - "fee-bypass-or-overcharge"
  - "transaction-validation-inconsistency"
severity_guess: "medium"
severity_rationale: "Incorrect unit binding can make validation and transaction construction disagree about economic fees by orders of magnitude."

code_shape_summary: "Fee validation and transaction building wrapped txData.Fee directly as a native denom coin even though the value was denominated in wei."
search_motifs:
  - "sdkmath.NewIntFromBigInt(txData.Fee())"
  - "NewCoin EVMBankDenom feeAmt"
  - "WeiToNative missing"
  - "AuthInfo.Fee txData.Fee unit inconsistency"
negative_signals:
  - "No issue if the denomination is actually wei-denominated."
  - "No issue if a helper already converts txData.Fee before coin creation."
  - "Beware examples with 1 wei gas price if minimum transferable unit rules forbid them."
patch_pattern: "Convert fee values through WeiToNative before constructing native denom coins in validation and transaction-building paths."

