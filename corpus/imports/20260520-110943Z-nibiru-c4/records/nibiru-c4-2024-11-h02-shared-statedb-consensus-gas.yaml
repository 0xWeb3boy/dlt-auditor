validated_as: "security-fix"
recommended_uses:
  - "retrieval_exemplar"
  - "eval_positive"
  - "taxonomy_refinement"

missing_property: "query-state isolation"
violated_invariant: "Read-only RPC simulations must not mutate keeper fields that influence later consensus transaction execution or gas accounting."
trust_boundary: "rpc-client->node-local keeper state used by consensus execution"
entrypoint_type: "eth_estimateGas or read-only EVM simulation"
sensitive_sink: "bank keeper StateDB pointer and gas-affecting SyncStateDBWithAccount control flow"

attacker_capabilities:
  - "Send read-only EVM query traffic to some nodes."
  - "Cause those nodes to execute later bank transactions with a non-nil StateDB pointer."
exploit_preconditions:
  - "The bank keeper stores StateDB as a shared mutable pointer."
  - "Nil vs non-nil StateDB changes gas-consuming execution paths."
blast_radius: "chain-wide"

impact_types:
  - "consensus-integrity"
  - "gas-nondeterminism"
  - "denial-of-service"
severity_guess: "high"
severity_rationale: "Different nodes can compute different gas for the same transaction depending on local RPC history, creating a consensus failure risk."

code_shape_summary: "NewStateDB assigned a pointer into a keeper field shared across read-only and state-mutating flows, and later bank methods branched on whether that field was nil."
search_motifs:
  - "keeper field StateDB *statedb.StateDB"
  - "NewStateDB assigns evmKeeper.Bank.StateDB"
  - "eth_estimateGas mutates keeper pointer"
  - "SyncStateDBWithAccount nil check affects gas"
negative_signals:
  - "No issue if the pointer is scoped only to the current transaction context."
  - "No issue if read-only queries use isolated keeper copies."
  - "No issue if nil vs non-nil has no consensus-visible behavior or gas difference."
patch_pattern: "Avoid multiple/shared StateDB copies during EVM execution and clear or scope the bank StateDB pointer so read-only calls cannot affect later consensus paths."

