confidence_tier: "tier_a_confirmed"
security_verdict: "confirmed"
validated_as: "security-fix"
recommended_uses:
  - "retrieval_exemplar"
  - "eval_positive"
  - "taxonomy_refinement"

missing_property: "success-failure gas accounting symmetry"
violated_invariant: "Every EVM call outcome inside a transaction must charge the Cosmos gas meter for the actual EVM gas consumed without resetting away earlier message gas."
trust_boundary: "user transaction->EVM CallContract helper->Cosmos gas meter"
entrypoint_type: "EVM CallContractWithInput helper"
sensitive_sink: "ResetGasMeterAndConsumeGas and transient/cumulative EVM gas tracking"

attacker_capabilities:
  - "Submit transactions that cause EVM helper calls to fail after consuming gas."
  - "Bundle multiple EVM messages where earlier gas can be reset away by a later failure."
exploit_preconditions:
  - "Failed call path consumes only the failed call gas or gas limit."
  - "Earlier EVM gas in the same transaction is not preserved in final Cosmos gas accounting."
blast_radius: "chain-wide"

impact_types:
  - "fee-bypass"
  - "gas-accounting-corruption"
  - "resource-exhaustion"
severity_guess: "medium"
severity_rationale: "Asymmetric failed-call accounting can undercharge batched EVM work and make block gas accounting lower than actual computation."

code_shape_summary: "The failure branch reset the gas meter with only the failed evmResp.GasUsed, while success and caller paths used different cumulative accounting rules."
search_motifs:
  - "evmResp.Failed ResetGasMeterAndConsumeGas"
  - "AddToBlockGasUsed only on success"
  - "CallContractWithInput gasUsed not bubbled to caller"
  - "multiple MsgEthereumTx in one SDK tx"
negative_signals:
  - "No issue if callers uniformly consume returned EVM gas for success and failure."
  - "No issue if transaction format forbids batching and prior gas cannot be reset away."
  - "No issue if failure always burns the full applicable gas limit."
patch_pattern: "Bubble EVM gas used to callers and consume it consistently for all outcomes, removing or simplifying the transient gas reset model."

