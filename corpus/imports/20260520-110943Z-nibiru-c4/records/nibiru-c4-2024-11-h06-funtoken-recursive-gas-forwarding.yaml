trust_boundary: "user-controlled ERC20 contract->FunToken precompile internal ERC20 query/transfer"
entrypoint_type: "FunToken precompile query or conversion call"
sensitive_sink: "CallContract using hardcoded ERC20 query or execute gas instead of caller-relative gas"

attacker_capabilities:
  - "Register or interact with a malicious ERC20 token."
  - "Make ERC20 balanceOf or transfer recursively call the FunToken precompile."
exploit_preconditions:
  - "The precompile grants a fresh hardcoded gas budget for internal ERC20 calls."
  - "The malicious token can re-enter the precompile path recursively."
blast_radius: "chain-wide"

impact_types:
  - "denial-of-service"
  - "resource-exhaustion"
  - "consensus-liveness"
severity_guess: "high"
severity_rationale: "Confirmed malicious ERC20 recursion can consume memory and halt block production because internal calls bypass remaining caller gas constraints."

code_shape_summary: "FunToken ERC20 BalanceOf and Transfer helpers used fixed gas limits for nested EVM calls, allowing recursive calls to receive fresh gas repeatedly."
search_motifs:
  - "Erc20GasLimitQuery hardcoded 100_000"
  - "Erc20GasLimitExecute"
  - "CallContract inside precompile with fixed gas"
  - "ERC20 balanceOf recursively calls precompile"
  - "63/64 gas invariant broken"
negative_signals:
  - "No issue if internal calls use at most 63/64 of remaining caller gas."
  - "No issue if the callee ERC20 is trusted and non-reentrant by construction."
  - "No issue if recursion depth and memory growth are bounded by charged caller gas."
patch_pattern: "Forward a caller-relative gas budget to ERC20 helper calls and preserve EIP-150-style gas reduction for nested precompile/EVM recursion."

