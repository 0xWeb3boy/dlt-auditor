missing_property: "freshness metadata binding"
violated_invariant: "Oracle precompile responses must bind price data to the timestamp of the price update, not to the timestamp of the later query block."
trust_boundary: "native oracle module->EVM contract freshness checks"
entrypoint_type: "Oracle queryExchangeRate precompile call"
sensitive_sink: "blockTimeMs returned to downstream EVM contracts for staleness validation"

attacker_capabilities:
  - "Rely on or trigger contracts that use queryExchangeRate blockTimeMs for freshness checks."
exploit_preconditions:
  - "Prices can become stale while GetDatedExchangeRate returns current context block time."
  - "Downstream contracts use blockTimeMs to accept or reject stale prices."
blast_radius: "application-local"

impact_types:
  - "stale-trust-state"
  - "oracle-mispricing-risk"
  - "freshness-bypass"
severity_guess: "medium"
severity_rationale: "Stale prices can appear fresh to EVM consumers, but the final report treated external consumer reliance as Medium severity."

code_shape_summary: "queryExchangeRate passed through a blockTime derived from current query context rather than persisted update-time metadata for the exchange rate."
search_motifs:
  - "GetDatedExchangeRate returns current block time"
  - "queryExchangeRate blockTimeMs"
  - "oracle price timestamp missing from storage"
  - "staleness check always current block"
negative_signals:
  - "No issue if the timestamp is persisted with the price update."
  - "No issue if consumers do not use the timestamp for freshness and docs say so clearly."
  - "No issue if stale prices are impossible due to independent oracle expiry enforcement."
patch_pattern: "Persist the block timestamp alongside each exchange rate update and return that stored timestamp from the precompile."

