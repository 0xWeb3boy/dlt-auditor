missing_property: "cross-runtime balance synchronization"
violated_invariant: "Every native bank balance change for the EVM denom must refresh the mirrored EVM StateDB balance before EVM-visible state can be committed."
trust_boundary: "EVM contract->Wasm staking capability->native bank keeper"
entrypoint_type: "EVM precompile invoking Wasm staking operations"
sensitive_sink: "bank setBalance for delegated coins and EVM StateDB SetAccBalance reconciliation"

attacker_capabilities:
  - "Deploy or call EVM and Wasm contracts that can trigger staking operations."
  - "Get an account loaded into StateDB before native staking mutates its bank balance."
exploit_preconditions:
  - "A bank operation such as DelegateCoins changes an EVM-denom balance without SyncStateDBWithAccount."
  - "A later EVM commit reconciles stale StateDB balance back into bank state."
blast_radius: "chain-wide"

impact_types:
  - "state-integrity"
  - "unauthorized-mint"
  - "supply-inflation"
severity_guess: "high"
severity_rationale: "Confirmed cross-runtime stale balances can be committed back as real native balance, enabling unbacked NIBI minting through staking flows."

code_shape_summary: "Only some bank keeper wrappers synchronized EVM StateDB; staking, multisend, delegate, and undelegate paths could mutate balances without refreshing mirrored EVM state."
search_motifs:
  - "SyncStateDBWithAccount missing wrapper"
  - "DelegateCoinsFromAccountToModule"
  - "Wasm staking capability called from EVM precompile"
  - "SetAccBalance stale BalanceWei"
negative_signals:
  - "No issue for denoms not mirrored into EVM StateDB."
  - "No issue if setBalance centrally synchronizes every balance-changing path."
  - "Need an EVM-visible stale balance to be committed after the native mutation."
patch_pattern: "Add missing bank keeper method overrides or a central balance-change hook that synchronizes StateDB for every EVM-denom balance mutation."

