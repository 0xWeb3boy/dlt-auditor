recommended_uses:
  - "retrieval_exemplar"
  - "eval_positive"
  - "taxonomy_refinement"

missing_property: "single authoritative EVM state view"
violated_invariant: "Nested EVM calls from precompiles must commit through the same authoritative StateDB view as the outer EthereumTx, including dirty storage and balance changes."
trust_boundary: "EVM contract->FunToken precompile->nested EVM CallContract"
entrypoint_type: "precompile nested contract call"
sensitive_sink: "StateDB commit of ERC20 balances and contract storage after FunToken conversion"

attacker_capabilities:
  - "Call FunToken sendToBank or related conversion logic from a malicious EVM contract."
  - "Dirty a StateDB object before or after the precompile call."
exploit_preconditions:
  - "Precompile execution creates or resets multiple StateDB instances."
  - "getStateObject reads stale evmTxCtx instead of the cache context with latest changes."
blast_radius: "chain-wide"

impact_types:
  - "state-integrity"
  - "unauthorized-mint"
  - "balance-double-spend"
severity_guess: "high"
severity_rationale: "A confirmed StateDB commit ordering flaw can restore spent ERC20 balance while minting bank coins, enabling double-spend style value creation."

code_shape_summary: "FunToken precompile nested calls updated a cache context while outer EthereumTx committed stale or dirtied StateDB objects back over those changes."
search_motifs:
  - "multiple new StateDBs in ApplyEvmMsg"
  - "reset StateDB back to original near precompile end"
  - "getStateObject uses evmTxCtx instead of cacheCtx"
  - "sendToBank then ERC20 transfer dirties storage"
negative_signals:
  - "No issue if nested calls share one StateDB and one commit context."
  - "No issue if dirty state is refreshed from the latest cache context before commit."
  - "No issue if precompile cannot invoke user-controlled ERC20 callbacks."
patch_pattern: "Ensure only one StateDB copy is active during an Ethereum transaction and that nested precompile calls preserve dirty state in the same commit path."

