recommended_uses:
  - "retrieval_exemplar"
  - "taxonomy_refinement"

missing_property: "per-message refund accounting"
violated_invariant: "Gas refunded for one EVM message should be based on that message budget and usage, not unrelated cumulative gas unless the fee was charged for the full batch unit."
trust_boundary: "EVM transaction submitter->fee deduction and refund logic"
entrypoint_type: "EthereumTx message execution"
sensitive_sink: "refundGas calculation and fee refund transfer"

attacker_capabilities:
  - "Submit or receive batched EVM messages where refund depends on cumulative gas."
exploit_preconditions:
  - "Fees are deducted per message gas limit."
  - "Refund logic subtracts cumulative gas used across messages from each message gas limit."
blast_radius: "user-local"

impact_types:
  - "incorrect-refund"
  - "funds-loss"
  - "fee-accounting-corruption"
severity_guess: "medium"
severity_rationale: "Users can receive lower refunds than intended for batched EVM messages, causing direct fee loss without broader chain compromise."

code_shape_summary: "Refund logic compared evmMsg.Gas to a cumulative blockGasUsed value, causing later messages to inherit earlier gas usage in their refund calculation."
search_motifs:
  - "refundGas uses blockGasUsed"
  - "evmMsg.Gas greater than cumulative gas"
  - "gas charged by txData.Fee"
  - "proper tx gas refund outside CallContract"
negative_signals:
  - "No issue if fee deduction is explicitly based on the same aggregate batch gas unit."
  - "No issue if only one EVM message can exist per transaction."
  - "No issue if cumulative gas is never used in per-message refund math."
patch_pattern: "Calculate refunds from each EVM message gas limit minus that message actual gas used, with cumulative gas used only for transaction-level metering."

