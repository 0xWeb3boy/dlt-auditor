  - "taxonomy_refinement"

missing_property: "rpc workload limits"
violated_invariant: "Read-only trace endpoints must bound predecessor count, gas, and wall-clock time for caller-supplied simulation workloads."
trust_boundary: "rpc-client->node tracing service"
entrypoint_type: "gRPC TraceTx query"
sensitive_sink: "loop that simulates req.Predecessors with effectively caller-chosen workload"

attacker_capabilities:
  - "Send TraceTx queries with a large predecessors array."
  - "Choose trace configuration that increases execution cost."
exploit_preconditions:
  - "The tracing endpoint is exposed to untrusted callers."
  - "No predecessor count limit, total gas limit, or timeout bounds the whole simulation."
blast_radius: "node-local"

impact_types:
  - "denial-of-service"
  - "resource-exhaustion"
  - "rpc-availability"
severity_guess: "medium"
severity_rationale: "The issue is a node/RPC DoS vector; it does not mutate chain state but can exhaust public endpoint resources."

code_shape_summary: "TraceTx iterated over caller-supplied predecessor transactions and simulated each before tracing the target message without an explicit global bound."
search_motifs:
  - "for i, tx := range req.Predecessors"
  - "TraceTx predecessor simulation"
  - "NewInfiniteGasMeterWithLimit(msg.Gas()) in query"
  - "trace endpoint no timeout"
negative_signals:
  - "No issue if the endpoint is authenticated or operator-local only."
  - "No issue if request size, predecessor count, total gas, and timeout are already bounded."
  - "No chain-wide issue unless validators expose the endpoint in a way that affects consensus."
patch_pattern: "Add predecessor count limits, total simulation gas caps, and timeout enforcement around the whole TraceTx predecessor simulation path."

