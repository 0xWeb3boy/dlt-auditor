notes:
  - "Original C4 finding code: H-01."
  - "Expected answer should identify: A user-controllable Cosmos account type must not be able to reserve or poison a deterministic EVM contract address before code deployment."
  - "Disable built-in auth/vesting transaction messages or otherwise reject vesting account creation for addresses that can be valid EVM contract accounts."
