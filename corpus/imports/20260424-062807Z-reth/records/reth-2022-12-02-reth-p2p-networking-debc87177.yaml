code_shape_summary: "Manual wire-format handling diverged from the canonical RLP and expected snappy representation. The code read message identifiers as raw bytes and relied on hand-managed assumptions for disconnect encoding/decoding, which broke on the `0x80` zero-value case. Separately, the handshake size check referenced the wrong buffer variable."
