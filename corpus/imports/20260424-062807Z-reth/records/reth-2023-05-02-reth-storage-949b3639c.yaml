missing_property: "parent-and-ancestor-validation"
violated_invariant: "Forkchoice handling should distinguish a head that is already known invalid, or descends from known invalid ancestry, from a head that merely cannot yet be canonicalized due to sync state. Responses on that path should preserve invalid ancestry information instead of treating every canonicalization failure as generic recovery."
trust_boundary: "forkchoice or sidechain state -> persistent storage provider"
entrypoint_type: "blockchain-tree/state-provider-path"
