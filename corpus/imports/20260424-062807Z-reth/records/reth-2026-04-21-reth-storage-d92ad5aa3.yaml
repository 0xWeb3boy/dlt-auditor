code_shape_summary: "Overlay resolution, revert selection, and cache lookup were not consistently tied to the same fork identity. The pre-patch code mixed optional anchor state with block-number-based decisions, which is weaker than explicit hash-based binding when different branches can share the same height."
search_motifs: 
  - "block-number or optional-anchor checks used where hash identity is required"
  - "improper-state-binding fixes that add fail-closed validation before persistence, propagation, or canonicalization"
