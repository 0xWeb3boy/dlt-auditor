code_shape_summary: "The account persistence path did not consistently encode and apply the fork-aware empty-account rule. As shown by the added `is_empty()` helper and the new guard in `AccountInfoChangeSet::Created`, empty accounts could be inserted even when post-Spurious-Dragon state clearing should suppress them. The storage-unwind change may help keep rollback exact,..."
