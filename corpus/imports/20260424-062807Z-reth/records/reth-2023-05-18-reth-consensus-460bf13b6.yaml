severity_guess: "low"
severity_rationale: "The issue is in a consensus/state-sensitive path, but the evidence supports hardening rather than a demonstrated invalid-state acceptance exploit."

code_shape_summary: "The evidence points to canonicality being determined too narrowly from in-memory blockchain-tree indices. When a block was canonical in persisted storage but not marked canonical in those indices, the system could classify it too weakly until the DB was consulted."
search_motifs: 
  - "fork-specific consensus rule selected from incomplete boundary inputs or generic validator"
