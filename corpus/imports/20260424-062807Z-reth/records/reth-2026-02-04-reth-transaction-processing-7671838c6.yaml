code_shape_summary: "The root cause was inconsistent handling of two different gas-accounting values after EIP-7778/Amsterdam. Receipt construction and block validation were not clearly carrying and using the protocol-correct value for each purpose, creating a risk that header validation would compare against the wrong gas source."
