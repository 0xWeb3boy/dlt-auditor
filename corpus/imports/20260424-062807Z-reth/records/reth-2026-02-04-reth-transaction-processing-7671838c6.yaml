violated_invariant: "After EIP-7778/Amsterdam, block validation must keep two gas-accounting meanings separate: block-header gas_used must be checked against execution-result gas_used, while receipt cumulative_gas_used must remain the receipt-format value. Validation and receipt construction must not treat those values as interchangeable."
