missing_property: "cache-state-isolation"
violated_invariant: "An execution cache entry must remain correctly bound to the parent or executed-block hash it represents. If a cache slot is reused for a different parent hash, both its contents and its stored hash must be updated together before reuse so later lookups do not treat fork-derived cache state as valid for the old chain context."
