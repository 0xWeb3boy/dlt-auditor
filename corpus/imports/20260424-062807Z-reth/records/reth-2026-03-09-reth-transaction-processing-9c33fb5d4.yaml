blast_radius: "node-local-to-chain-wide"

impact_types: 
  - "state-integrity"
severity_guess: "low"
severity_rationale: "The issue is in a consensus/state-sensitive path, but the evidence supports hardening rather than a demonstrated invalid-state acceptance exploit."

code_shape_summary: "When reusing an available cache slot for a different parent hash, the code cleared cached contents but did not update the stored cache hash before reuse. That allowed the slot's identity to remain stale even after fork-related reuse."
search_motifs: 
  - "cached execution or state object reused after parent hash, fork, or call context changes"
  - "cached execution or state object reused after parent hash, fork, or call context changes"
