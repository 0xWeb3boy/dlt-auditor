missing_property: "signature-field-validation"
violated_invariant: "Ethereum signature decoding should preserve the canonical `v` encoding used by the scheme: EIP-155 values use `35 + 2*chain_id + parity`, and legacy values use only `27` or `28`. The decoder should reject other legacy `v` values rather than coercing them into a parity bit."
trust_boundary: "externally supplied transaction bytes -> signer recovery"
entrypoint_type: "transaction-signature-decoder"
sensitive_sink: "authenticated transaction sender identity"

