code_shape_summary: "Consistency validation for forkchoice state was not enforced at all of the relevant return and side-effect points. In particular, the payload-attributes path could bypass the new checks, and a computed status could be returned without confirming the forkchoice state matched canonical engine state."
search_motifs: 
  - "fork-specific consensus rule selected from incomplete boundary inputs or generic validator"
