severity_rationale: "The evidence supports a correctness or hardening fix without a demonstrated attacker-controlled impact."

code_shape_summary: "A required protocol check was missing: the validator computed the canonical versioned hash from each supplied KZG commitment but did not enforce that it matched the transaction metadata carrying the claimed blob versioned hashes."
search_motifs: 
  - "derived blob, commitment, or fork fields are computed but not compared against declared protocol values"
  - "blob sidecar metadata validated for count/proof but not bound to declared versioned hashes or fork rules"
  - "missing-protocol-validation fixes that add fail-closed validation before persistence, propagation, or canonicalization"
negative_signals: 
