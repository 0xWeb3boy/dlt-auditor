missing_property: "cryptographic-data-binding"
violated_invariant: "For an EIP-4844 blob transaction, each blob versioned hash declared in the transaction must match the versioned hash derived from the corresponding KZG commitment in the supplied blob sidecar. Proof validity alone is not sufficient if that binding check is missing."
