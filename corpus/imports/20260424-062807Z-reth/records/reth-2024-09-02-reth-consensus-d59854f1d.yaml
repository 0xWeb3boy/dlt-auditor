violated_invariant: "In `TreeState::remove_until`, the effective finalized bound used for pruning should not exceed the caller's `upper_bound`. If `finalized_num` is higher, removal should behave as though the finalized bound were `upper_bound`, rather than trusting the caller-provided value."
