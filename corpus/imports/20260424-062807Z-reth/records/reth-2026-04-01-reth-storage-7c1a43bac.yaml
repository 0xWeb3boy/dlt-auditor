code_shape_summary: "The cache stored and replayed a composite output object that embedded per-invocation gas state. On cache hits, the code treated that full object as reusable instead of reconstructing caller-specific accounting fields."
search_motifs: 
  - "limit check accounts for item count but omits byte size, gas state, or remaining range"
  - "gas-accounting-state-reuse fixes that add fail-closed validation before persistence, propagation, or canonicalization"
negative_signals: 
