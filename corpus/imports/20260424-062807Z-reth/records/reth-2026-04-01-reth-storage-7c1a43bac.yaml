missing_property: "per-call-resource-accounting"
violated_invariant: "A precompile cache hit must preserve the current caller frame's gas accounting. Cached entries may reuse output bytes and regular gas usage, but must not replay a stale GasTracker carrying another call's reservoir or other live accounting state."
