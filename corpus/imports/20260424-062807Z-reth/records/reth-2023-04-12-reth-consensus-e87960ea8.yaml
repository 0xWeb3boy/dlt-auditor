missing_property: "fork-state-consistency"
violated_invariant: "Forkchoice restoration should only proceed when the node can reconcile the supplied forkchoice state with local execution state. If the finalized block is unknown, or the finalized block is known but the referenced head is still missing locally, the engine should transition to pipeline/syncing instead of continuing on a partially restored tree."
