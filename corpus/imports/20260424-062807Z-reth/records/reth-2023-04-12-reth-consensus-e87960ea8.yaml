code_shape_summary: "Pipeline-entry conditions were enforced inconsistently across two different paths. The restoration path validated only the finalized anchor, while missing-head handling was deferred to a narrower later payload-error path, allowing forkchoice processing to proceed without a single authoritative check that both finalized and head references were locally..."
