missing_property: "authentication-header-canonicalization"
violated_invariant: "If this RPC layer accepts Bearer authentication, it should only extract a token when the Authorization header value begins with the exact \"Bearer \" scheme prefix. Accepting that marker from the middle of a larger string weakens the format check at the authentication boundary."
trust_boundary: "http client -> authenticated rpc middleware"
