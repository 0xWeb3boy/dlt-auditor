severity_guess: "medium"
severity_rationale: "Malformed authentication parsing can affect access-control boundaries, but the finding does not prove a full authentication bypass."

code_shape_summary: "The parser used substring search instead of an anchored prefix check for the Bearer scheme. That made the helper overly permissive about Authorization header format and allowed malformed values to be normalized into a candidate token for later JWT validation."
search_motifs: 
  - "improper-auth-header-parsing fixes that add fail-closed validation before persistence, propagation, or canonicalization"
