patch_pattern: "Rehydrate protocol-specific transaction context before validation and downstream metadata derivation. Here, that means fetching the blob sidecar for reorged EIP-4844 transactions and constructing a sidecar-aware pooled transaction instead of using a generic recovered-transaction conversion."

