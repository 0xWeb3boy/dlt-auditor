recommended_uses:
- retrieval_exemplar
- taxonomy_refinement

missing_property: "withdrawal-destination-authority"
violated_invariant: |
  Privileged withdrawal helpers should derive their destination from trusted contract or staker state, not
  from a caller-controlled parameter passed into the sensitive sink.
trust_boundary: "validator/staker control flow -> privileged withdrawal sink"
entrypoint_type: "validator withdrawal or staker fund-recovery path"
sensitive_sink: "withdrawal of staker funds to a destination address"

attacker_capabilities:
- drive reorgs, sync state, configuration changes, lifecycle transitions, or state updates through normal
  protocol inputs
- trigger an alternate mode where cached or persisted state is reused
exploit_preconditions:
- state is keyed by an incomplete coordinate such as height, alias, local progress, or stale cache entry
- the authoritative chain/configuration/artifact identity is not rechecked at point of use
- the stale state can influence validation, sequencing, storage, or privileged work
- for hardening-only records, practical exploitability depends on deployment exposure and attacker control
  of the input source
blast_radius: |
  validator, node, or network state can diverge if stale lifecycle state reaches the consensus or sequencing
  sink

impact_types:
- funds-safety
- authorization-bypass-prevention
severity_guess: "low-medium"
severity_rationale: |
  Evidence supports security hardening rather than a fully demonstrated exploit; severity is low-medium
  because the path can influence funds-safety, authorization-bypass-prevention, but reachability and
  compensating checks bound the claim.

code_shape_summary: |
  The withdrawal path was hardened by removing configurable withdrawal destinations from the staker flow and
  relying on the privileged sink to use its trusted destination semantics.
search_motifs:
- withdrawal sink accepts destination from caller path
- privileged fund movement takes address parameter that can be removed
- safer fix narrows API rather than validating late
- state cache is keyed by height or alias without canonical hash binding
- lifecycle transition reuses stale progress after reorg or mode switch
- loaded artifact or config is not revalidated against authoritative identity at point of use
negative_signals:
- state is invalidated on every relevant reorg, fork, mode, or configuration change
- the sink re-reads authoritative state before use
- the patch only changes cleanup or logging with no acceptance or state-transition effect
- the patch only improves diagnostics, naming, generated bindings, or tests without changing runtime
  acceptance or rejection
- the input is not attacker-influenced in the deployed threat model
- a stronger invariant is enforced earlier on every path and the changed check is redundant defense in
  depth
patch_pattern: |
  Narrow the sensitive sink signature by removing caller-controlled destination input and route withdrawals
  through the fixed trusted-destination helper.

