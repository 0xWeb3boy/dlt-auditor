missing_property: "refund-source-attribution"
violated_invariant: "Gas refunds should reduce the claimable allocation of the contract that generated the refund, not proportionally reduce unrelated contracts touched in the same transaction."
trust_boundary: "user-controlled EVM execution -> developer gas-fee distribution"
entrypoint_type: "post-transaction GasTracker allocation"
sensitive_sink: "per-contract claimable gas accounting"

attacker_capabilities:
  - "execute a transaction that touches victim contracts and an attacker-controlled refunding contract"
  - "pre-seed refundable storage or otherwise generate EVM refunds"
exploit_preconditions:
  - "the transaction contains both victim gas use and attacker-generated refunds"
  - "refunds are represented as one global transaction counter"
blast_radius: "application and protocol fee accounting"

impact_types:
  - "fee-bypass"
  - "unauthorized-value-shift"
  - "resource-accounting"
severity_guess: "high"
severity_rationale: "Accepted high severity competition finding. The mechanism crosses user-controlled EVM execution -> developer gas-fee distribution and can affect fee-bypass, unauthorized-value-shift."

code_shape_summary: "GasTracker scales every allocation by (gasUsed - refund) / gasUsed using a transaction-global refund number, losing which contract caused the refund."
search_motifs:
  - "AllocateDevGas"
  - "remainingGas := gasUsed - refund"
  - "scaledGasUnits"
  - "global refund counter"
  - "SSTORE refund socialized"
negative_signals:
  - "The same property is enforced earlier on every reachable path before state, gas, or value is committed."
  - "The actor who can trigger the path already owns the affected role, funds, or address-lifecycle authority."
  - "The behavior is explicitly documented and all downstream accounting prices it as an intended policy choice."
  - "The path is test-only, deployment-local, or requires an operator-only misconfiguration with no protocol effect."
patch_pattern: "Avoid user-controlled gas refunds in the accounting model or track refund source precisely enough that refunds only reduce the generating contract allocation."

