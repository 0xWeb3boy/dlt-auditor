impact_types:
  - "consensus-integrity"
  - "state-integrity"
  - "proof-or-index-integrity"
severity_guess: "high"
severity_rationale: "A commitment mismatch can make nodes, indexes, or clients reason over non-canonical block contents. The finding is likely rather than fully proven, so high is appropriate but not critical."

code_shape_summary: "Execution code recorded transaction status and commitment material while the block id or canonical transaction bytes were still provisional, then later finalized the block through a separate path."
search_motifs:
  - "status persisted before block id is finalized"
  - "commitment built from pre-malleated transaction"
  - "witness data omitted from transaction root"
  - "placeholder block id in transaction status"
negative_signals:
  - "Pure refactors of transaction status storage are not enough without a commitment/status ordering issue."
  - "If canonical serialization is already the sole commitment input before persistence, the motif is not a bug."
patch_pattern: "Delay status persistence until final block identity is available and compute commitments from canonical serialized transaction data, including witness-bearing malleated fields."

