severity_rationale: "Wrongly penalizing reserved peers can degrade connectivity or sentry relationships. The evidence supports hardening, not a proven chain-wide exploit."

code_shape_summary: "P2P validation returned a single reject outcome that was consumed by gossip scoring without preserving whether the source was reserved or whether the invalidity was race-dependent."
search_motifs:
