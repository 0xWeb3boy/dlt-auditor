violated_invariant: "Cached validation results must be bound to the exact consensus-parameter version used to produce them and must be revalidated before inclusion under newer rules."
trust_boundary: "txpool-cache->executor-state-transition"
entrypoint_type: "state-transition"
sensitive_sink: "block transaction inclusion under active consensus parameters"

attacker_capabilities:
  - "Submit a transaction that validates under one parameter version but should fail or differ under a later version."
  - "Keep the transaction cached across a parameter upgrade."
exploit_preconditions:
  - "Txpool stores checked transactions without the parameter version."
  - "Executor trusts cached checked transactions during block production."
blast_radius: "chain-wide"

impact_types:
  - "consensus-integrity"
  - "state-integrity"
  - "validation-bypass"
severity_guess: "high"
severity_rationale: "Stale cached validation can admit transactions under obsolete rules. That is plausibly consensus-relevant even though exploitability was not fully proven."

code_shape_summary: "A checked transaction type carried validation status but not the consensus ruleset version, so executor code could not distinguish fresh checks from stale cache entries."
search_motifs:
  - "CheckedTransaction without consensus_parameters_version"
  - "MaybeCheckedTransaction trusted by executor"
  - "parameter upgrade with cached txpool entries"
  - "recheck transaction if version differs"
negative_signals:
  - "No issue if cached validation is invalidated on every parameter update."
  - "No issue if executor always revalidates against block header parameters before inclusion."
patch_pattern: "Attach consensus-parameter version metadata to checked transactions and force the executor to compare or revalidate when the block version differs."

