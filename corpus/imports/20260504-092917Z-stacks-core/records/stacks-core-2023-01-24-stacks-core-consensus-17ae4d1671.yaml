code_shape_summary: "The patch appears to fix a consensus-relevant fork-awareness bug in burnchain database lookups. Before the change, some paths selected burnchain operations or anchor block commit metadata using identifiers that did not include burnchain fork context. The patch adds burn block hash/header context to operation lookup and changes anchor metadata selection so canonical fork context can be considered before choosing the commit used in affirmation-map construction."
