code_shape_summary: "The patch changes Nakamoto stacker signatures from a generic `MessageSignature` placeholder to `SchnorrSignature`, converts them to `WSTSSignature` in `accept_block`, and rejects blocks whose stacker signature cannot be converted. This is plausibly security relevant because it affects consensus block acceptance and cryptographic signature representation, but the provided evidence does not establish that the old code accepted invalid blocks, bypassed signature verification, or caused a consensus vulnerability."
