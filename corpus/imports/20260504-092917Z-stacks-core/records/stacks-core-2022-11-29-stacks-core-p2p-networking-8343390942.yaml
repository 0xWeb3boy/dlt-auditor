code_shape_summary: "The patch fixes an unhandled PoX already-locked error in Clarity special contract-call handling. Before the change, `ChainstateError::PoxAlreadyLocked` from PoX v1 or PoX v2 lock application had no dedicated match arm and could fall through to the generic `panic!` branch. After the change, both handlers translate the condition into `Error::Runtime(RuntimeErrorType::PoxAlreadyLocked, None)`, and a regression test covers stacking in both PoX versions."
