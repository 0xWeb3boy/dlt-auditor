code_shape_summary: "The patch changes Nakamoto miner/signer coordination logic in testnet/stacks-node/src/nakamoto_node/miner.rs. It builds a signer slot-to-address map, filters signer-submitted transactions by origin address, begins nonce-related chainstate handling, and changes rejection accounting to use signer weights while skipping already-seen signer IDs."
