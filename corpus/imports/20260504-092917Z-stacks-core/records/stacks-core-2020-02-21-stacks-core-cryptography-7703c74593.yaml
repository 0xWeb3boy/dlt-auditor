code_shape_summary: "The patch adds cost-accounting propagation to trait signature parsing. Before the change, `parse_trait_type_repr` called `TypeSignature::parse_type_repr` for trait function argument and return types without passing a `CostTracker`. After the change, `parse_trait_type_repr` accepts a mutable tracker, the define-trait runtime path passes the VM `Environment`, and recursive type parsing can charge its existing `TYPE_PARSE_STEP` cost."
