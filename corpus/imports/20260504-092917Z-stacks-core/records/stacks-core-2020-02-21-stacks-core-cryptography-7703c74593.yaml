  - "execution cost or resource budget charged inconsistently across error cases"
negative_signals:
  - "The input may already be bounded by transport framing."
  - "A panic in test-only or unreachable internal code is not an externally reachable denial of service."
patch_pattern: "Move size, cost, and error checks to the boundary and convert panic or ambiguous errors into explicit validation failures."

