code_shape_summary: "The patch likely fixes a security-relevant stale-state issue in the signer database. It changes block storage, lookup, and removal from being keyed only by signer_signature_hash to being scoped by reward_cycle plus signer_signature_hash. The commit message explicitly says this prevents signers from acting on blocks from the previous cycle. The evidence supports a cross-cycle stale-state fix, but not a stronger claim about exploitability, fund loss, or consensus failure."
