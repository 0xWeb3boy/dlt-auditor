  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "The fix makes role handling explicit in the registration worker, adds roles to the descriptor before applying the corresponding hook, gates committee-address registration on role requirements, and filters validator consensus addresses so entries with invalid IDs are dropped before address verification."

