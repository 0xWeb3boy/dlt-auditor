  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "The change introduces 'runtimeTrustSynced' into the availability condition, resets that state on runtime start, initiates trust synchronization, and cancels outstanding sync work on stop or failure. Supporting mock code was updated to accept 'RuntimeConsensusSyncRequest'."

