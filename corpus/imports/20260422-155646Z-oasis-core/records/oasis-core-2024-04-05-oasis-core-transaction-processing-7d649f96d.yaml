  - "Not a match if downstream queue rejection cannot leave the transaction or request accepted in observable state."
  - "Not a match if global bounds already make the missing per-item limit unreachable in practice and the patch only improves errors."
patch_pattern: "The patch inserts the same sequence into each affected handler: load consensus gas parameters, debit gas with the matching 'GasOp' constant, fail on charging error, then return early for simulation. This makes the handlers consistently enforce their configured gas cost before further processing."

