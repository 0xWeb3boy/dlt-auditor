code_shape_summary: "Several key manager transaction handlers appear to have omitted explicit per-operation gas charging at the start of handler execution. The fix standardizes that charging pattern and aligns simulation behavior with live gas accounting."
search_motifs:
  - "resource or gas accounting missing on one mutation path"
