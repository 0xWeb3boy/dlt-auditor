  - "Not a match if the diff only renames roles or improves logging without changing who can reach the action."
  - "Not a match if the affected path is test-only or unreachable in production configuration."
patch_pattern: "The patch removed the 'disableCheckTx' special case from the ABCI mux 'CheckTx' path, removed the related debug transaction-expiry state, removed test-runner support for enabling the option, and updated the oversized transaction workload to stop tolerating behavior caused by skipped 'CheckTx'."

