code_shape_summary: "A debug-only configuration path existed inside the 'CheckTx' admission entrypoint, allowing normal admission validation to be bypassed when locally enabled. The supplied evidence shows that this bypass mechanism was removed, but it does not show that the option was reachable by attackers, used in production, or led to invalid transactions being finalized."
