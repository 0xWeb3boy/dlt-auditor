code_shape_summary: "Txpool admission logic was still tied to an older raw-byte interface and only the visible size-based check, so configured CheckedTransaction metadata such as per-weight limits was not enforced in that admission path."
search_motifs:
  - "resource or gas accounting missing on one mutation path"
