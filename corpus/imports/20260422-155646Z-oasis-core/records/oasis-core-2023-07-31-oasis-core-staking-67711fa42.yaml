code_shape_summary: "The evidence shows a liveness-accounting gap in the displayed code paths: proposer timeout handling did not record a missed proposal there, and there was no helper for resolving the selected scheduler directly into committee-member index space. However, the evidence does not prove that this caused an exploitable bypass, mis-slashing, or consensus failure before the patch."
search_motifs:
  - "stake, slashing, or liveness rule missing on an edge path"
  - "validator or committee accounting uses the wrong role coordinate"
  - "reserved or punishable state treated like ordinary state"
  - "round transition without clearing previously scheduled timeout state"
  - "validator or committee role inferred from incomplete metadata"
negative_signals:
  - "Not a match if consensus rules or earlier checks make the edge case unreachable for live validators, entities, or runtimes."
  - "Not a match if the patch only improves reporting or accounting visibility without changing stake, slashing, or selection state."
  - "Not a match if the affected identifier is not actually used to derive penalties, voting power, or eligibility."
patch_pattern: "The patch records missed proposals when a valid proposer-timeout transaction is processed, and it adds 'TransactionSchedulerIdx' so scheduler identity can be expressed as a committee-member index instead of only as a position within the filtered worker slice. This makes the new proposer-timeout accounting usable by later liveness evaluation code."

