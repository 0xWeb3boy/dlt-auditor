impact_types:
  - "integrity"
severity_guess: "medium"
severity_rationale: "The path is security-sensitive and could affect integrity, but the available evidence stops short of proving a worst-case exploit, so medium is the right default band."

code_shape_summary: "Eviction and commit logic in the remote merge path did not account for the pointer currently being dereferenced, so cache pressure could remove that active node during merge."
search_motifs:
  - "stale state reused across round, epoch, or restart boundaries"
  - "update path bypasses the same validation as fresh admission"
  - "lifecycle cleanup tied to the wrong transition marker"
negative_signals:
  - "Not a match if restart, timeout, overwrite, and update paths all clear or revalidate stale state before reuse."
  - "Not a match if old and new state coordinates are guaranteed equivalent for every reachable transition."
  - "Not a match if the change only refactors helper ownership without changing state-transition rules."
patch_pattern: "The patch adds a locked-pointer check to the LRU eviction loop, refactors commit into a fallible 'try_commit_node(..., locked_ptr)' path, and passes the dereferenced pointer through remote merge commit. On lock conflict, the merge stops retaining additional nodes. The commit message also states item ordering was adjusted to reduce eviction pressure on the active path and that dereference now errors instead of silently proceeding."

