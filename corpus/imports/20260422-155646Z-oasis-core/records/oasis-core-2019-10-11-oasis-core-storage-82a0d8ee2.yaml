missing_property: "state-coordinate-consistency"
violated_invariant: "During remote subtree merge and dereference, cache admission must not evict the node currently being dereferenced; if capacity prevents preserving that pointer, the operation should stop or fail rather than continue with inconsistent in-memory tree state."
