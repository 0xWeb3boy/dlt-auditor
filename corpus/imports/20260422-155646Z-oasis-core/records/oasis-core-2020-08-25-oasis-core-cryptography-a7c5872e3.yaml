code_shape_summary: "A round-transition helper ('emitEmptyBlock') did not perform the same timeout-state cleanup that the finalization path already treated as part of normal round lifecycle management. As a result, a previously armed timeout could remain in persistent state when commitments were reset via the empty-block path."
search_motifs:
  - "stale state reused across round, epoch, or restart boundaries"
  - "update path bypasses the same validation as fresh admission"
  - "lifecycle cleanup tied to the wrong transition marker"
  - "round transition without clearing previously scheduled timeout state"
negative_signals:
  - "Not a match if restart, timeout, overwrite, and update paths all clear or revalidate stale state before reuse."
  - "Not a match if old and new state coordinates are guaranteed equivalent for every reachable transition."
  - "Not a match if the change only refactors helper ownership without changing state-transition rules."
patch_pattern: "The fix adds explicit 'ClearRoundTimeout' handling to 'emitEmptyBlock' when an executor pool has a scheduled timeout, then threads returned errors through callers so transition code aborts if cleanup fails."

