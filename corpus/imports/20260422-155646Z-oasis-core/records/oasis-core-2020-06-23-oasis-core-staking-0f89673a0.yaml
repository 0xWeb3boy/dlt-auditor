code_shape_summary: "The update-verification check was attached to the wrong control-flow condition. The code keyed verification on the non-new, non-expired branch instead of on the existence of a prior stored node record."
search_motifs:
  - "valid request path missing a secondary role or policy gate"
  - "authorization derived from one scope but sink executes in another"
  - "shared helper returns success before role-specific enforcement"
  - "descriptor admission with incomplete role or identity checks"
negative_signals:
  - "Not a match if every route to the sink already passes through one canonical authorization helper with the same role and policy checks."
  - "Not a match if the diff only renames roles or improves logging without changing who can reach the action."
  - "Not a match if the affected path is test-only or unreachable in production configuration."
  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "'registerNode' now calls 'registry.VerifyNodeUpdate(...)' whenever a prior node record exists, including when that record is expired, before accepting the new descriptor and writing it to state. The tests were adjusted to keep prior registrations around for later update-oriented cases."

