code_shape_summary: "Inconsistent use of two related state coordinates ('round' versus 'handoff') across the CHURP subsystem. The evidence shows that some paths were bound to 'round' even though surrounding logic and comments indicate the operation is scoped to a handoff epoch."
search_motifs:
  - "stale state reused across round, epoch, or restart boundaries"
  - "update path bypasses the same validation as fresh admission"
  - "lifecycle cleanup tied to the wrong transition marker"
  - "round-versus-handoff coordinate mismatch across validation and storage"
negative_signals:
  - "Not a match if restart, timeout, overwrite, and update paths all clear or revalidate stale state before reuse."
  - "Not a match if old and new state coordinates are guaranteed equivalent for every reachable transition."
  - "Not a match if the change only refactors helper ownership without changing state-transition rules."
patch_pattern: "The patch updates both Go and Rust CHURP code so that requests are checked against the scheduled handoff epoch, persisted dealer material is loaded by handoff, and worker cleanup logic tracks handoff advancement instead of round advancement."

