code_shape_summary: "Registry cleanup and deregistration rules were too aggressive: node records could be removed on expiration before the staking debonding window ended, and entity removal did not enforce the continued existence of dependent node records."
search_motifs:
  - "stake, slashing, or liveness rule missing on an edge path"
