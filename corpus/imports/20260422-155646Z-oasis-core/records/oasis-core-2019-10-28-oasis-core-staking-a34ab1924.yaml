  - "Not a match if the affected identifier is not actually used to derive penalties, voting power, or eligibility."
  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "The registry now keeps expired nodes for the staking debonding interval, prevents entity deregistration when the entity still has registered nodes, hides expired retained nodes from query results, and reuses existing node status when such a node is registered again."

