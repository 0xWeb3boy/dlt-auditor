code_shape_summary: "The code suggests that deterministic/debug beacon behavior and the canonical Tendermint beacon path were not previously separated as explicitly as they are after the patch. The scheduler also had a more flexible beacon-backend injection point. That supports a hardening narrative, but the provided excerpts do not prove that the older design was exploitable in production."
