  - "Not a match if the compared fields are aliases with identical semantics throughout the subsystem."
  - "Not a match if the change only tightens developer assertions without affecting production acceptance behavior."
patch_pattern: "The patch introduces an explicit 'debugDeterministic' flag in the beacon application, warns when that mode is used, adjusts epoch-change logic to distinguish production entropy handling from deterministic behavior, removes the scheduler's injected beacon-backend dependency, and removes a direct ABCI beacon getter in the Tendermint backend."

