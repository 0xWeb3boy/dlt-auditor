missing_property: "signer-authorization"
violated_invariant: "A compute commitment's 'TxnSchedSig' must not only be cryptographically valid for the signed message; it must also be produced by a member of the active transaction scheduler committee for the relevant round/epoch."
trust_boundary: "committee-member->consensus"
entrypoint_type: "state-transition"
sensitive_sink: "security-sensitive consensus or registry state"

attacker_capabilities:
  - "send signed messages or commitments from the wrong committee member, runtime, or signer scope"
  - "reuse otherwise valid signatures in a context that is not re-bound at the sink"
exploit_preconditions:
  - "the affected feature is enabled and reachable in production"
  - "the verifier, key manager, or runtime uses the affected trust or signature path"
blast_radius: "validator-local"

impact_types:
  - "unauthorized-consensus-message-acceptance"
severity_guess: "high"
severity_rationale: "The bug can affect validator local integrity or authorization semantics, so similar cases should be treated as high-severity until proven otherwise."

code_shape_summary: "Compute-commitment admission validated the transaction-scheduler signature's cryptographic correctness but did not verify that the signer belonged to the active transaction scheduler committee."
search_motifs:
  - "valid request path missing a secondary role or policy gate"
  - "authorization derived from one scope but sink executes in another"
  - "shared helper returns success before role-specific enforcement"
negative_signals:
  - "Not a match if every route to the sink already passes through one canonical authorization helper with the same role and policy checks."
  - "Not a match if the diff only renames roles or improves logging without changing who can reach the action."
  - "Not a match if the affected path is test-only or unreachable in production configuration."
patch_pattern: "The fix replaced the old transaction-scheduler signature check with a call that verifies the signature against the active 'scheduler.KindTransactionScheduler' committee. It also introduced a generalized verifier interface so callers specify which committee kind a signature must belong to, and updated related storage call sites to use that interface."

