patch_pattern: "The patch removed the old per-node multi-role aggregation approach in 'liveness.go', changed liveness enforcement to a worker-only loop, and updated slashing/status writes to use the current member public key. In 'finalization.go', it deleted the backup-worker live-round credit branch. In 'liveness_test.go', it added coverage that backup-worker status must not change worker fault accounting."

