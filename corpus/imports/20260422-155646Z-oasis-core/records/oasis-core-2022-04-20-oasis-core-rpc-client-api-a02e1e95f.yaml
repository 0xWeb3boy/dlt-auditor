blast_radius: "validator-local"

impact_types:
  - "premature-registration"
  - "trust-state-exposure"
severity_guess: "high"
severity_rationale: "The bug can affect validator local integrity or authorization semantics, so similar cases should be treated as high-severity until proven otherwise."

code_shape_summary: "The pre-patch executor readiness logic did not gate registration/availability on completion of runtime trust sync, so a runtime could be treated as available before its trust-root synchronization finished."
search_motifs:
  - "trust root or quote policy cached without refresh on change"
  - "freshness inferred from success state instead of anchored evidence"
  - "session or attestation state reused after peer-set or policy change"
  - "descriptor admission with incomplete role or identity checks"
negative_signals:
  - "Not a match if trust roots, quote policy, and freshness evidence are atomically refreshed before each decision."
  - "Not a match if stale or changed session state is already invalidated on restart, reconfiguration, or peer change."
  - "Not a match if the new code only improves observability and does not change verification inputs or policy state."
  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "The executor now starts runtime trust sync during runtime startup, requires 'runtimeTrustSynced' before advertising availability, and cancels outstanding sync work when the runtime stops or fails. Mock runtime support was extended so the new consensus-sync request path can succeed in non-production coverage."

