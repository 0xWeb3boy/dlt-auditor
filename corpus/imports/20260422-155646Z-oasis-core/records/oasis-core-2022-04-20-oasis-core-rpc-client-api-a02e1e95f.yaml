missing_property: "trust-sync-gating"
violated_invariant: "When a runtime is configured with a trust root, executor availability/registration should wait until runtime trust sync has completed; generic runtime readiness and last-round availability alone are not sufficient."
trust_boundary: "remote-peer->rpc-verifier"
entrypoint_type: "rpc-handler"
sensitive_sink: "attestation acceptance state"

