code_shape_summary: "Authorization of storage receipt signers was incomplete at the compute/storage boundary: the shown code treated attached signatures as acceptable without the demonstrated enforcement that the signer belonged to the current epoch's authorized storage committee."
search_motifs:
  - "valid request path missing a secondary role or policy gate"
