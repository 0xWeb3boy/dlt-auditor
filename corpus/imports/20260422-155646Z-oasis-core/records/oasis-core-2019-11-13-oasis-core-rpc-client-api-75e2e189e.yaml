patch_pattern: "The patch makes 'PublicKey.UnmarshalBinary' fail unless the input length is exactly 'PublicKeySize'. It changes 'ToMapKey' to stop panicking on malformed keys, changes 'MarshalBinary' to serialize malformed keys as an all-zero key documented as blacklisted/invalid, and updates 'VerifyRegisterEntityArgs' to reject malformed node IDs before duplicate detection uses them."

