code_shape_summary: "Not established by the provided evidence. The observable change is that the runtime-host path previously lacked an end-to-end way to submit a freshness-related transaction and receive a consensus inclusion proof back through the API layers. The excerpts do not show whether stale TEE evidence was previously accepted, where verification happened, or whether this is a new feature versus a fix for an exploitable bug."
search_motifs:
  - "trust root or quote policy cached without refresh on change"
  - "freshness inferred from success state instead of anchored evidence"
  - "session or attestation state reused after peer-set or policy change"
  - "attestation acceptance based on stale or incomplete trust inputs"
negative_signals:
  - "Not a match if trust roots, quote policy, and freshness evidence are atomically refreshed before each decision."
  - "Not a match if stale or changed session state is already invalidated on restart, reconfiguration, or peer change."
  - "Not a match if the new code only improves observability and does not change verification inputs or policy state."
  - "Not a match if the same policy or freshness state is fetched and verified in-line at every use site instead of being cached."
patch_pattern: "The patch introduces a 'ProveFreshness' host handler that submits a dedicated registry transaction and receives a proof of inclusion. Supporting APIs were added so the proof can be produced by the backend and returned over gRPC instead of collapsing the operation to success-or-error only. The supplied excerpts do not show the consuming verifier logic."

