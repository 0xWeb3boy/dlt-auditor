blast_radius: "validator-local"

impact_types:
  - "policy-bypass"
severity_guess: "medium"
severity_rationale: "The path is security-sensitive and could affect policy-bypass, but the available evidence stops short of proving a worst-case exploit, so medium is the right default band."

code_shape_summary: "The shared verifier treated structurally valid keys with correct signatures as acceptable without a separate policy check for designated test-only keys. That meant acceptance depended only on cryptographic validity, not on whether a key was meant for non-production use."
search_motifs:
  - "trust root or quote policy cached without refresh on change"
  - "freshness inferred from success state instead of anchored evidence"
  - "session or attestation state reused after peer-set or policy change"
  - "descriptor admission with incomplete role or identity checks"
negative_signals:
  - "Not a match if trust roots, quote policy, and freshness evidence are atomically refreshed before each decision."
  - "Not a match if stale or changed session state is already invalidated on restart, reconfiguration, or peer change."
  - "Not a match if the new code only improves observability and does not change verification inputs or policy state."
  - "Not a match if descriptor normalization strips or rejects the problematic fields before signature verification or admission."
patch_pattern: "The fix introduced explicit registration of test public keys, a blacklist derived from that registration when test keys are disallowed, and an early blacklist check inside 'PublicKey.Verify'. A hardcoded keymanager test key is then registered so it is covered by the shared verification policy."

