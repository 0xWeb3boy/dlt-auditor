severity_rationale: "The path is security-sensitive and could affect stale-trust-policy, session-state-confusion, but the available evidence stops short of proving a worst-case exploit, so medium is the right default band."

code_shape_summary: "The visible issue is stale or shared session/request state management in the concurrent enclave RPC path. The evidence supports that session state was not explicitly cleared when remote enclave identity policy changed, and that peer feedback previously went through shared queue-based bookkeeping instead of direct request-bound submission."
search_motifs:
  - "stale state reused across round, epoch, or restart boundaries"
  - "update path bypasses the same validation as fresh admission"
  - "lifecycle cleanup tied to the wrong transition marker"
  - "cached secure session reused after identity or policy changes"
negative_signals:
  - "Not a match if restart, timeout, overwrite, and update paths all clear or revalidate stale state before reuse."
  - "Not a match if old and new state coordinates are guaranteed equivalent for every reachable transition."
  - "Not a match if the change only refactors helper ownership without changing state-transition rules."
patch_pattern: "The patch makes 'update_enclaves' drain sessions when the remote enclave identity set changes, switches peer-feedback submission to direct transport submission keyed by 'request_id', and tightens a responder-session creation invariant with an 'expect' after cleanup. The accompanying test was updated for concurrent feedback behavior without command-queue flushing."

