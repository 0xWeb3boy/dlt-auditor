id: "fuel-attackathon-2024-06-17-ccp-zero-fill-undercharged-32465"
source_record: "fuel-attackathon-2024-06-17-ccp-zero-fill-undercharged-32465.yaml"
project: "fuel-attackathon"

expected_bug_family: "resource_accounting_and_limits"
expected_bug_class: "undercharged-memory-zero-fill"
expected_missing_property: "resource-accounting"

expected_impact_band: "high"
expected_severity_band: "high"

should_be_detected: true
should_be_flagged_as_security: true

expected_trust_boundary: "transaction-bytecode->vm-memory"
expected_entrypoint_type: "vm-opcode"
expected_sensitive_sink: "large memory zero-fill performed at low gas cost"
expected_patch_pattern: "Charge CCP for the requested output bytes or align zero-fill accounting with memory-clear gas costs, with tests for out-of-range offsets."

false_positive_cautions:
  - "No issue if the charged cost scales with the destination length including zero fill."
  - "Small bounded copies with equal charge and write length are not this pattern."
notes:
  - "Meter the actual resource effect of an opcode, including implicit writes such as padding and zero fill."
  - "A user can perform large memory writes for much less gas than equivalent memory-clear operations."
