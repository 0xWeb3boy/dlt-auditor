missing_property: "state-transition-result-gating"
violated_invariant: "Only successfully executed transactions may contribute withdrawal or message identifiers to committed bridge execution data."
trust_boundary: "vm-receipt->block-execution-data"
entrypoint_type: "state-transition"
sensitive_sink: "message id commitment used for L1 withdrawal proofs"

attacker_capabilities:
  - "Submit an L2 transaction that emits a withdrawal message and then intentionally reverts."
  - "Relay or query the committed message proof after the failed transaction is included."
exploit_preconditions:
  - "Execution data aggregates MessageOut receipt ids before checking the final transaction status."
  - "The bridge proof path trusts committed message ids without rechecking transaction success."
blast_radius: "cross-domain"

impact_types:
  - "asset-integrity"
  - "unauthorized-withdrawal"
  - "state-integrity"
severity_guess: "critical"
severity_rationale: "A failed L2 withdrawal could still produce an L1-withdrawable message while the L2 burn was reverted, threatening bridged funds."

code_shape_summary: "Receipt-derived message ids were appended to block execution data on both success and failure paths, while asset burns were rolled back on revert."
search_motifs:
  - "message_ids extend before reverted check"
  - "MessageOut receipt from failed transaction"
  - "withdrawal proof accepts failed status"
  - "receipt committed independently of tx success"
negative_signals:
  - "Receipts from failed transactions are safe if they are only logs and cannot enter withdrawal commitments."
  - "No issue if every proof verifier rejects messages from failed transaction status."
patch_pattern: "Gate message-id aggregation and proof eligibility on non-reverted execution, and add tests that failed withdrawals cannot produce spendable messages."

