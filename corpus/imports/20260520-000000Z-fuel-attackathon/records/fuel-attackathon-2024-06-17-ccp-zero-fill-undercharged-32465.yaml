missing_property: "resource-accounting"
violated_invariant: "Gas charged for a memory-copy opcode must cover all bytes written or zero-filled by the opcode."
trust_boundary: "transaction-bytecode->vm-memory"
entrypoint_type: "vm-opcode"
sensitive_sink: "large memory zero-fill performed at low gas cost"

attacker_capabilities:
  - "Execute CCP with an offset beyond contract code and a large requested copy length."
  - "Use the zero-fill behavior as a cheap memory clear."
exploit_preconditions:
  - "CCP charges based on contract bytecode size rather than the requested output length."
  - "Out-of-range source data causes destination bytes to be zero-filled."
blast_radius: "chain-wide"

impact_types:
  - "fee-bypass"
  - "resource-exhaustion"
  - "denial-of-service"
severity_guess: "high"
severity_rationale: "A user can perform large memory writes for much less gas than equivalent memory-clear operations."

code_shape_summary: "The opcode loaded code, charged using source contract size, then zero-filled the caller-selected destination length when the source slice was empty."
search_motifs:
  - "code_copy offset greater than code length"
  - "zero fill after copy_from_slice"
  - "charge contract size not requested length"
  - "CCP cheaper than MCL"
negative_signals:
  - "No issue if the charged cost scales with the destination length including zero fill."
  - "Small bounded copies with equal charge and write length are not this pattern."
patch_pattern: "Charge CCP for the requested output bytes or align zero-fill accounting with memory-clear gas costs, with tests for out-of-range offsets."

