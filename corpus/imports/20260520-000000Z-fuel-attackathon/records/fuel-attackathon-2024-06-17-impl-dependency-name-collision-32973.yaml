  - "Impl block identity is derived from concatenated declaration names."
  - "Dependencies are stored in one map keyed by that non-unique identity."
blast_radius: "ecosystem-wide"

impact_types:
  - "incorrect-codegen"
  - "type-confusion"
  - "asset-integrity"
severity_guess: "medium"
severity_rationale: "Most collisions may fail compilation, but surviving type confusion can alter ABI encoding or contract behavior."

code_shape_summary: "A compiler dependency map used a synthesized human-readable name as a uniqueness key for multiple impl blocks."
search_motifs:
  - "decl_name impl block dependency"
  - "DependentSymbol overwritten"
  - "multiple self impl same type"
  - "concatenation of declaration names"
negative_signals:
  - "No issue if impl blocks receive unique node ids independent of declaration names."
  - "A collision that always hard-fails compilation has liveness impact but less security risk."
patch_pattern: "Use compiler-generated unique IDs for impl dependency keys and add tests for colliding declaration-name sequences."

