sensitive_sink: "stack memory holding local variables and call arguments"

attacker_capabilities:
  - "Deploy or invoke contracts with large variables around cross-contract calls."
  - "Influence call paths that allocate wide values such as u256."
exploit_preconditions:
  - "Compiler or runtime frame sizing lets values exceed the allocated stack region."
  - "No trap is raised before adjacent memory is overwritten."
blast_radius: "contract-local"

impact_types:
  - "memory-integrity"
  - "state-integrity"
  - "asset-integrity"
severity_guess: "critical"
severity_rationale: "Silent frame corruption can misroute values in financial contract flows, though exploitability depends on contract layout."

code_shape_summary: "Generated code for complex cross-contract calls could place large locals in stack regions without a reliable overflow guard."
search_motifs:
  - "u256 locals around contract call"
  - "stack overflow silent"
  - "call frame size calculation"
  - "adjacent variable overwritten"
negative_signals:
  - "A trapped stack overflow with no state commitment is not this issue."
  - "Purely local corruption in a test harness is lower risk without a reachable contract path."
patch_pattern: "Enforce stack-frame bounds during code generation or VM execution, trap on overflow, and add regression tests around wide locals across contract calls."

