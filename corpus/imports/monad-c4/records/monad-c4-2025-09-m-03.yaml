  - "taxonomy_refinement"

missing_property: "pre-allocation-response-budgeting"
violated_invariant: "RPC response size and batch budgets must be enforced before or during allocation/serialization, not only after every item and the aggregate wrapper have been materialized."
trust_boundary: "unauthenticated RPC client -> JSON-RPC handler"
entrypoint_type: "JSON-RPC batch and high-output method handler"
sensitive_sink: "RPC process memory and serialization buffers"

attacker_capabilities:
  - "send large JSON-RPC batches up to configured limits"
  - "choose methods or parameters that produce large result bodies such as logs or fee-history matrices"
exploit_preconditions:
  - "batch requests are executed and collected with join_all"
  - "per-item RawValue results and aggregate ResponseWrapper serialization coexist in memory"
  - "max_response_size is checked after peak allocation"
blast_radius: "node-local service denial of service"

impact_types:
  - "memory-exhaustion"
  - "rpc-denial-of-service"
  - "process-crash"
severity_guess: "medium"
severity_rationale: "Medium because default RPC settings can let one client force very large allocations and crash or stall the process, though impact is scoped to exposed RPC service."
code_shape_summary: "The RPC path built every batch item, retained serialized per-item RawValue buffers, then serialized the whole response wrapper and only afterward enforced the response size cap. That made the cap too late to prevent peak memory pressure."
search_motifs:
  - "futures::future::join_all over an RPC batch before aggregate budget checks"
  - "Vec<Response> holds many Box<RawValue> items"
  - "serde_json::to_raw_value or equivalent serializes the whole wrapper after per-item serialization"
  - "max_response_size check happens after result construction or final serialization"
  - "high-output methods lack per-endpoint concurrency or byte budgeting"
negative_signals:
  - "No issue if response encoding streams with a byte budget and aborts before large buffers are allocated"
  - "No issue if batch count, per-method result size, and aggregate result size are all capped before expensive work"
  - "Impact is lower behind authentication, strict reverse-proxy limits, or low default batch sizes"
patch_pattern: "Enforce per-item and aggregate budgets during response construction or streaming serialization, cap batch fanout and high-output endpoints, and avoid duplicating large RawValue buffers before checking size."
