missing_property: "full-bid-affordability-gating"
violated_invariant: "Txpool admission, forwarding, proposal selection, block policy, and execution must agree on the affordability predicate or remove transactions that fail the later stronger predicate."
trust_boundary: "external transaction -> txpool admission/forwarding -> proposal builder"
entrypoint_type: "txpool insert and forwarding path"
sensitive_sink: "tracked txpool capacity and block proposal construction"

attacker_capabilities:
  - "submit many EIP-1559 transactions with high priority fees"
  - "fund accounts enough for base_fee * gas_limit but not for the full effective bid"
exploit_preconditions:
  - "insert-time affordability uses only base fee"
  - "proposal-time validation uses full gas bid including priority fee"
  - "transactions that fail proposal validation remain in the tracked pool and can be selected again"
blast_radius: "chain-wide"

impact_types:
  - "txpool-denial-of-service"
  - "block-building-starvation"
  - "fee-bypass"
  - "resource-exhaustion"
severity_guess: "high"
severity_rationale: "High because low-cost transactions can occupy txpool/proposal capacity and repeatedly starve block construction across leaders."
code_shape_summary: "Txpool insertion used a cheaper base-fee-only balance check, while proposal/block policy used the full gas bid. Attackers could fill tracked pools with transactions that looked affordable at insert time but could never pass proposal validation."
search_motifs:
  - "txpool admission checks balance against base_fee * gas_limit only"
  - "proposal or block policy uses compute_txn_max_gas_cost including priority fee"
  - "forwarding checks max_fee >= base_fee but not sender affordability at full bid"
  - "proposal failure leaves transaction tracked, hot, or repeatedly selected"
negative_signals:
  - "No issue if txpool insertion and forwarding use the same full-bid max-cost helper as proposal validation"
  - "No issue if a later affordability failure evicts or demotes the transaction so it cannot starve proposals"
  - "Impact is lower when pool capacity, per-sender limits, or rate limits prevent broad stuffing"
patch_pattern: "Tighten txpool insertion and forwarding to use the full type-aware max-gas-cost helper, and evict or demote transactions that fail static affordability during proposal building."
