missing_property: "storage-offset-coordinate-consistency"
violated_invariant: "A trim/discard helper that preserves a partial page must write the preserved page back to the original page offset, not to an offset advanced for the later discard range."
trust_boundary: "storage maintenance operation -> block-device write path"
entrypoint_type: "block device trim/discard helper"
sensitive_sink: "persistent storage page contents"

attacker_capabilities:
  - "trigger or rely on normal storage trimming at a non-page-aligned boundary"
  - "cause data to exist in the page immediately after the trim boundary"
exploit_preconditions:
  - "trim boundary has a partial-page remainder"
  - "the helper advances the trim range before writing preserved bytes"
  - "the write-back uses the mutated range offset"
blast_radius: "node-local data integrity and persistence correctness"

impact_types:
  - "storage-corruption"
  - "state-integrity"
  - "node-local-denial-of-service"
severity_guess: "medium"
severity_rationale: "Medium because incorrect write position can corrupt block-device data, but exploitability depends on reaching trim conditions and storage layout."
code_shape_summary: "The trim helper read a partial page at the original boundary, advanced the range to skip that page for discard, then wrote the preserved buffer using the advanced range offset. The preserved data could overwrite the next page."
search_motifs:
  - "partial-page trim preservation reads from one offset and writes after mutating the offset variable"
  - "range[0] or cursor is advanced before pwrite of preserved bytes"
  - "discard/trim/punch-hole helper reuses a mutable range array for both preservation and discard"
  - "block-device trim tests do not cover unaligned truncation boundaries"
negative_signals:
  - "No issue if the preserved page is written before the discard range offset is advanced"
  - "No issue if the original offset is stored separately and used for pwrite"
  - "Impact is lower if only regular files use the code path and block devices are not supported in production"
patch_pattern: "Write the partial page back before advancing the discard range, or save the original page offset in a separate variable and use it for pwrite; add unaligned trim regression tests."
