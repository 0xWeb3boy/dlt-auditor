  - "taxonomy_refinement"

missing_property: "backpressure-error-handling"
violated_invariant: "Attacker-influenced bursts must not turn bounded queue backpressure into process panic; queue-full conditions should be handled as errors, drops, retries, or explicit flow control."
trust_boundary: "peer forwarded transaction messages -> updater command executor"
entrypoint_type: "TokioTaskUpdater executor command submission"
sensitive_sink: "validator process liveness"

attacker_capabilities:
  - "send or trigger bursts of ForwardedTx batches over multiple connections"
  - "exceed the bounded command channel capacity"
exploit_preconditions:
  - "network-reachable traffic is converted into command batches faster than the updater consumes them"
  - "exec uses try_send(...).expect(...) or equivalent panic on full channel"
blast_radius: "node-local to chain-wide if repeated across validators"

impact_types:
  - "node-crash"
  - "denial-of-service"
  - "chain-liveness"
severity_guess: "medium"
severity_rationale: "Medium because a remote unauthenticated burst can crash reachable nodes; chain-wide impact depends on reaching enough validators and deployment protections."
code_shape_summary: "A bounded queue was present, but the queue-full path panicked. The resource limit became a crash primitive because attacker-influenced bursts could force try_send to return an error that was unwrapped with expect."
search_motifs:
  - "try_send(commands).expect in an executor reachable from network messages"
  - "bounded mpsc channel capacity is treated as impossible to fill"
  - "ForwardedTx or p2p batches multiply by connections before backpressure is applied"
  - "queue-full, lagging, or closed-channel errors panic instead of dropping or slowing producers"
negative_signals:
  - "No issue if queue-full is handled by returning an error, dropping low-priority work, or applying backpressure without panic"
  - "No issue if the sender is only local/operator-controlled and cannot be influenced by peer traffic"
  - "Impact is lower if supervisor restarts are safe and peer/rate limits make capacity exhaustion impractical"
patch_pattern: "Replace panic-on-full queue submission with explicit backpressure handling, bounded dropping, or recoverable error propagation; add tests that fill the command channel from attacker-like bursts."
