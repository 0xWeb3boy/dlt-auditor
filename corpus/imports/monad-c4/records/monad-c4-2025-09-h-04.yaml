validated_as: "external-audit-finding"
recommended_uses:
  - "retrieval_exemplar"
  - "eval_positive"
  - "taxonomy_refinement"

missing_property: "order-sensitive-state-consistency"
violated_invariant: "A block prepass must not let a later transaction authorization reclassify an earlier transaction unless the proposal path used the same ordered semantics."
trust_boundary: "ordered transaction proposal -> block policy reserve accounting"
entrypoint_type: "proposal sequencing and block-policy fee/reserve validation"
sensitive_sink: "reserve-balance classification and block coherency acceptance"

attacker_capabilities:
  - "submit a high-tip transaction and a later EIP-7702 authorization for the same authority"
  - "tune balance so the first transaction passes emptying rules but fails non-emptying reserve rules"
exploit_preconditions:
  - "txpool marks delegated status only after the EIP-7702 transaction is included in proposal order"
  - "block policy globally marks all recovered authorities as delegated before per-transaction reserve checks"
  - "the first transaction can be ordered before the authorization in txpool but reclassified in block policy"
blast_radius: "chain-wide"

impact_types:
  - "consensus-liveness"
  - "invalid-block-proposal"
  - "reserve-accounting-mismatch"
  - "denial-of-service"
severity_guess: "high"
severity_rationale: "High because an attacker can construct free pre-execution invalid blocks that leaders repeatedly propose and validators reject."
code_shape_summary: "Txpool and block policy derived delegated status at different times. Txpool treated a sender as non-delegated until the authorization transaction appeared in order, while block policy collected all authorizations up front and applied delegated status to the entire block."
search_motifs:
  - "block-level prepass collects all EIP-7702 authorities before ordered transaction validation"
  - "txpool mutates is_delegated only after including the authorization transaction"
  - "reserve or emptying classification of an earlier transaction depends on a later transaction"
  - "tests lack two-transaction ordering witnesses for delegated status"
negative_signals:
  - "No issue if block policy records whether delegation existed before the first transaction and applies ordered semantics"
  - "No issue if txpool and block policy share the same whole-block prepass and reserve rules"
  - "Impact is lower if rejected proposals evict the pair or if the account balance cannot be tuned across the emptying/non-emptying boundary"
patch_pattern: "Carry order information into block-policy accounting, such as whether delegation existed before the first transaction, or validate EIP-7702 delegated status using the same ordered transition model as proposal assembly."
