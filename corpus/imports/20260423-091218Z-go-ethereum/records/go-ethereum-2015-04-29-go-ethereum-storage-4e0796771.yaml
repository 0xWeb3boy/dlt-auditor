code_shape_summary: "The patch fixes a chain reorg correctness bug in go-ethereum's core chain manager. Previously, reorg handling depended on comparing the incoming block number with the current canonical head number, which could miss a fork that was ahead and had higher total difficulty. The new logic detects a fork by comparing the canonical predecessor's hash with the incoming block's parent hash. This is plausibly security-relevant because it affects canonical-chain integrity, but the supplied evidence only establishes mixed canonical numbering, not an exploitable vulnerability."
