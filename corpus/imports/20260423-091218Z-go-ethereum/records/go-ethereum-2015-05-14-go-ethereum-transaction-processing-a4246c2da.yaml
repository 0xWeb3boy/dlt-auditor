code_shape_summary: "Likely security-hardening in go-ethereum's block downloader for a potential unknown-parent synchronization attack. The patch changes `TakeBlocks` to return an error as well as blocks, keeps the missing-head case as non-error, and updates block processing to abort when `TakeBlocks` reports an error. The evidence supports downloader sync hardening, but not a confirmed vulnerability with demonstrated exploitability or quantified resource impact."
