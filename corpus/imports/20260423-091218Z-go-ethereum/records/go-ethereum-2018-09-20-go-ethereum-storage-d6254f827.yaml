severity_rationale: "The path is consensus-adjacent and worth preserving for retrieval, but the evidence supports defensive hardening against unfavorable tie-breaks rather than a demonstrated consensus break or remote takeover."

code_shape_summary: "A fork-choice edge case used a random tie-break for equal-strength competitors, so locally trusted chain state could be replaced without consulting an explicit policy such as local-author preference."
search_motifs:
