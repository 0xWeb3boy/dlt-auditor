recommended_uses: ["retrieval_exemplar", "eval_positive", "taxonomy_refinement"]

missing_property: "chain-lineage validation"
violated_invariant: "A sampled sync response must prove continuity with the queued chain segment before the node treats the peer's chain data as trustworthy."
trust_boundary: "Untrusted remote sync peer responses crossing into local downloader trust and queue state."
entrypoint_type: "p2p block-sync response"
sensitive_sink: "Clearing a pending cross-check and continuing synchronization against a peer-advertised chain segment."

attacker_capabilities:
  - "Can act as a sync peer and return attacker-chosen block data for a requested cross-check."
  - "Can craft a block whose own hash matches the sampled value while its parent does not link to the queued chain."
exploit_preconditions:
  - "The victim node is syncing from the attacker-controlled peer."
  - "The downloader performs a sampled block cross-check and trusts hash equality alone."
blast_radius: "Downloader trust can be misdirected toward a disconnected fake branch, causing sync disruption or incorrect acceptance of peer-supplied chain continuity."

impact_types: ["sync-integrity", "availability"]
severity_guess: "medium"
severity_rationale: "The attacker sits on an external peer boundary and can influence a security-sensitive validation path, but the evidence is bounded to synchronization integrity rather than direct consensus-rule bypass or asset loss."

code_shape_summary: "A peer-facing sync verifier accepted a sampled block because its hash matched the expected value, but it failed to confirm that the block's parent linked back to the locally queued chain segment."
search_motifs:
  - "pending cross-check deleted immediately after hash match"
  - "response validation checks object identity but not parent or predecessor linkage"
  - "sync queue or sampled verification path that never confirms adjacency to local chain context"
negative_signals:
  - "Benign deduplication or cache-hit logic that does not advance trust in remote chain state."
  - "Validation paths where parent linkage is already proven earlier and the later hash check is only a redundant fast path."
patch_pattern: "Bind sampled sync responses to local chain context by requiring predecessor linkage before clearing the verification token or advancing peer trust."

