code_shape_summary: "The patch corrects go-ethereum's London/EIP-1559 upfront balance check. In StateTransition.buyGas, the EIP-1559 balance requirement previously included gas_limit * gasFeeCap but omitted the transaction value. The fix adds st.value before comparing the sender balance to the required amount. This is best classified as a likely security-relevant consensus/state-transition validation fix, not as replay, signature, or cryptographic handling."
