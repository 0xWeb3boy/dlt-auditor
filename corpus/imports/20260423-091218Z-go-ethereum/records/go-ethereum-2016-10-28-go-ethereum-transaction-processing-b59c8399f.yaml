recommended_uses: ["retrieval_exemplar", "taxonomy_refinement"]

missing_property: "message-domain separation"
violated_invariant: "An externally reachable signing API must bind signatures to an explicit message domain so caller-controlled input cannot be mistaken for a different signing context."
trust_boundary: "RPC or wallet-facing signing requests crossing into local private-key operations."
entrypoint_type: "account-signing RPC request"
sensitive_sink: "Producing an ECDSA signature with a node-controlled account key."

attacker_capabilities:
  - "Can submit attacker-chosen message material to a signing API."
  - "Can try to obtain signatures that are reusable outside the intended user-message domain."
exploit_preconditions:
  - "A raw signing path is exposed or confused with user-message signing semantics."
  - "The caller can influence signing input across the RPC or wallet boundary."
blast_radius: "Mis-scoped signatures can enable signature misuse or unsafe signing semantics at the wallet boundary, but the evidence does not prove downstream asset theft or replay on its own."

impact_types: ["signature-misuse", "signing-scope-confusion"]
severity_guess: "medium"
severity_rationale: "The patch hardens a private-key boundary exposed to caller-controlled input, yet the supplied evidence still frames this as a likely hardening case rather than a proven exploitable break."

code_shape_summary: "A signing API exposed raw or weakly scoped signature semantics to caller-controlled input until the implementation separated user-message signing from low-level hash signing with an explicit domain prefix."
search_motifs:
  - "eth_sign, personal_sign, or wallet sign path adds a message prefix before hashing"
  - "low-level Sign function comments warn about adversary-chosen input"
  - "API split between raw signing helper and Ethereum-format or domain-specific signing helper"
negative_signals:
  - "Pure documentation updates without an actual change to externally reachable signing behavior."
  - "Internal-only signing helpers that never cross an untrusted API boundary."
patch_pattern: "Introduce explicit message-domain hashing at the signing boundary while retaining raw signing only as a lower-level primitive with prominent warnings."

