code_shape_summary: "The refactor changed `ProofClaim` from a small fixed-shape record into a container holding nested proposal objects and a variable-length vector coming from an untrusted boundary. The supported issue is missing structural validation of that new untrusted shape, especially unbounded collection size and malformed signature blobs."
search_motifs:
