violated_invariant: "If the EIP-8130 handler is the authority that advances a `(sender, nonce_key)` nonce slot, it should only increment that slot when the stored sequence equals the transaction's claimed `nonce_sequence`; otherwise it should reject rather than overwrite state from transaction input alone."
