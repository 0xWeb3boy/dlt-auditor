code_shape_summary: "Missing read-compare-write validation in the EIP-8130 nonce update path: the handler trusted transaction-supplied `nonce_sequence` enough to derive and write the next stored value without first checking the authoritative stored sequence for that slot. The gas change is a separate accounting correction, not the root cause of the nonce issue."
search_motifs:
  - "externally supplied structured data is accepted after only partial validation"
  - "one representation is checked while a different reconstructed or cached representation reaches the sink"
  - "exact consumption, identity binding, or state-coordinate consistency is not rechecked before execution"
negative_signals:
  - "Supported claim: this commit adds missing stateful nonce validation immediately before updating a nonce slot."
  - "Supported claim: the change removes a risky blind state update in replay-sensitive logic."
  - "Not supported: a confirmed exploitable replay or double-spend vulnerability existed in production."
patch_pattern: "Replace a blind state update driven by transaction input with a stateful read-compare-write check against the authoritative storage slot immediately before mutation. Keep gas estimation conservative before execution, then reconcile warm/cold costs once execution context is available."

