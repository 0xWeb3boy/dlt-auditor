severity_rationale: "The path reaches a security-sensitive validation, policy, or state-selection decision and the finding supports meaningful integrity risk, but most cases still stop short of proving worst-case exploitation, so medium is the right default band."

code_shape_summary: "The start path accepted activation without enforcing that the execution engine had a valid current unsafe head, and the supplied `unsafe_head` was not shown to influence the transition before activation. Separate state-publication timing also meant callers could continue observing a zero unsafe head until later engine activity, making invalid start requests more likely."
search_motifs:
  - "latest observed head is forwarded directly despite a configured confirmation-delay policy"
  - "startup or wake-up logic trusts requested state before confirming the engine or source state is initialized"
  - "policy values are logged or stored but not enforced consistently on downstream reads"
negative_signals:
  - "Supported claim: the patch hardens a consensus-sensitive activation path by enforcing engine-state validation before starting the sequencer."
  - "Supported claim: the patch removes a risky condition where sequencing could begin while the engine unsafe head is still uninitialized."
  - "Do not claim a confirmed exploitable vulnerability or real-world consensus failure from the supplied evidence alone."
patch_pattern: "Validate engine state at the activation boundary, fail closed on uninitialized or inconsistent state, and publish the authoritative state early enough that callers can satisfy the new preconditions."

