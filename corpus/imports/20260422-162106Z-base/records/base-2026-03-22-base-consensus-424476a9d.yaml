violated_invariant: "A sequencer should only be activated when the execution engine already exposes a real initialized unsafe head, and the requested starting head should match that engine state. Starting from an uninitialized or inconsistent tip weakens consensus-safety assumptions by allowing sequencing to begin from state the engine has not established as current."
