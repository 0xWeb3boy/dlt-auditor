code_shape_summary: "The evidence suggests the old design used read-modify-write updates against one shared bundle-history object in S3, which the new comments describe as creating read-modify-write contention. The patch addresses that by making each event an immutable record with write-once semantics, but the excerpts do not prove a specific pre-patch failure beyond that contention risk."
search_motifs:
  - "mutable object rewrite used as the source of audit history"
  - "append-only events reconstructed from the latest snapshot instead of immutable entries"
  - "storage writes lack write-once or conditional-create semantics for audit data"
negative_signals:
  - "This supports an audit-integrity hardening interpretation, not a confirmed exploitable security vulnerability."
  - "The patch evidence is about storage semantics and concurrency behavior, not cryptographic breakage or access control."
  - "Retention in the corpus is justified only as a security-hardening case tied to audit log integrity."
patch_pattern: "Replace mutable aggregate-object updates with immutable per-event records, enforce write-once storage for each event key, treat duplicate deliveries as no-ops, and rebuild aggregate history by enumerating stored events."

