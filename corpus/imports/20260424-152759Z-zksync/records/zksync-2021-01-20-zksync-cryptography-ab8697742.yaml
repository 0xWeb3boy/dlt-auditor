severity_rationale: "Rejecting mismatched auth data is security-relevant, but validation did not prove a bypass or remotely triggerable DoS."

code_shape_summary: "The transaction sender signature path rejects Ethereum signature data for CREATE2 accounts in single and batch checks, and a disabled Close transaction path returns an error instead of panicking. The reusable shape is accepting auth material that is inconsistent with the account authority model."
search_motifs:
  - "CREATE2 account branch rejects provided eth_signature"
  - "single and batch signature check paths both add auth-mode guard"
  - "account_id extraction changed from panic to recoverable error for disabled tx type"
negative_signals:
  - "If CREATE2 address derivation was already the only accepted authority, rejecting extra signatures may be cleanup."
  - "A panic in unreachable disabled transaction code is not automatically exploitable."
