code_shape_summary: "The patch carries the ChangePubKey nonce through witness data, operation arguments, and pubdata, then constrains it equal to the current account nonce. The reusable shape is a replay/order field present in transaction semantics but absent or unconstrained in proof/public-data plumbing."
