code_shape_summary: "The patch adds a feature-gated authority-equivalence check in the upgradeable BPF loader. Previously the loader verified that the supplied account was a Buffer but ignored its authority_address in the shown deploy/upgrade verification path. After the patch, mismatched buffer and upgrade authorities fail with IncorrectAuthority, and buffer authority removal is rejected under the same feature gate."
