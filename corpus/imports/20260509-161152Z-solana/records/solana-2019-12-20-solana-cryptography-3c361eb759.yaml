code_shape_summary: "The patch strengthens Solana snapshot/account verification by adding a per-account hash check in `runtime/src/accounts_db.rs::verify_bank_hash`. Before aggregation, the verifier now recomputes each non-sysvar account hash and returns `MismatchedAccountHash` if it differs from the stored `account.hash`. The `sdk/src/hash.rs` changes from literal `32` to `HASH_BYTES` are supporting cleanup and are not independent vulnerability evidence."
