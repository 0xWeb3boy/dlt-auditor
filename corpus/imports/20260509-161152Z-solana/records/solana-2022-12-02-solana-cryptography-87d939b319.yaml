code_shape_summary: "The patch fixes inconsistent ElGamal public-key derivation in the zk-token SDK. Before the change, `ElGamalPubkey::new` derived the public key as `secret * H`, while `keygen_with_scalar` used `secret.invert() * H`. After the change, `ElGamalPubkey::new` asserts the scalar is nonzero and uses `s.invert() * H`, and `keygen_with_scalar` delegates to that helper. The accompanying `pubkey_proof.rs` changes add test coverage for derived keypairs; they do not..."
