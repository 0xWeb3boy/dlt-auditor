code_shape_summary: "The patch likely fixes a consensus-relevant race in Solana's bank runtime. `Bank::register_tick` previously made the boundary tick height visible before completing blockhash queue and recent blockhashes sysvar updates, while ReplayStage could use that boundary tick height as the signal to begin accounts delta hash calculation. The patch reorders the tick-height increment after those updates and strengthens the guard to reject tick registration once free..."
