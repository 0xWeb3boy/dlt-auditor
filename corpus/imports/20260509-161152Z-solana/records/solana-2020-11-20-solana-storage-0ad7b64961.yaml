code_shape_summary: "The patch adds explicit sanitization for Bloom filters used in Solana gossip pull handling. Previously, `Bloom<T>` had a default no-op `Sanitize` implementation, allowing an empty `bits` vector to pass validation. The commit message states that over-the-wire pull requests could trigger a validator panic through division by zero in Bloom filter logic. The fix rejects empty Bloom filters with `SanitizeError::InvalidValue`."
