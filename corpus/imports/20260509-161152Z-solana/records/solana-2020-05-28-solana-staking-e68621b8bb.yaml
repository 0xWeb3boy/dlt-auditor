code_shape_summary: "Likely denial-of-service fix in Solana's orphan repair handling. The functional change in `core/src/serve_repair.rs` makes `ServeRepair::run_orphan` break when `repair_response::repair_response_packet(...)` returns `None`. The added regression test covers corrupted oversized shred data in the orphan repair path. The evidence supports a repair-service DoS fix, but does not establish consensus impact, cryptographic failure, or the exact exhausted resource."
