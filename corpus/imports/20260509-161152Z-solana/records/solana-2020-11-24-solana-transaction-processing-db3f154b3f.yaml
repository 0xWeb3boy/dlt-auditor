code_shape_summary: "The supported finding is a likely Solana runtime state-integrity fix in durable nonce transaction handling. The strongest evidence is the change in `Accounts::collect_accounts_to_store` from storing any writable account to storing writable accounts only on successful execution, or on failed durable-nonce execution when the account is the nonce account or fee payer. Related fee-calculator changes appear to support consistent durable-nonce metadata handli..."
