code_shape_summary: "The patch hardens Solana's upgradeable BPF loader by requiring the executable program account to be writable during Upgrade processing and by changing the SDK Upgrade instruction builder to mark that account writable. This supports the stated goal of preventing program invocation and upgrade in the same transaction batch. The evidence supports account-locking and loader hardening, not unauthorized upgrade, signature bypass, replay, or cryptographic fail..."
