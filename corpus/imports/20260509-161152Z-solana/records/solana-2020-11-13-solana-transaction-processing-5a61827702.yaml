code_shape_summary: "The patch fixes overflow-prone arithmetic in Solana ledger entry tick hash verification. `verify_tick_hash_count` previously added each `entry.num_hashes` into a `u64` accumulator with `+=` before checking tick boundaries. The fix uses `saturating_add`, so excessive cumulative hash counts remain excessive instead of wrapping to a smaller value."
