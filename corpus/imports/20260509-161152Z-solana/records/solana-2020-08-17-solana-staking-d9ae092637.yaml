code_shape_summary: "The patch likely fixes a protocol accounting issue in Solana's runtime rent handling. Previously, an existing account that was rent-exempt during collection could have `rent_epoch` advanced to the next epoch even though no rent was collected. The new behavior keeps exempt accounts at the current epoch, allowing exemption to be checked again later in that epoch."
