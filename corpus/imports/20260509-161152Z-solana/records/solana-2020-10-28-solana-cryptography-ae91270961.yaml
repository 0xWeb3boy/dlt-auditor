code_shape_summary: "Confirmed security fix for spoofed-source UDP amplification in Solana gossip pull handling. The commit body explicitly describes PullRequest source spoofing causing much larger PullResponse traffic to a victim, and the patch adds Ping/Pong handling plus a pull-request gate that filters requests before response generation unless the source address has passed the endpoint check."
