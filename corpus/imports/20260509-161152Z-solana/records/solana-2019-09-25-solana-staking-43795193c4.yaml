code_shape_summary: "The patch is likely an access-control fix in Solana's vote API. The strongest supported change is that withdrawals now verify `vote_state.authorized_withdrawer` using a shared authorized-signer path, instead of only requiring the vote account itself to sign. Vote processing was also moved from inline authorized-voter signer matching to a shared helper, and the authorization API was generalized to handle voter or withdrawer roles."
