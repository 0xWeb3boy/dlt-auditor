code_shape_summary: "The patch addresses a UDP gossip amplification issue in Solana pull-request handling. The commit explicitly cites a HackerOne report describing spoofed PullRequest source addresses causing larger PullResponse packets to be sent to victims, and the code evidence shows a new ping-pong endpoint check before pull responses are generated."
