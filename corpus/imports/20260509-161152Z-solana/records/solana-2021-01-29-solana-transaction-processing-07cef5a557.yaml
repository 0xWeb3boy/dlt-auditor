code_shape_summary: "The patch adds an on-chain authorization consistency check in Solana's upgradeable BPF loader. The loader now rejects deploy or upgrade processing when the buffer account's recorded authority does not match the supplied upgrade/deploy authority, and it prevents clearing buffer authority to None under the same feature gate."
