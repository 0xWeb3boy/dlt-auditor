code_shape_summary: "The patch changes Solana stake redelegation so a stake cannot be redelegated again when its recorded `voter_pubkey_epoch` equals the current `clock.epoch`. This replaces a looser `epoch: Epoch` parameter with the runtime clock and adds a `TooSoonToRedelegate` failure for same-epoch redelegation. The evidence supports a behavioral fix to redelegation rules, but not a confirmed or likely vulnerability."
