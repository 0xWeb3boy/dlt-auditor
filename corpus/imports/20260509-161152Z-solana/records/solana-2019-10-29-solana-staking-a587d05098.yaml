negative_signals: ["A prior canonical validator rejects the input before it reaches the sensitive sink.", "The affected path is test-only, admin-only, or unreachable in production builds.", "The apparent missing check is enforced by a shared callee on every equivalent path."]
patch_pattern: "Add an explicit state-transition guard using authoritative runtime epoch data before mutating stake delegate history."

