code_shape_summary: "The patch is a security fix for privilege escalation in Solana's BPF cross-program invocation path. The grounded evidence shows a new `verify_instruction` check in `programs/bpf_loader/src/syscalls.rs`, a call to that verification before callee message construction, and VM setup changed to pass caller parameter accounts so the syscall layer has the account privilege context needed for the check."
