code_shape_summary: "The patch adds a maximum base58 string length check to Solana SDK Hash parsing. Hash::from_str now rejects strings longer than 44 characters with ParseHashError::WrongSize before calling bs58::decode. This is grounded as input-size validation and parser hardening, but the evidence does not prove a vulnerability or show that oversized input causes a security impact."
