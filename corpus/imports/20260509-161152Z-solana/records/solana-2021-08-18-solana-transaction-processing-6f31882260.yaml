code_shape_summary: "The patch fixes the overlap guard used by Solana's BPF loader `memcpy` syscall. The old inline predicate only checked one apparent address ordering; the patched code uses a feature-gated call to `check_overlapping(src_addr, dst_addr, n)` and adds/registers the `mem_overlap_fix` feature. The evidence supports a BPF syscall guard correctness fix, but not stronger claims such as theft, privilege escalation, host memory access, or validator crash."
