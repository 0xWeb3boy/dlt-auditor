code_shape_summary: "The supported finding is limited to an authorization check gap in zero-lamport System Program transfers. Before the patch, `transfer` returned `Ok(())` for `lamports == 0` before checking whether the source account signed. After the patch, that legacy early return is gated behind `!system_transfer_zero_check`, so when the feature is active the existing missing-signature check runs and unsigned zero-lamport transfers fail."
