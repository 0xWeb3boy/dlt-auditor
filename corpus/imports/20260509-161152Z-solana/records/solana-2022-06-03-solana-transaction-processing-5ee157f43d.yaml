code_shape_summary: "The commit fixes a replay-domain collision between Solana durable nonce values and normal blockhashes. The commit message explicitly states that AdvanceNonceAccount could update a nonce to a raw blockhash, allowing a durable transaction to be executed both as a normal transaction and as a nonce transaction when that blockhash was used as recent_blockhash. The patch separates the domains and updates observed runtime and CLI nonce consumers to use the non..."
