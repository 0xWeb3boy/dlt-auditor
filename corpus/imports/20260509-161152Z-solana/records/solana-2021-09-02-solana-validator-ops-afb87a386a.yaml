code_shape_summary: "The patch hardens Solana CLI vote account creation by making `authorized_withdrawer` a required concrete pubkey instead of an optional value that defaulted to the validator identity. It also adds an unsafe-configuration override flag and, in the shown evidence, rejects the authorized withdrawer being identical to the vote account pubkey unless that override is used."
