code_shape_summary: "The patch changes Solana gossip initialization so the local self ContactInfo is inserted through a dedicated insert_self path instead of the generic insert_info path. The new path checks that node_info.id matches the local node id, signs the ContactInfo with the local keypair, and only then inserts it into CRDS. This supports a likely security fix for preventing incorrectly signed self gossip records, though the provided evidence does not establish remo..."
