code_shape_summary: "The patch fixes a race in Bank::register_tick where tick_height could be published before boundary-related account updates completed, while ReplayStage uses that boundary tick as a signal to start accounts delta hash calculation. The evidence supports a consensus/account-hash ordering bug, but does not establish remote exploitability, fund theft, signature bypass, or hash forgery."
