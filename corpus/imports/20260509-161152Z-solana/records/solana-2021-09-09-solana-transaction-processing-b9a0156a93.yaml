code_shape_summary: "The patch tightens Solana runtime account loading so writable executable accounts and upgradeable-loader-owned ProgramData/state accounts are rejected when the upgradeable loader is not present. The evidence supports a transaction validation and account access-control fix, but does not establish arbitrary code execution, unauthorized upgrade, or consensus divergence."
