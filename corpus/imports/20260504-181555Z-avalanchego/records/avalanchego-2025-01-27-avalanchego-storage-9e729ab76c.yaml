code_shape_summary: "A maxQueryLimit check was added for caller-supplied reward percentiles before fee-history processing. The reusable shape is an RPC endpoint that bounds array cardinality independently of per-element validation."
search_motifs:
  - "len(userArray) > maxQueryLimit near RPC entry"
  - "rewardPercentiles or similar arrays processed in fee history/oracle code"
  - "errInvalidPercentile or query limit errors added before loops"
negative_signals:
  - "Public endpoints behind strict gateway limits may reduce severity"
  - "Small fixed-size arrays or server-generated arrays are not matches"
  - "Do not conflate copy-initialization refactors with RPC resource controls"
patch_pattern: "Reject oversized caller-controlled arrays at RPC entry using an existing query limit before per-element validation or computation."

