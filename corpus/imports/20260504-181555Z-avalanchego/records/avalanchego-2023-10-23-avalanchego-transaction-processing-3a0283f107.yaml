missing_property: "mempool-admission-resource-validation"
violated_invariant: "Remote or non-forced mempool insertion must enforce the same validity and resource limits expected before transaction gossip or block proposal."
trust_boundary: "Peer/RPC supplied atomic transactions cross into the local mempool and gossip cache."
entrypoint_type: "mempool transaction insertion"
sensitive_sink: "txpool/mempool acceptance and gossip of an oversized or invalid transaction"

attacker_capabilities:
  - "Can submit or gossip atomic transactions"
  - "Can choose transaction size, gas usage, and malformed resource parameters"
exploit_preconditions:
  - "A shared mempool insertion helper is reachable for non-forced remote submissions"
  - "Resource checks are outside or after that helper"
  - "Rejected transactions can otherwise be retried or propagated"
blast_radius: "Limited to the affected validation/accounting path unless the unchecked object can enter consensus, block acceptance, shared storage, or public RPC resource consumption."

impact_types:
  - "resource-exhaustion"
  - "mempool-integrity"
severity_guess: "medium"
severity_rationale: "Mempool resource validation gaps can enable local resource pressure, but the record does not prove a quantified denial of service."

code_shape_summary: "Transaction verification and size/gas checks were moved into the shared non-forced mempool admission path. The reusable shape is a mempool helper where forced internal insertion is allowed but all peer-facing insertions must validate resources first."
search_motifs:
  - "addTx gains a force or local bypass parameter"
  - "verifyTxAtTip adds signed-size and gas checks"
  - "rejected remote transaction cache added to avoid repeated processing"
negative_signals:
  - "Forced insertion paths may intentionally bypass checks for trusted local recovery"
  - "Do not flag duplicate validation if an earlier mandatory layer rejects all invalid remote txs"
  - "Caching rejected txs is support evidence, not the root cause"
patch_pattern: "Centralize non-forced mempool admission checks and keep explicit trusted bypasses separate and visible."

