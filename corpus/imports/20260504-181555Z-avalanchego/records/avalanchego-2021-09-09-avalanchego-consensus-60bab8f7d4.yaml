missing_property: "fork-boundary-state-consistency"
violated_invariant: "Block verification must reject objects whose type, parent state, and fork activation status are mutually inconsistent."
trust_boundary: "Peer-supplied blocks cross from network gossip into consensus verification and accepted state."
entrypoint_type: "proposer VM block verification at fork transition"
sensitive_sink: "accepted post-fork/pre-fork block relationship and consensus state update"

attacker_capabilities:
  - "Can relay crafted blocks near a fork boundary"
  - "Can choose block parentage that exercises oracle/pre-fork exceptions"
exploit_preconditions:
  - "Fork transition has both pre-fork and post-fork block types"
  - "Verification has an exception for oracle or parent-shaped blocks"
  - "Accepted state is consulted to classify parent/fork status"
blast_radius: "Limited to the affected validation/accounting path unless the unchecked object can enter consensus, block acceptance, shared storage, or public RPC resource consumption."

impact_types:
  - "consensus-failure"
  - "consensus-integrity"
severity_guess: "high"
severity_rationale: "This is the only confirmed security fix in the bundle; fork-boundary verification errors can affect consensus safety if invalid block relationships are accepted."

code_shape_summary: "The verifier accepted a fork-boundary child based on block shape without enough state checks for the parent fork status. The reusable shape is transition logic that must combine type checks with accepted-state facts before allowing compatibility exceptions."
search_motifs:
  - "verifyPreForkChild or similar transition helpers"
  - "oracle block exceptions near activation time"
  - "accepted state lookups added to block-type validation"
negative_signals:
  - "Rejecting malformed historical blocks is not enough if the path cannot affect current consensus"
  - "If activation has not occurred, post-fork state checks may not apply"
  - "Do not generalize to all fork code without a parent/type/state inconsistency"
patch_pattern: "Add fail-closed state checks at the fork-boundary verifier so parent status, accepted post-fork state, and block type agree before a child is accepted."

