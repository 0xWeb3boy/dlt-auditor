code_shape_summary: "Header validation now rejects positive BlobGasUsed despite generic Cancun field support. The reusable shape is a chain-specific invariant layered on top of inherited fork-format validation."
search_motifs:
  - "BlobGasUsed must be nil before fork and zero after fork"
