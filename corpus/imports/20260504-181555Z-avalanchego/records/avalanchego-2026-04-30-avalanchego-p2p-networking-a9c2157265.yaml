missing_property: "admission-policy-enforcement"
violated_invariant: "Every untrusted transaction path into a mempool or txpool must apply the configured admission policy before forwarding the transaction to shared storage or gossip."
trust_boundary: "RPC or gossip-submitted transactions cross into SAE/Subnet EVM txpool insertion."
entrypoint_type: "transaction gossip/mempool add path"
sensitive_sink: "txpool acceptance of a transaction that should be blocked by allowlist policy"

attacker_capabilities:
  - "Can submit transactions to the tx gossip or RPC-backed admission path"
  - "May use accounts or transaction types outside the configured allowlist"
exploit_preconditions:
  - "An allowlist or admission policy is configured"
  - "At least one txpool forwarding path does not call the policy hook"
  - "The txpool accepts forwarded transactions without rechecking the same policy"
blast_radius: "Limited to the affected validation/accounting path unless the unchecked object can enter consensus, block acceptance, shared storage, or public RPC resource consumption."

impact_types:
  - "access-control"
  - "policy-enforcement"
severity_guess: "medium"
severity_rationale: "Missing allowlist enforcement at mempool ingress can admit policy-forbidden transactions, but the record does not prove block execution or consensus bypass."

code_shape_summary: "A transaction admission hook was added before forwarding gossip transactions to the txpool. The reusable shape is an allowlist policy enforced in one ingress path but missing from another mempool forwarding path."
search_motifs:
  - "Admitter or allowlist hook added to txgossip addToPool"
  - "txpool.Add called after a new policy check"
  - "batched transaction admission preserves per-transaction errors"
negative_signals:
  - "If the backing txpool independently enforces the same allowlist, the missing hook is duplication"
  - "Policy disabled or nil admitter paths may intentionally preserve legacy behavior"
  - "Do not claim block inclusion unless proposer execution uses the same unchecked path"
patch_pattern: "Introduce an admission-policy interface and call it before txpool forwarding, preserving legacy pass-through only when no policy is configured."

