severity_rationale: "Wrong fork activation in state transition validation can cause invalid state acceptance, though this record does not prove an exploit beyond the corrected predicate."

code_shape_summary: "A consensus rule for rejecting invalid contract code was tied to the wrong fork predicate. The reusable shape is any fork-gated validation check whose implementation uses an adjacent upgrade flag rather than the protocol activation flag."
search_motifs:
  - "IsForkNPlusOne used around code that implements a ForkN rule"
