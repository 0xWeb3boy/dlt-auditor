missing_property: "canonical-signature-binding"
violated_invariant: "Consensus objects must be signed and verified over one canonical byte representation, with the same parent identity and signature field semantics used by construction, lookup, serialization, and verification."
trust_boundary: "Local proposer block construction and consensus block verification cross from node-local staking credentials into peer-visible consensus messages."
entrypoint_type: "consensus block production and proposer block verification"
sensitive_sink: "acceptance of a signed proposer block and its parent linkage"

attacker_capabilities:
  - "Can submit or relay proposer blocks to validators"
  - "May exploit mismatched serialized/header representations if construction and verification disagree"
exploit_preconditions:
  - "The protocol has multiple in-memory or serialized representations for the signed object"
  - "Signing or parent lookup reads different fields than verification or serialization"
  - "Validators rely on the signature to authenticate proposer block authorship"
blast_radius: "Limited to the affected validation/accounting path unless the unchecked object can enter consensus, block acceptance, shared storage, or public RPC resource consumption."

impact_types:
  - "consensus-integrity"
  - "block-authentication"
severity_guess: "medium"
severity_rationale: "A canonicalization mismatch in a consensus signature path can undermine block authentication, but this record is likely hardening because no concrete forged-block exploit is shown."

code_shape_summary: "Signing and verification-sensitive code used inconsistent proposer block header fields and key sources. The reusable shape is a consensus object with duplicate internal/exported fields where signing, serialization, and lookup must all bind the same canonical representation."
search_motifs:
  - "signing code that clears or writes one signature field while serialization reads another"
  - "parent or block ID lookup using exported fields when validation uses internal fields"
  - "staking certificate private key paths split from consensus block signing paths"
negative_signals:
  - "Pure field renames without a signed serialization boundary are likely non-security"
  - "If tests prove both representations are normalized before signing, the mismatch may be cosmetic"
  - "Do not infer signature forgery without evidence that verification accepted noncanonical bytes"
patch_pattern: "Collapse signing, parent lookup, and serialization-sensitive mutation onto the canonical internal header representation and sign with the intended staking private key."

