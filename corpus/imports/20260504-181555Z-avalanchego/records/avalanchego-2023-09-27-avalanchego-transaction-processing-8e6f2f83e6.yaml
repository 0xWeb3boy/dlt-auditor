severity_guess: "medium"
severity_rationale: "Fail-closed context checks protect validation integrity, but this finding does not prove a bypass or chain impact."

code_shape_summary: "Predicate checking gained explicit missing-context errors before verification-sensitive logic continues. The reusable shape is a validation function that accepts optional context but must require it whenever the checked object depends on it."
search_motifs:
  - "nil PredicateContext checks added near predicate verification"
  - "ErrMissingPredicateContext or fail-closed context errors"
  - "early return only when no predicates are present"
negative_signals:
  - "No-predicate transactions may intentionally skip context"
  - "A nil check in test scaffolding is not a vulnerability by itself"
  - "Do not claim bypass unless required predicates can be evaluated without context"
patch_pattern: "Preserve early exits for objects that do not need context, but reject nil or incomplete context before verifying objects that do."

