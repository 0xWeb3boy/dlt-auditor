missing_property: "required-context-presence"
violated_invariant: "A verifier that requires external execution context must fail closed when that context is absent or incomplete."
trust_boundary: "Transaction predicate data crosses from block execution context into predicate verification."
entrypoint_type: "predicate validation during transaction or block processing"
sensitive_sink: "predicate verification result used to admit transaction execution"

attacker_capabilities:
  - "Can submit transactions requiring predicate verification"
  - "May influence whether block/proposer context is present in a validation call path"
exploit_preconditions:
  - "Some transactions require predicate context"
  - "The verifier can be invoked with nil or incomplete context"
  - "Missing context previously was not rejected before verification proceeded"
blast_radius: "Limited to the affected validation/accounting path unless the unchecked object can enter consensus, block acceptance, shared storage, or public RPC resource consumption."

impact_types:
